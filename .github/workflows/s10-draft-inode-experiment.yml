name: S10 draft-only native inode experiment

# Temporary diagnostic route. Remove before opening the integrated S10 PR.
on:
  push:
    branches: [draft/tz6v5-s10-integrated]
    paths:
      - scripts/stage2-opnsense-s10-inode-probe.py
      - scripts/test-managed-inode-barrier.py
      - scripts/test-tz6v5-s10b1-original-journal-binding.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/managed_inode_barrier.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/shared_apply_operation.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_destination_commit.py

permissions:
  contents: read

concurrency:
  group: s10-draft-inode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3.13 -m py_compile scripts/stage2-opnsense-s10-inode-probe.py scripts/s10_inode_barrier_fixture.py
          python3.13 -m py_compile scripts/test-managed-inode-barrier.py scripts/test-tz6v5-s10b1-original-journal-binding.py
          python3.13 -m py_compile src/opnsense/scripts/OPNsense/Zapret/backend/managed_inode_barrier.py src/opnsense/scripts/OPNsense/Zapret/backend/shared_apply_operation.py src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_destination_commit.py
          python3.13 scripts/test-managed-inode-barrier.py -v
          python3.13 scripts/test-tz6v5-s10b1-original-journal-binding.py -k managed
          python3.13 scripts/s10_inode_barrier_fixture.py -v
          python3.13 scripts/stage2-opnsense-s10-inode-probe.py --portable
  native:
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Isolated native UFS and ZFS experiment (not G03 acceptance)
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: '26.7'
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            export GITHUB_ACTIONS=true ZAPRET2_G03_DISPOSABLE_NATIVE=1
            probe=scripts/stage2-opnsense-s10-inode-probe.py
            py=/usr/local/bin/python3
            "$py" scripts/s10_inode_barrier_fixture.py -v
            "$py" scripts/test-managed-inode-barrier.py -v
            "$py" scripts/test-tz6v5-s10b1-original-journal-binding.py -k managed
            "$py" "$probe" --focused --expect-filesystem ufs --expect-wal-filesystem ufs
            # An isolated file-backed pool only; no existing device or pool is touched.
            /sbin/kldstat -q -m zfs || /sbin/kldload zfs
            tmp=$(mktemp -d /var/tmp/s10-zfs-probe.XXXXXXXX)
            pool=s10probe_$$
            created=0
            cleanup() {
              if [ "$created" = 1 ]; then
                /sbin/zpool destroy "$pool" || return 1
              fi
              rm -rf -- "$tmp"
            }
            trap cleanup EXIT
            trap 'exit 1' HUP INT TERM
            /usr/bin/truncate -s 512m "$tmp/vdev"
            mkdir "$tmp/mount"
            /sbin/zpool create -o cachefile=none -m "$tmp/mount" "$pool" "$tmp/vdev"
            created=1
            "$py" "$probe" --focused --base "$tmp/mount" --expect-filesystem zfs --expect-wal-filesystem zfs
            "$py" "$probe" --focused --wal-base "$tmp/mount" --expect-filesystem ufs --expect-wal-filesystem zfs
            "$py" "$probe" --focused --base "$tmp/mount" --wal-base /usr/local/etc --expect-filesystem zfs --expect-wal-filesystem ufs
            /sbin/zpool destroy "$pool"
            created=0
            echo S10_DISPOSABLE_ZFS_POOL_CLEANUP=PASS
