name: Testing package delivery contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-prerelease.yml'
      - '.github/workflows/testing-package-delivery-ci.yml'
      - 'scripts/test-github-branch-hygiene.sh'

permissions:
  contents: read

jobs:
  governance:
    name: Validate testing-package delivery governance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Validate delivery contract syntax
        run: |
          sh -n scripts/test-github-branch-hygiene.sh
          sh scripts/test-github-branch-hygiene.sh

  package:
    name: Qualify official OPNsense 26.7 testing-package build (source-only)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build candidate inside qualified OPNsense 26.7
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: true
          disable-cache: true
          mem: 4096
          cpu: 2
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            sh scripts/compatibility-bootstrap.sh
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.sha }}" sh scripts/build-pkg.sh

      - name: Verify exact native package identity and policy
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          revision=$(sed -nE 's/^PLUGIN_REVISION=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' Makefile)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$revision" =~ ^[1-9][0-9]*$ ]]
          package="dist/os-zapret2-restyle-${version}_${revision}.pkg"
          test -f "$package"
          tar -xOf "$package" +MANIFEST | jq -e --arg v "${version}_${revision}" '.name == "os-zapret2-restyle" and .version == $v and .abi == "FreeBSD:15:amd64" and .arch == "freebsd:15:x86:64"'
          member=$(tar -tf "$package" | grep -E '(^|/)share/zapret2-restyle/compatibility[.]json$')
          test "$(printf '%s\n' "$member" | wc -l)" -eq 1
          tar -xOf "$package" "$member" | cmp - compatibility.json
          sha256sum "$package"
          echo 'PASS: source-only native testing-package candidate verified; not published or installed'
