name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag and VERSION
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          VERSION_VALUE=$(tr -d '[:space:]' < VERSION)
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [ "${TAG_VERSION}" = "${VERSION_VALUE}" ]
          grep -Eq '^PLUGIN_NAME=[[:space:]]+zapret2-restyle$' Makefile
          grep -Eq '^PLUGIN_VERSION!=[[:space:]]+/bin/cat \$\{\.CURDIR\}/VERSION$' Makefile

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Require release notes for exact semantic tag
        shell: bash
        run: |
          set -euo pipefail
          test -s "docs/releases/${GITHUB_REF_NAME}.md" || {
            echo "REFUSED: missing release documentation for ${GITHUB_REF_NAME}" >&2
            exit 1
          }
          grep -Fq "os-zapret2-restyle ${GITHUB_REF_NAME}" "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail
          find src -type f -name '*.xml' -exec xmllint --noout {} \;
          find src -type f -name '*.sh' -exec sh -n {} \;
          find pkg -type f -exec sh -n {} \;
          find scripts -type f -name '*.sh' -exec sh -n {} \;
          docker run --rm -v "${PWD}":/app -w /app php:8.2-cli sh -c '
            set -e
            find src -type f -name "*.php" -exec php -l {} \;
            find src -type f -name "*.inc" -exec php -l {} \;
          '

  build:
    name: Build package and repository
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION_VALUE=$(tr -d '[:space:]' < VERSION)
          REVISION=$(sed -n 's/^PLUGIN_REVISION=[[:space:]]*//p' Makefile | head -1)
          if [[ -n "${REVISION}" && "${REVISION}" != "0" ]]; then
            PACKAGE_VERSION="${VERSION_VALUE}_${REVISION}"
          else
            PACKAGE_VERSION="${VERSION_VALUE}"
          fi
          echo "version=${VERSION_VALUE}" >> "${GITHUB_OUTPUT}"
          echo "asset=os-zapret2-restyle-${PACKAGE_VERSION}.pkg" >> "${GITHUB_OUTPUT}"

      - name: Build package and pkg repository inside qualified OPNsense 26.7
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: true
          disable-cache: true
          mem: 4096
          cpu: 2
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            GITHUB_ACTIONS=true ZAPRET2_NATIVE_RELEASE_CANDIDATE=1 ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.sha }}" sh scripts/build-pkg.sh
            sh scripts/verify-release-package.sh
            sh scripts/build-pkg-repository.sh

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/${{ steps.release.outputs.asset }}"
          test -f "pages/FreeBSD:15:amd64/${{ steps.release.outputs.asset }}"
          test -f "pages/FreeBSD:15:amd64/meta.conf"
          test -f "pages/FreeBSD:15:amd64/data.pkg"
          test -f "pages/FreeBSD:15:amd64/packagesite.pkg"
          test -f "pages/FreeBSD:15:amd64/SHA256SUMS"
          test -f "pages/zapret2-restyle.conf"

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          cp "dist/${{ steps.release.outputs.asset }}" release-assets/
          cp "pages/FreeBSD:15:amd64/SHA256SUMS" release-assets/

      - name: Upload release build
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: release-assets
          if-no-files-found: error

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --dereference \
            --hard-dereference \
            --directory pages \
            -cvf "${RUNNER_TEMP}/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude='.[^/]*' \
            .

      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-build
          path: release-build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-build/*.pkg
            release-build/SHA256SUMS
          draft: false
          prerelease: false
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true

  deploy-pages:
    name: Publish pkg repository
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
