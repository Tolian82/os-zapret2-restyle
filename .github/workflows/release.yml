name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and VERSION
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          VERSION_VALUE=$(tr -d '[:space:]' < VERSION)

          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must use vMAJOR.MINOR.PATCH"
            exit 1
          }

          [ "${TAG_VERSION}" = "${VERSION_VALUE}" ] || {
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION=${VERSION_VALUE}"
            exit 1
          }

          grep -Eq '^PLUGIN_NAME=[[:space:]]+zapret2-restyle$' Makefile
          grep -Eq '^PLUGIN_VERSION!=[[:space:]]+/bin/cat \$\{\.CURDIR\}/VERSION$' Makefile

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate XML files
        run: find src -type f -name "*.xml" -exec xmllint --noout {} \;

      - name: Lint PHP files
        run: |
          docker run --rm -v "${PWD}":/app -w /app php:8.2-cli sh -c '
            set -e
            find src -type f -name "*.php" -exec php -l {} \;
            find src -type f -name "*.inc" -exec php -l {} \;
          '

      - name: Validate shell scripts
        run: |
          find src -type f -name "*.sh" -exec sh -n {} \;
          find pkg -type f -exec sh -n {} \;
          find scripts -type f -name "*.sh" -exec sh -n {} \;

  release:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          VERSION_VALUE=$(tr -d '[:space:]' < VERSION)
          REVISION=$(sed -n 's/^PLUGIN_REVISION=[[:space:]]*//p' Makefile | head -1)

          if [[ -n "${REVISION}" && "${REVISION}" != "0" ]]; then
            PACKAGE_VERSION="${VERSION_VALUE}_${REVISION}"
          else
            PACKAGE_VERSION="${VERSION_VALUE}"
          fi

          ASSET="os-zapret2-restyle-${PACKAGE_VERSION}.pkg"

          echo "version=${VERSION_VALUE}" >> "${GITHUB_OUTPUT}"
          echo "package_version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "asset=${ASSET}" >> "${GITHUB_OUTPUT}"

      - name: Build package inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: pkg install -y jq
          run: sh scripts/build-pkg.sh

      - name: Verify release asset
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="dist/${{ steps.release.outputs.asset }}"
          test -f "${EXPECTED}" || {
            echo "Missing expected release asset: ${EXPECTED}"
            ls -la dist || true
            exit 1
          }

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "${PREV_TAG}" ]; then
            git log --pretty=format:'- %s' "${PREV_TAG}..HEAD" > /tmp/changes.txt
          else
            git log --pretty=format:'- %s' > /tmp/changes.txt
          fi

          cat > /tmp/release-notes.md <<EOF
          ## Installation

          Install from SSH on the OPNsense firewall:

          \`\`\`sh
          fetch -o /tmp/os-zapret2-restyle.pkg \
            https://github.com/Tolian82/os-zapret2-restyle/releases/download/v${{ steps.release.outputs.version }}/${{ steps.release.outputs.asset }}

          pkg add /tmp/os-zapret2-restyle.pkg

          /usr/local/opnsense/scripts/OPNsense/Zapret/setup.sh
          \`\`\`

          Configure the plugin under **Services > Zapret DPI Bypass**.

          Internal service commands retain the stable service name:

          \`\`\`sh
          configctl zapret status
          configctl zapret restart
          \`\`\`

          To uninstall:

          \`\`\`sh
          pkg delete os-zapret2-restyle
          \`\`\`

          ## Requirements

          - Supported OPNsense installation based on FreeBSD 14.x
          - Internet access during runtime setup
          - Runtime prerequisites installed by the project setup script

          ## Changes
          EOF

          cat /tmp/changes.txt >> /tmp/release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.release.outputs.asset }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: true
          generate_release_notes: false
