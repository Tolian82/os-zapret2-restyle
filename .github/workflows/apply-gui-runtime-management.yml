name: Apply GUI runtime management patch

on:
  push:
    branches:
      - agent/gui-zapret2-service

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/gui-zapret2-service
          fetch-depth: 0

      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/gui-runtime-management.patch.gz.b64 | gzip --decompress > /tmp/gui-runtime-management.patch
          git apply --check /tmp/gui-runtime-management.patch
          git apply /tmp/gui-runtime-management.patch
          rm -f .github/gui-runtime-management.patch.gz.b64
          rm -f .github/workflows/apply-gui-runtime-management.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add GUI Zapret2 service management'
          git push origin HEAD:agent/gui-zapret2-service
