name: Pull request title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-title:
    name: Validate versioned PR and commit subjects
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require exact package-candidate prefix everywhere
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < VERSION)
          revision=$(sed -n 's/^PLUGIN_REVISION=[[:space:]]*//p' Makefile | head -1)

          expected="v${version}"
          if [[ -n "${revision}" && "${revision}" != "0" ]]; then
            expected="${expected}_${revision}"
          fi

          case "${PR_TITLE}" in
            "${expected}: "*)
              echo "Pull-request title matches package candidate ${expected}."
              ;;
            *)
              echo "Invalid pull-request title: ${PR_TITLE}" >&2
              echo "Required format: ${expected}: <logical change>" >&2
              exit 1
              ;;
          esac

          commit_count=0
          invalid_count=0

          while IFS= read -r subject
          do
            commit_count=$((commit_count + 1))
            case "${subject}" in
              "${expected}: "*)
                echo "Valid commit subject: ${subject}"
                ;;
              *)
                echo "Invalid commit subject: ${subject}" >&2
                echo "Required format: ${expected}: <logical change>" >&2
                invalid_count=$((invalid_count + 1))
                ;;
            esac
          done < <(git log --format=%s "${BASE_SHA}..${HEAD_SHA}")

          if [[ "${commit_count}" -eq 0 ]]; then
            echo "No pull-request commits found between ${BASE_SHA} and ${HEAD_SHA}." >&2
            exit 1
          fi

          if [[ "${invalid_count}" -ne 0 ]]; then
            echo "${invalid_count} pull-request commit subject(s) lack ${expected}: prefix." >&2
            exit 1
          fi

          echo "All ${commit_count} pull-request commit subject(s) match ${expected}."
