name: Stage 3 receipt-bound seed and signed archive provenance

on:
  pull_request:
    paths:
      - Makefile
      - scripts/stage3-native-prepkg-archive-bootstrap.py
      - scripts/test-stage3-native-prepkg-archive-bootstrap.py
      - scripts/native-prepkg-standalone.py
      - scripts/test-native-prepkg-standalone.py
      - scripts/stage3-prepkg-operator-approval.py
      - scripts/test-stage3-prepkg-operator-approval.py
      - scripts/stage3-prepkg-trust-seed.py
      - scripts/test-stage3-prepkg-trust-seed.py
      - scripts/stage3-prepkg-verified-eval.py
      - scripts/test-stage3-prepkg-verified-eval.py
      - scripts/test-stage3-prepkg-signed-provenance.py
      - scripts/native-opnsense-package.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/native_pkg_managed.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/native_pkg_candidate.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/native_pkg_handoff.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/native_pkg_old_owner.py
      - .github/workflows/stage3-native-prepkg-archive-bootstrap.yml
  workflow_dispatch:
    inputs:
      fast_only:
        description: Offline contracts only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  exact-native-archive-bootstrap:
    name: Verify receipt-only hashes through RSA signed archives and original FD9 without pkg
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check native archive bootstrap unit, no-pkg and source syntax
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage3-native-prepkg-archive-bootstrap.py scripts/test-stage3-native-prepkg-archive-bootstrap.py scripts/native-prepkg-standalone.py scripts/test-native-prepkg-standalone.py scripts/stage3-prepkg-operator-approval.py scripts/test-stage3-prepkg-operator-approval.py scripts/stage3-prepkg-trust-seed.py scripts/test-stage3-prepkg-trust-seed.py scripts/stage3-prepkg-verified-eval.py scripts/test-stage3-prepkg-verified-eval.py scripts/test-stage3-prepkg-signed-provenance.py
          python3.13 scripts/test-stage3-native-prepkg-archive-bootstrap.py -v
          python3.13 scripts/test-native-prepkg-standalone.py -v
          python3.13 scripts/test-stage3-prepkg-operator-approval.py -v
          python3.13 scripts/test-stage3-prepkg-trust-seed.py -v
          python3.13 scripts/test-stage3-prepkg-verified-eval.py -v
          python3.13 scripts/test-stage3-prepkg-signed-provenance.py -v
      - name: Real official Mk archive pre-pkg source on old 0.6.2_1 disposable OPNsense
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.fast_only != true) }}
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: '26.7'
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit lua54
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE3_PREPKG_ARCHIVE_BOOTSTRAP=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage3-native-prepkg-archive-bootstrap.py /tmp/os-zapret2-restyle-0.6.2_1.pkg
