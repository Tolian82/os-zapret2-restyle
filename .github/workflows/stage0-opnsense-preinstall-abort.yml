name: Stage 0 characterize incoming PRE_INSTALL refusal on OPNsense

on:
  pull_request:
    paths:
      - scripts/stage0-opnsense-preinstall-abort.py
      - scripts/test-stage0-opnsense-preinstall-abort.py
      - .github/workflows/stage0-opnsense-preinstall-abort.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  incoming-preinstall-refusal:
    name: Real pkg add -f incoming pre-install refusal versus preserved fixture
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Offline refusal and no-mutation contract preflight
        run: |
          python3.13 -m py_compile scripts/stage0-opnsense-preinstall-abort.py scripts/test-stage0-opnsense-preinstall-abort.py
          python3.13 scripts/test-stage0-opnsense-preinstall-abort.py -v
      - name: Measure incoming hook failure on synthetic packages in disposable OPNsense 26.7
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          mem: 4096
          cpu: 2
          disable-cache: true
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            /usr/local/bin/python3 scripts/stage0-opnsense-preinstall-abort.py
