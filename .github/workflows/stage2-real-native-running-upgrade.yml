name: Stage 2 genuine RUNNING old owner to official native OPNsense successor

on:
  push:
    branches:
      - stage2/native-real-running-upgrade-v0.6.2_64
  pull_request:
    paths:
      - Makefile
      - scripts/native-opnsense-package.py
      - scripts/stage2-opnsense-real-native-clean-install.py
      - scripts/stage2-opnsense-real-native-stopped-upgrade.py
      - scripts/stage2-opnsense-real-native-running-upgrade.py
      - scripts/test-stage2-opnsense-real-native-running-upgrade.py
      - .github/workflows/stage2-real-native-running-upgrade.yml
  workflow_dispatch:
    inputs:
      fast_only:
        description: Run only the fast negative source contracts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  real-running-replacement:
    name: Actual old RUNNING lo0 engine to official native package and restored owned RUNNING
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Mandatory fast preflight (real runner contracts)
        shell: bash
        run: |
          set -euo pipefail
          python3.13 -m py_compile scripts/stage2-opnsense-real-native-running-upgrade.py scripts/test-stage2-opnsense-real-native-running-upgrade.py
          python3.13 scripts/test-stage2-opnsense-real-native-running-upgrade.py -v
          python3.13 scripts/test-native-opnsense-package.py -v
      - name: Genuine RUNNING historical owner to official native successor in disposable OPNsense
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.fast_only != true) }}
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit lua54
            /usr/local/bin/pkgconf --exists lua-5.4
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE0_DISPOSABLE_RUNNING_TEST=1 ZAPRET2_STAGE2_REAL_RUNNING_UPGRADE=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage2-opnsense-real-native-running-upgrade.py /tmp/os-zapret2-restyle-0.6.2_1.pkg
