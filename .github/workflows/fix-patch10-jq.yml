name: Fix Patch 10 jq fixture

on:
  push:
    paths:
      - .github/workflows/fix-patch10-jq.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/strategy-lab-e2e-harness
      - name: Pass CI jq path and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-strategy-lab-e2e.sh')
          text = path.read_text()
          old = '''    SCRIPT_DIR="${SCRIPT_DIR}" \\
    MODULE_DIR="${MODULE_DIR}" \\'''
          new = '''    SCRIPT_DIR="${SCRIPT_DIR}" \\
    MODULE_DIR="${MODULE_DIR}" \\
    STRATEGY_LAB_JQ="$(command -v jq)" \\'''
          if old not in text:
              raise SystemExit('expected api_call environment block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-patch10-jq.yml
          git config user.name 'Tolian82'
          git config user.email '309637356+Tolian82@users.noreply.github.com'
          git add scripts/test-strategy-lab-e2e.sh .github/workflows/fix-patch10-jq.yml
          git commit -m 'test: pass jq path into Strategy Lab integration'
          git push origin HEAD:agent/strategy-lab-e2e-harness
