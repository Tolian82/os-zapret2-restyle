name: G05 native RUNNING WAN full Apply and reverse with shared Voice

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/stage2-opnsense-g05-wan-running.py
      - scripts/stage2-opnsense-g05-wan-rollback.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-g05-running:
    name: G05 active-owner WAN and Voice/IPFW negative source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Strict running WAN request and owner witness contracts
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage2-opnsense-g05-wan-running.py
          python3.13 scripts/stage2-opnsense-g05-wan-running.py --self-test
          python3.13 -m py_compile scripts/stage2-opnsense-g05-wan-rollback.py
          python3.13 scripts/stage2-opnsense-g05-wan-rollback.py --self-test
          sh scripts/test-g05-wan-route.sh
          php scripts/test-g05-wan-config.php

  native-g05-running:
    needs: fast-g05-running
    name: OPNsense 26.7 RUNNING Voice WAN switch and reverse via original FD9
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Genuine old RUNNING upgrade, native Voice and authenticated WAN change
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit lua54
            /usr/local/bin/pkgconf --exists lua-5.4
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            export GITHUB_ACTIONS=true
            export ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1
            export ZAPRET2_NATIVE_BUILD_CI=1
            export ZAPRET2_STAGE0_DISPOSABLE_RUNNING_TEST=1
            export ZAPRET2_STAGE2_REAL_RUNNING_UPGRADE=1
            export ZAPRET2_STAGE2_REAL_ACTIVE_SERVICE=1
            export ZAPRET2_STAGE2_REAL_COMMON_VOICE=1
            export ZAPRET2_STAGE2_REAL_VOICE_HTTP=1
            export ZAPRET2_G05_RUNNING_WAN_NATIVE=1
            export ZAPRET2_G05_ROLLBACK_NATIVE=1
            export ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            /usr/local/bin/python3 scripts/stage2-opnsense-real-native-running-upgrade.py /tmp/os-zapret2-restyle-0.6.2_1.pkg
            /usr/local/bin/python3 scripts/stage2-opnsense-real-native-shared-voice.py run
            /usr/local/bin/python3 scripts/stage2-opnsense-real-native-voice-http.py run
            /usr/local/bin/python3 scripts/stage2-opnsense-g05-wan-running.py run
            /usr/local/bin/python3 scripts/stage2-opnsense-g05-wan-rollback.py run
