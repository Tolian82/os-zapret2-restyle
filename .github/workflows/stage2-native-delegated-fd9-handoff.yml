name: Stage 2 native old hook FD9 delegation through actual pkg
on:
  pull_request:
    paths:
      - Makefile
      - scripts/stage2-native-delegated-fd9-handoff.py
      - scripts/test-stage2-native-delegated-fd9-handoff.py
      - scripts/stage3-native-late-owner-veto.py
      - scripts/test-stage3-native-late-owner-veto.py
      - scripts/stage3-native-configd-inline-veto.py
      - scripts/test-stage3-native-configd-inline-veto.py
      - scripts/stage3-native-configd-detached-fd9.py
      - scripts/test-stage3-native-configd-detached-fd9.py
      - scripts/stage3-native-configd-fd9-handoff.py
      - scripts/test-stage3-native-configd-fd9-handoff.py
      - scripts/test-native-pkg-handoff.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/native_pkg_handoff.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/native_pkg_candidate.py
      - scripts/test-native-pkg-candidate.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/native_pkg_managed.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/native_pkg_old_owner.py
      - scripts/test-native-pkg-old-owner.py
      - scripts/test-native-pkg-managed.py
      - scripts/stage3-native-configd-fd9-faults.py
      - scripts/test-stage3-native-configd-fd9-faults.py
      - scripts/test-stage3-native-configd-fd9-readonly-pkg.py
      - scripts/stage3-native-configd-final-gate.py
      - scripts/test-stage3-native-configd-final-gate.py
      - scripts/stage3-native-configd-mutating-pkg.py
      - scripts/test-stage3-native-configd-mutating-pkg.py
      - scripts/stage3-native-configd-operator-grant-ci.py
      - scripts/test-stage3-native-configd-operator-grant-ci.py
      - scripts/stage3-prepkg-operator-operation-grant-ci.py
      - scripts/stage2-prepkg-locked-cold-revalidation.py
      - scripts/stage2-opnsense-real-native-stopped-upgrade.py
      - scripts/stage2-opnsense-real-native-clean-install.py
      - scripts/native-opnsense-package.py
      - .github/workflows/stage2-native-delegated-fd9-handoff.yml
  workflow_dispatch:
    inputs:
      fast_only:
        description: Offline tests only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  delegated-old-hook:
    name: Real published old hooks, single FD9 holder, test-only delegated pkg
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Offline delegated lock ticket and native pkg fail-closed contracts
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage2-native-delegated-fd9-handoff.py scripts/test-stage2-native-delegated-fd9-handoff.py
          python3.13 scripts/test-stage2-native-delegated-fd9-handoff.py -v
      - name: Native OPNsense 26.7 old installed predecessor managed delegation to actual pkg
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.fast_only != true) }}
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit lua54
            /usr/local/bin/pkgconf --exists lua-5.4
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            GITHUB_ACTIONS=true ZAPRET2_STAGE2_LOCKED_COLD_REVALIDATION=1 ZAPRET2_STAGE2_DELEGATED_FD9_HANDOFF=1 ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage2-native-delegated-fd9-handoff.py /tmp/os-zapret2-restyle-0.6.2_1.pkg

  late-owner-negatives:
    name: Genuine published old owner, locked gate, late journal and IPFW no-pkg negatives
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run fail-closed shared native dispatch source tests first
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage2-native-delegated-fd9-handoff.py scripts/stage3-native-late-owner-veto.py scripts/test-stage3-native-late-owner-veto.py
          python3.13 scripts/test-stage3-native-late-owner-veto.py -v
          python3.13 scripts/test-stage2-native-delegated-fd9-handoff.py -v
      - name: Test authentic original old package late fault refusal on disposable OPNsense 26.7
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.fast_only != true) }}
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit lua54
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            GITHUB_ACTIONS=true ZAPRET2_STAGE2_LOCKED_COLD_REVALIDATION=1 ZAPRET2_STAGE2_DELEGATED_FD9_HANDOFF=1 ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE3_LATE_OWNER_VETO=1 /usr/local/bin/python3 scripts/stage3-native-late-owner-veto.py /tmp/os-zapret2-restyle-0.6.2_1.pkg


  configd-inprocess-veto:
    name: Actual configctl/configd worker refuses self-terminating package hook before pkg
