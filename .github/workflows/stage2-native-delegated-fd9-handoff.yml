            GITHUB_ACTIONS=true ZAPRET2_STAGE3_DETACHED_FD9=1 ZAPRET2_STAGE3_ATOMIC_HANDOFF=1 ZAPRET2_STAGE3_READONLY_PKG=1 ZAPRET2_STAGE3_READONLY_PKG_CI=1 ZAPRET2_STAGE2_LOCKED_COLD_REVALIDATION=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage3-native-configd-fd9-handoff.py "${{ github.event.pull_request.head.sha || github.sha }}"

