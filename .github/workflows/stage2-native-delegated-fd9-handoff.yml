            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            GITHUB_ACTIONS=true ZAPRET2_STAGE3_DETACHED_FD9=1 ZAPRET2_STAGE2_LOCKED_COLD_REVALIDATION=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage3-native-configd-detached-fd9.py "${{ github.event.pull_request.head.sha || github.sha }}"

