          python3.13 scripts/test-native-pkg-managed.py -v
          python3.13 scripts/test-stage3-native-configd-mutating-pkg.py -v
          python3.13 scripts/test-stage3-native-configd-final-gate.py -v
          python3.13 scripts/test-stage3-native-configd-fd9-readonly-pkg.py -v
          python3.13 scripts/test-stage3-native-configd-fd9-faults.py -v
          python3.13 scripts/test-stage3-native-configd-fd9-handoff.py -v
          python3.13 scripts/test-stage2-native-delegated-fd9-handoff.py -v
      - name: Genuine official Mk successor native pkg under transferred original FD9 on disposable OPNsense 26.7
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.fast_only != true) }}
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
