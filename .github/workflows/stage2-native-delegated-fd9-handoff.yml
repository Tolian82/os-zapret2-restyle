          python3.13 scripts/test-stage3-native-configd-operator-grant-ci.py -v
          python3.13 -m py_compile src/opnsense/scripts/OPNsense/Zapret/backend/native_pkg_candidate.py scripts/test-native-pkg-candidate.py
          python3.13 scripts/test-native-pkg-candidate.py -v
