name: Fix Patch 8 jq option order

on:
  push:
    paths:
      - .github/workflows/fix-patch8-jq-order.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/strategy-lab-circular-eligibility
      - name: Fix jq option order and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/opnsense/scripts/OPNsense/Zapret/strategy_lab/circular.sh')
          text = path.read_text()
          old = '''            elif ! "${STRATEGY_LAB_JQ}" -e '\n                .circular_eligible==true and\n                .circular_eligibility_reason=="eligible" and\n                .circular_candidate_count==$count\n            ' --argjson count "${_slcirc_count}" "${_slcirc_status}" >/dev/null; then'''
          new = '''            elif ! "${STRATEGY_LAB_JQ}" -e --argjson count "${_slcirc_count}" '\n                .circular_eligible==true and\n                .circular_eligibility_reason=="eligible" and\n                .circular_candidate_count==$count\n            ' "${_slcirc_status}" >/dev/null; then'''
          if old not in text:
              raise SystemExit('expected jq eligibility block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-patch8-jq-order.yml
          git config user.name 'Tolian82'
          git config user.email '309637356+Tolian82@users.noreply.github.com'
          git add src/opnsense/scripts/OPNsense/Zapret/strategy_lab/circular.sh .github/workflows/fix-patch8-jq-order.yml
          git commit -m 'chore: fix circular eligibility jq option order'
          git push origin HEAD:agent/strategy-lab-circular-eligibility
