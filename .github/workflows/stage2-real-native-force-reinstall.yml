name: Stage 2 true native STOPPED same-version force reinstall

on:
  pull_request:
    paths:
      # Provider/archive-only builder changes use the central native package gate.
      - scripts/stage2-opnsense-real-native-clean-install.py
      - scripts/stage2-opnsense-real-native-stopped-upgrade.py
      - scripts/stage2-opnsense-real-native-force-reinstall.py
      - scripts/test-stage2-opnsense-real-native-force-reinstall.py
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  same-version-reinstall:
    name: Real stopped package native pkg add -f with identical version on isolated OPNsense
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fast contract check before native package operation
        shell: bash
        run: |
          set -euo pipefail
          python3.13 -m py_compile scripts/stage2-opnsense-real-native-force-reinstall.py scripts/test-stage2-opnsense-real-native-force-reinstall.py
          python3.13 scripts/test-stage2-opnsense-real-native-force-reinstall.py -v
          python3.13 scripts/test-native-opnsense-package.py -v
      - name: Genuine forced same-version reinstall with original hooks in disposable OPNsense
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit lua54
            /usr/local/bin/pkgconf --exists lua-5.4
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1 ZAPRET2_STAGE2_REAL_SAME_VERSION_REINSTALL=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage2-opnsense-real-native-force-reinstall.py
