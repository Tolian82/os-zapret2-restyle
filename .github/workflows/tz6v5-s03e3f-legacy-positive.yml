name: TZ6v5 S03e3f genuine legacy Start Restart Stop HTTP receipts

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/test-tz6v5-s03e3f-legacy-positive.py
      - .github/workflows/tz6v5-s03e3f-legacy-positive.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-legacy:
    name: S03e3f no-Linux-side-effect and strict terminal receipt contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify source and native-only barrier
        shell: bash
        run: |
          set -euo pipefail
          python3.13 -m py_compile scripts/test-tz6v5-s03e3f-legacy-positive.py
          python3.13 -m py_compile scripts/test-tz6v5-s03e3f-source-manifest.py
          python3.13 scripts/test-tz6v5-s03e3f-legacy-positive.py --self-test
          if GITHUB_ACTIONS=true ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_S03E3F_DISPOSABLE_NATIVE=1 \
              python3.13 scripts/test-tz6v5-s03e3f-legacy-positive.py run > /tmp/legacy-gate.txt 2>&1; then
            echo '::error::legacy native probe was allowed to run on Linux'
            exit 1
          fi
          grep -q S03E3F_DISPOSABLE_OPNSENSE_ONLY /tmp/legacy-gate.txt

  native-legacy:
    needs: fast-legacy
    name: Fresh OPNsense 26.7 actual legacy engine and original FD9 HTTP transitions
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind host Git HEAD and all tracked bytes to guest tar
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_ACTIONS=true
          export ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          digest="$(python3 scripts/test-tz6v5-s03e3f-source-manifest.py create)"
          test "${#digest}" -eq 64
          echo "S03E3F_SOURCE_MANIFEST_SHA256=$digest" >> "$GITHUB_ENV"
      - name: Real Mk clean pkg, real v1.0.7 upstream, Legacy only, HTTP receipt
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            export GITHUB_ACTIONS=true
            export ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1
            export ZAPRET2_NATIVE_BUILD_CI=1
            export ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1
            export ZAPRET2_S03E3F_DISPOSABLE_NATIVE=1
            export ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export ZAPRET2_S03E3F_SOURCE_MANIFEST_SHA256="${{ env.S03E3F_SOURCE_MANIFEST_SHA256 }}"
            /usr/local/bin/python3 scripts/stage2-opnsense-real-native-clean-install.py
            /usr/local/bin/python3 scripts/test-tz6v5-s03e3f-legacy-positive.py run
