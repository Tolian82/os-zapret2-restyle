name: G11 native inert empty Apply before upstream installation
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/stage2-opnsense-g11-empty-runtime-apply.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fast-g11:
    name: G11 no-runtime API message source contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          set -eu
          python3.13 -m py_compile scripts/stage2-opnsense-g11-empty-runtime-apply.py
          python3.13 scripts/stage2-opnsense-g11-empty-runtime-apply.py --self-test
          php scripts/test-g11-empty-runtime-apply.php

  native-g11:
    needs: fast-g11
    name: One OPNsense 26.7 no-runtime HTTPS Apply native gate
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Real G05 first WAN Save then inert no-runtime Apply, one guest
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            export GITHUB_ACTIONS=true
            export ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1
            export ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1
            export ZAPRET2_NATIVE_BUILD_CI=1
            export ZAPRET2_G05_DISPOSABLE_NATIVE=1
            export ZAPRET2_G11_EMPTY_RUNTIME_NATIVE=1
            export ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            /usr/local/bin/python3 scripts/stage2-opnsense-g11-empty-runtime-apply.py run
