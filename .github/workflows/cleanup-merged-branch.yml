name: Cleanup merged branch fallback

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete merged same-repository head branch
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Delete the merged task branch when it still exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ -z "${HEAD_REF}" || "${HEAD_REF}" == "${DEFAULT_BRANCH}" ]]; then
            echo "No deletable task branch was supplied."
            exit 0
          fi

          get_endpoint="repos/${REPOSITORY}/git/ref/heads/${HEAD_REF}"
          delete_endpoint="repos/${REPOSITORY}/git/refs/heads/${HEAD_REF}"

          if ! gh api "${get_endpoint}" >/dev/null 2>&1; then
            echo "Branch ${HEAD_REF} is already absent."
            exit 0
          fi

          gh api --method DELETE "${delete_endpoint}"
          echo "Deleted merged task branch ${HEAD_REF}."
