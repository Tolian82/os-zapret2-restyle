name: Cleanup merged branch

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Delete merged head branch
    runs-on: ubuntu-latest

    steps:
      - name: Delete same-repository PR head branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          prs=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPOSITORY}/commits/${COMMIT_SHA}/pulls")

          head_ref=$(jq -r \
            --arg repository "${REPOSITORY}" \
            --arg default_branch "${DEFAULT_BRANCH}" \
            '
              map(select(
                .merged_at != null and
                .head.repo.full_name == $repository and
                .base.ref == $default_branch
              ))
              | first
              | .head.ref // empty
            ' <<<"${prs}")

          if [[ -z "${head_ref}" || "${head_ref}" == "${DEFAULT_BRANCH}" ]]; then
            echo "No merged same-repository task branch is associated with ${COMMIT_SHA}."
            exit 0
          fi

          get_endpoint="repos/${REPOSITORY}/git/ref/heads/${head_ref}"
          delete_endpoint="repos/${REPOSITORY}/git/refs/heads/${head_ref}"

          if ! gh api "${get_endpoint}" >/dev/null 2>&1; then
            echo "Branch ${head_ref} is already absent."
            exit 0
          fi

          gh api --method DELETE "${delete_endpoint}"
          echo "Deleted merged task branch ${head_ref}."
