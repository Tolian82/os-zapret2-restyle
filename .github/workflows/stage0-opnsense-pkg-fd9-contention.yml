name: Stage 0 native pkg hook FD9 contention on OPNsense

on:
  pull_request:
    paths:
      - scripts/stage0-opnsense-pkg-fd9-contention.py
      - scripts/test-stage0-opnsense-pkg-fd9-contention.py
      - scripts/stage0-opnsense-guest-readonly.py
      - .github/workflows/stage0-opnsense-pkg-fd9-contention.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fd9-held-across-native-pkg:
    name: Native private pkg add -f with FD9 owner and hook re-acquire failures
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Offline exact synthetic FD9/pkg contracts
        run: |
          python3.13 -m py_compile scripts/stage0-opnsense-pkg-fd9-contention.py scripts/test-stage0-opnsense-pkg-fd9-contention.py
          python3.13 scripts/test-stage0-opnsense-pkg-fd9-contention.py -v
      - name: Real disposable OPNsense native package hooks under retained FD9
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          mem: 4096
          cpu: 2
          disable-cache: true
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            /usr/local/bin/python3 scripts/stage0-opnsense-pkg-fd9-contention.py
