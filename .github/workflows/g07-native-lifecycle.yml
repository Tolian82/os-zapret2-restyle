name: G07 real GUI Start Stop Restart and lower Apply original FD9

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/stage2-opnsense-g07-native-lifecycle.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-g07:
    name: Focused G07 lifecycle status source contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: G07 strict five-status source gate
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage2-opnsense-g07-native-lifecycle.py
          python3.13 scripts/stage2-opnsense-g07-native-lifecycle.py --self-test

  native-g07:
    needs: fast-g07
    name: One OPNsense 26.7 native HTTPS first Apply and GUI service lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: One G04-installed real package and original-FD9 lifecycle guest
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            export GITHUB_ACTIONS=true
            export ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1
            export ZAPRET2_NATIVE_BUILD_CI=1
            export ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1
            export ZAPRET2_G04_DISPOSABLE_NATIVE=1
            export ZAPRET2_G04_RUNTIME_NATIVE=1
            export ZAPRET2_G07_NATIVE_LIFECYCLE=1
            export ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            /usr/local/bin/python3 scripts/stage2-opnsense-g04-native-config.py
            /usr/local/bin/python3 scripts/stage2-opnsense-g07-native-lifecycle.py run
