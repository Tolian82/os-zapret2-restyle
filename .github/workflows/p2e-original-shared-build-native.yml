name: "P2e/P2g/P2i #1052 original generator and native preview loopback"

on:
  pull_request:
    paths:
      - src/opnsense/scripts/OPNsense/Zapret/backend/orchestrator.sh
      - src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_origin_map.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/voice_release_stage.py
      - scripts/test-p2e-original-shared-build.py
      - scripts/test-auto-detect-storage.py
      - scripts/test-p2i-original-preview-native.py
      - scripts/test-auto-detect-post-drop.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_post_drop.py
      - scripts/test-p2k8g-original-config-native.py
      - scripts/test-auto-detect-original-lock-handoff.php
      - scripts/test-auto-detect-original-lock-handoff.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_storage.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_queue.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_fd.py
      - .github/workflows/p2e-original-shared-build-native.yml

permissions:
  contents: read

concurrency:
  group: p2e-1052-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: One OPNsense 26.7 isolated original shared release generator witness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fast P2i preview parser and off-target native refusal
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-p2i-original-preview-native.py --self-test
          python3 -m py_compile src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_post_drop.py scripts/test-auto-detect-post-drop.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-auto-detect-post-drop.py
          python3 -m py_compile scripts/test-p2k8g-original-config-native.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-p2k8g-original-config-native.py --self-test
          if GITHUB_ACTIONS=true PYTHONDONTWRITEBYTECODE=1 python3 \
               scripts/test-p2i-original-preview-native.py --native \
               /tmp/p4c3-native-invalid >"${RUNNER_TEMP}/p2i-refusal.log" 2>&1; then
            echo '::error::P2i native probe accepted a non-FreeBSD runner'
            exit 1
          fi
          grep -q 'FREEBSD_ROOT_ONLY' "${RUNNER_TEMP}/p2i-refusal.log"
      - name: Fail fast if disposable VM host cannot start
        shell: bash
        run: |
          set -euo pipefail
          if ! sudo test -c /dev/kvm; then
            echo '::error::KVM unavailable; original FreeBSD build NOT TESTED'
            exit 1
          fi
          if command -v qemu-system-x86_64 >/dev/null 2>&1 &&
             command -v qemu-img >/dev/null 2>&1; then
            echo P2E_QEMU=already_available
          elif ! timeout 8 getent ahostsv4 azure.archive.ubuntu.com >/dev/null; then
            echo '::error::VM dependency mirror unavailable; native P2e NOT TESTED'
            exit 1
          fi
          echo 'Acquire::Retries "0"; Acquire::http::Timeout "15"; Acquire::https::Timeout "15";' |
            sudo tee /etc/apt/apt.conf.d/99p2e-network >/dev/null
      - name: Exact original shared-candidate builder, Voice and source-map on disposable FreeBSD
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: rsync
          copyback: false
          cpu: 2
          mem: 4096
          cache-after-prepare: true
          prepare: |
            set -eu
            /usr/local/bin/python3 - <<'PY'
            import subprocess
            for command, seconds in (
                (["pkg", "update", "-f"], 150),
                (["pkg", "install", "-y", "git", "ca_root_nss", "gmake",
                  "pkgconf", "luajit"], 180),
            ):
                subprocess.run(command, timeout=seconds, check=True)
            PY
          run: |
            set -eu
            /usr/local/bin/python3 - <<'PY'
            import os
            import sys
            if not sys.platform.startswith("freebsd") or os.geteuid() != 0:
                raise SystemExit("P2E_REFUSED_NOT_ROOT_FREEBSD")
            PY
            PYTHONDONTWRITEBYTECODE=1 /usr/local/bin/python3 scripts/test-p2e-original-shared-build.py
            GITHUB_ACTIONS=true ZAPRET2_P2G_DISPOSABLE_NATIVE=1 PYTHONDONTWRITEBYTECODE=1 \
              /usr/local/bin/python3 scripts/test-auto-detect-storage.py --native
            # P2k8g: qualify the real ORIGINAL OPNsense Config handle and
            # Python -> PHP -> Python inherited kernel flock in this same
            # disposable guest. NEVER save /conf/config.xml or touch IPFW.
            GITHUB_ACTIONS=true ZAPRET2_P2K8G_DISPOSABLE_NATIVE=1 PYTHONDONTWRITEBYTECODE=1 \
              /usr/local/bin/python3 scripts/test-p2k8g-original-config-native.py --native
            # Reuse THIS SAME disposable OPNsense guest; no extra VM job.
            /usr/local/bin/python3 - <<'PY'
            import os
            from pathlib import Path
            import shutil
            import subprocess
            import sys
            import tempfile

            expected = "038c97e5819df10f8e8c22a2f1fffe57f2f7379b"
            checkout = Path(tempfile.mkdtemp(prefix="p4c3-native-", dir="/tmp"))
            try:
                subprocess.run(["git", "clone", "--quiet", "--depth", "1",
                                "--branch", "v1.0.7",
                                "https://github.com/bol-van/zapret2.git",
                                str(checkout)], check=True, timeout=120)
                head = subprocess.check_output(["git", "-C", str(checkout),
                                                "rev-parse", "HEAD"],
                                               text=True, timeout=8).strip()
                if head != expected:
                    raise RuntimeError("P2I_PINNED_UPSTREAM_SHA_MISMATCH")
                checkout.chmod(0o755)
                subprocess.run(["make", "-C", str(checkout / "nfq2")],
                               check=True, timeout=180)
                env = {**os.environ, "GITHUB_ACTIONS": "true",
                       "ZAPRET2_P2I_DISPOSABLE_NATIVE": "1",
                       "ZAPRET2_P4C3_DISPOSABLE_NATIVE": "1",
                       "PYTHONDONTWRITEBYTECODE": "1"}
                subprocess.run([sys.executable,
                                "scripts/test-p2i-original-preview-native.py",
                                "--native", str(checkout)],
                               check=True, timeout=90, env=env)
            finally:
                shutil.rmtree(checkout)
            PY
      - name: Declare exact native evidence boundary
        shell: bash
        run: |
          echo P2E_SCOPE=ORIGINAL_SHARED_GENERATOR_NATIVE_FREEBSD_DISPOSABLE_OFFLINE_MAP_ONLY
          echo P2G_SCOPE=DISPOSABLE_FREEBSD_NOBODY_FILE_ACCESS_AND_DURABLE_QUEUE_PERMISSIONS
          echo P2I_SCOPE=ORIGINAL_GENERATOR_P2H_SEALED_PREVIEW_PINNED_DVTWS2_LOOPBACK_RAW_DEBUG_ONLY
          echo P2K8G_SCOPE=DISPOSABLE_NATIVE_ORIGINAL_CONFIG_FD_PHP_PARENT_DEATH_AND_EARLY_UNLOCK_REFUSAL
          echo P2K8G_NOT_CLAIMED=INSTALLED_OBSERVER_OR_P2K8D_REAL_DESTINATION_OR_NATIVE_FD9_OR_PENDING_ACK
          echo P2I_NOT_CLAIMED=INSTALLED_FD9_OWNER_OR_CONTINUOUS_DRAIN_OR_WORKER_OR_PRODUCTION_TRAFFIC
          echo P2E_P2G_NOT_CLAIMED=FD9_OR_INSTALLED_SERVICE_OR_OWNER_APPLIANCE_OR_QUEUE_ACK
