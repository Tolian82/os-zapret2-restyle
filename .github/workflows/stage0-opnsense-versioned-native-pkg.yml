name: Stage 0 genuine version-distinct derived native pkg replacement

on:
  pull_request:
    paths:
      - scripts/stage0-opnsense-versioned-native-pkg.py
      - scripts/test-stage0-opnsense-versioned-native-pkg.py
      - .github/workflows/stage0-opnsense-versioned-native-pkg.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versioned-published-payload:
    name: Real version-distinct pkgdb transition and compensating recovery on disposable OPNsense
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Offline manifest, owner and execution-order contracts
        run: |
          python3.13 -m py_compile scripts/stage0-opnsense-versioned-native-pkg.py scripts/test-stage0-opnsense-versioned-native-pkg.py
          python3.13 scripts/test-stage0-opnsense-versioned-native-pkg.py -v
      - name: Native isolated OPNsense real versioned pkg then original archival compensation
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          mem: 4096
          cpu: 2
          disable-cache: true
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git gmake pkgconf lua54
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_VERSIONED_PKG_TEST=1 /usr/local/bin/python3 scripts/stage0-opnsense-versioned-native-pkg.py /tmp/os-zapret2-restyle-0.6.2_1.pkg
