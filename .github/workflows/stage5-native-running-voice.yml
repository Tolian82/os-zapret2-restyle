name: Stage 5 one exact archive RUNNING, shared Voice, authenticated HTTPS

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - scripts/native-opnsense-package.py
      - scripts/stage2-opnsense-real-native-running-upgrade.py
      - scripts/stage2-opnsense-real-native-shared-voice.py
      - scripts/stage2-opnsense-real-native-voice-http.py
      - scripts/stage5-native-running-voice-artifact.py
      - scripts/stage5-native-pf-egress-fixture.py
      - scripts/stage5-installed-exclude.py
      - scripts/stage5-installed-lab-resources.py
      - scripts/stage5-installed-functional.py
      - scripts/stage5-installed-auth-web.py
      - scripts/stage5-installed-exclude-http-apply.py
      - scripts/stage5-installed-extra-remove-http.py
      - scripts/stage5-installed-extra-install-http.py
      - scripts/stage5-installed-extra-roundtrip-http.py
      - scripts/stage5-installed-lab-real-http.py
      - scripts/test-extra-resources-transaction.py
      - scripts/test-strategy-lab-e2e.sh
      - scripts/test-extra-resources-preflight.py
      - scripts/test-extra-resources-inventory-cache.py
      - scripts/test-global-exclusions.py
      - scripts/test-ipset-policy.py
  pull_request:
    branches: [main]
    paths:
      - VERSION
      - scripts/native-opnsense-package.py
      - scripts/stage2-opnsense-real-native-running-upgrade.py
      - scripts/stage2-opnsense-real-native-shared-voice.py
      - scripts/stage2-opnsense-real-native-voice-http.py
      - scripts/stage5-native-running-voice-artifact.py
      - scripts/stage5-native-pf-egress-fixture.py
      - scripts/stage5-installed-exclude.py
      - scripts/stage5-installed-lab-resources.py
      - scripts/stage5-installed-functional.py
      - scripts/stage5-installed-auth-web.py
      - scripts/stage5-installed-exclude-http-apply.py
      - scripts/stage5-installed-extra-remove-http.py
      - scripts/stage5-installed-extra-install-http.py
      - scripts/stage5-installed-extra-roundtrip-http.py
      - scripts/stage5-installed-lab-real-http.py
      - scripts/test-extra-resources-transaction.py
      - scripts/test-strategy-lab-e2e.sh
      - scripts/test-extra-resources-preflight.py
      - scripts/test-extra-resources-inventory-cache.py
      - scripts/test-global-exclusions.py
      - scripts/test-ipset-policy.py
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  one-native-sha-live-voice:
    name: Immutable installed archive across historical RUNNING and Voice HTTP Apply
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Offline exact-source / package SHA and live-witness negatives
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage5-native-running-voice-artifact.py scripts/stage2-opnsense-real-native-running-upgrade.py scripts/stage2-opnsense-real-native-voice-http.py scripts/stage5-installed-exclude.py scripts/stage5-installed-lab-resources.py scripts/stage5-installed-functional.py scripts/stage5-installed-auth-web.py scripts/stage5-installed-exclude-http-apply.py scripts/stage2-opnsense-real-native-shared-voice.py scripts/stage5-installed-extra-remove-http.py scripts/stage5-installed-extra-install-http.py scripts/stage5-installed-extra-roundtrip-http.py scripts/stage5-native-pf-egress-fixture.py scripts/stage5-installed-lab-real-http.py
          python3.13 scripts/stage5-native-running-voice-artifact.py --self-test
          python3.13 scripts/stage5-native-pf-egress-fixture.py --self-test
          python3.13 scripts/stage5-installed-lab-real-http.py --self-test
          python3.13 scripts/stage5-installed-exclude.py --self-test
          python3.13 scripts/stage5-installed-lab-resources.py --self-test
          python3.13 scripts/stage5-installed-functional.py --self-test
          python3.13 scripts/stage5-installed-auth-web.py --self-test
          python3.13 scripts/stage5-installed-exclude-http-apply.py --self-test
          python3.13 scripts/stage5-installed-extra-remove-http.py --self-test
          python3.13 scripts/stage5-installed-extra-install-http.py --self-test
          python3.13 scripts/stage5-installed-extra-roundtrip-http.py --self-test
          python3.13 scripts/stage2-opnsense-real-native-shared-voice.py --self-test
          python3.13 scripts/stage2-opnsense-real-native-voice-http.py --self-test
      - name: Real old RUNNING to one native pkg, original FD9/Voice and HTTPS Apply
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: true
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit lua54
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_STAGE2_REAL_RUNNING_UPGRADE=1 ZAPRET2_STAGE5_RUNNING_VOICE_ARTIFACT=1 /usr/local/bin/python3 scripts/stage5-native-pf-egress-fixture.py
            /usr/local/bin/pkgconf --exists lua-5.4
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE0_DISPOSABLE_RUNNING_TEST=1 ZAPRET2_STAGE2_REAL_RUNNING_UPGRADE=1 ZAPRET2_STAGE2_REAL_ACTIVE_SERVICE=1 ZAPRET2_STAGE2_REAL_COMMON_VOICE=1 ZAPRET2_STAGE2_REAL_VOICE_HTTP=1 ZAPRET2_STAGE5_RUNNING_VOICE_ARTIFACT=1 ZAPRET2_STAGE5_INSTALLED_EXCLUDE=1 ZAPRET2_STAGE5_INSTALLED_LAB_RESOURCES=1 ZAPRET2_STAGE5_INSTALLED_FUNCTIONS=1 ZAPRET2_STAGE5_AUTHENTICATED_WEB_READONLY=1 ZAPRET2_STAGE5_AUTHENTICATED_EXCLUDE_APPLY=1 ZAPRET2_STAGE5_AUTHENTICATED_EXTRA_REMOVE=1 ZAPRET2_STAGE5_AUTHENTICATED_EXTRA_INSTALL=1 ZAPRET2_STAGE5_AUTHENTICATED_EXTRA_ROUNDTRIP=1 ZAPRET2_STAGE5_REAL_LAB_POSITIVE=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage5-native-running-voice-artifact.py run /tmp/os-zapret2-restyle-0.6.2_1.pkg
      - name: Validate byte-identical installed archive and receipt after VM copyback
        run: |
          set -eu
          python3.13 scripts/stage5-native-running-voice-artifact.py verify "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "PASS: one SHA-bound native archive installed for RUNNING, Voice and HTTPS; no release or owner device modification"
      - name: Keep short-lived native package and installed RUNNING/Voice SHA receipt
        uses: actions/upload-artifact@v7
        with:
          name: stage5-native-running-voice-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/os-zapret2-restyle-*.pkg
            dist/stage5-native-running-voice-artifact.json
          if-no-files-found: error
          retention-days: 7
