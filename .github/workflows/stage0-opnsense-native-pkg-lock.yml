name: Stage 0 OPNsense firmware entrypoints and native pkg lock

on:
  pull_request:
    paths:
      - scripts/stage0-opnsense-native-pkg-lock.py
      - scripts/test-stage0-opnsense-native-pkg-lock.py
      - scripts/stage0-opnsense-pkg-fd9-contention.py
      - scripts/stage0-opnsense-guest-readonly.py
      - .github/workflows/stage0-opnsense-native-pkg-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-pkg-lock:
    name: Exact installed firmware chain and private pkg lock test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fast exact Python syntax and offline safety contracts
        run: |
          python3.13 -m py_compile scripts/stage0-opnsense-native-pkg-lock.py scripts/test-stage0-opnsense-native-pkg-lock.py
          python3.13 scripts/test-stage0-opnsense-native-pkg-lock.py -v
      - name: Actual OPNsense 26.7 read-only firmware paths and synthetic private pkg lock
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          mem: 4096
          cpu: 2
          disable-cache: true
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            /usr/local/bin/python3 scripts/stage0-opnsense-native-pkg-lock.py
