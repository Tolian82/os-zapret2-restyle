name: P0 original FD9 postinstall continuation and crash recovery

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/owner-p0-protected-rescue-native.py
      - src/opnsense/scripts/OPNsense/Zapret/zapret_service.sh
      - src/opnsense/scripts/OPNsense/Zapret/protected_pkg_update.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_origin_map.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_owner.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/global_exclusions.py
  workflow_dispatch:

concurrency:
  group: owner-p0-native-rescue-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source:
    name: Verify continuation source, pinned archives and disposable caller
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Source compile and disposable gate
        run: |
          set -eu
          python3.13 -m py_compile scripts/owner-p0-protected-rescue-native.py
          python3.13 scripts/test-protected-pkg-update.py
          if python3.13 scripts/owner-p0-protected-rescue-native.py >/dev/null 2>&1; then
            echo "::error::P0 rescue ran outside the disposable FreeBSD guest"
            exit 1
          fi
          grep -Fq 'BROKEN = ("0.6.5_109", "1e08caf8dae9552e86085abf1d7f5c8db1e85a5640da4bfc197f9462f25e7d8a")' scripts/owner-p0-protected-rescue-native.py
          grep -Fq 'FIXED = ("0.6.5_111", "7257f54d74ef10fedc30d75e5e4a13861253bc8ad64d64ab232c537c2a56fae3")' scripts/owner-p0-protected-rescue-native.py

  native:
    needs: source
    name: Real _109 held record to whole _111 package with two coordinator crashes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bounded native QEMU and DNS prerequisites
        run: |
          set -eu
          if ! command -v qemu-system-x86_64 >/dev/null 2>&1 &&
             ! timeout 8 getent ahostsv4 azure.archive.ubuntu.com >/dev/null; then
            echo "::error::Native disposable QEMU/DNS unavailable"
            exit 1
          fi
          echo 'Acquire::Retries "0"; Acquire::http::Timeout "15"; Acquire::https::Timeout "15";' |
            sudo tee /etc/apt/apt.conf.d/99zapret-owner-p0-network >/dev/null
      - name: Original mounted OPNsense and exact published package recovery
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: '26.7'
          sync: rsync
          copyback: false
          cache-after-prepare: true
          cpu: 3
          mem: 4096
          prepare: |
            set -eu
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
          run: |
            set -eu
            export GITHUB_ACTIONS=true
            export ZAPRET2_OWNER_P0_DISPOSABLE=1
            export ZAPRET2_NATIVE_BUILD_CI=1
            export ZAPRET2_CURL_SIGNED_DISCOVERY=1
            export ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1
            export ZAPRET2_PROTECTED_PKG_NATIVE_TEST=1
            export ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            /usr/local/bin/python3 scripts/owner-p0-protected-rescue-native.py
