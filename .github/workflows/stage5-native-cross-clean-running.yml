name: Stage 5 one identical package across clean install and RUNNING Voice

on:
  push:
    branches: [main]
    paths:
      - Makefile
      - VERSION
      - compatibility.json
      - scripts/native-opnsense-package.py
      - scripts/stage5-native-single-artifact.py
      - scripts/stage5-native-running-voice-artifact.py
      - scripts/stage2-opnsense-real-native-running-upgrade.py
      - .github/workflows/stage5-native-cross-clean-running.yml
  pull_request:
    branches: [main]
    paths:
      - Makefile
      - VERSION
      - compatibility.json
      - scripts/native-opnsense-package.py
      - scripts/stage5-native-single-artifact.py
      - scripts/stage5-native-running-voice-artifact.py
      - scripts/stage2-opnsense-real-native-running-upgrade.py
      - .github/workflows/stage5-native-cross-clean-running.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exactly-one-archive-two-disposable-opnsense-guests:
    name: One Mk build, clean pkg add, same archive RUNNING Voice HTTPS and copyback
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Rejected cross-VM receipt/manifest/SHA and source-substitution contracts
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage5-native-single-artifact.py scripts/stage5-native-running-voice-artifact.py scripts/stage2-opnsense-real-native-running-upgrade.py
          python3.13 scripts/stage5-native-single-artifact.py --self-test
          python3.13 scripts/stage5-native-running-voice-artifact.py --self-test
          python3.13 scripts/stage2-opnsense-real-native-shared-voice.py --self-test
          python3.13 scripts/stage2-opnsense-real-native-voice-http.py --self-test
      - name: First fresh disposable OPNsense 26.7 - build ONCE and genuine clean pkg add
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: true
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1 ZAPRET2_STAGE5_SINGLE_ARTIFACT=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage5-native-single-artifact.py run
      - name: Independently attest copied-back exact clean-installed bytes before transfer
        run: |
          set -eu
          python3.13 scripts/stage5-native-single-artifact.py verify "${{ github.event.pull_request.head.sha || github.sha }}"
          test -f dist/stage5-native-single-artifact.json
          test -f dist/os-zapret2-restyle-0.6.2_$(sed -nE 's/^PLUGIN_REVISION=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' Makefile).pkg
      - name: Second DIFFERENT fresh disposable OPNsense 26.7 - install SAME pkg in RUNNING and exercise Voice HTTPS, NO REBUILD
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: true
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit lua54
            /usr/local/bin/pkgconf --exists lua-5.4
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE0_DISPOSABLE_RUNNING_TEST=1 ZAPRET2_STAGE2_REAL_RUNNING_UPGRADE=1 ZAPRET2_STAGE2_REAL_ACTIVE_SERVICE=1 ZAPRET2_STAGE2_REAL_COMMON_VOICE=1 ZAPRET2_STAGE2_REAL_VOICE_HTTP=1 ZAPRET2_STAGE5_RUNNING_VOICE_ARTIFACT=1 ZAPRET2_STAGE5_CROSS_VM=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage5-native-running-voice-artifact.py run-prebuilt /tmp/os-zapret2-restyle-0.6.2_1.pkg
      - name: Refuse different SHA, manifest, ABI, pkg-owned files or exact source in TWO installed receipts
        run: |
          set -eu
          python3.13 scripts/stage5-native-running-voice-artifact.py verify-cross "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "PASS: SAME official native .pkg byte-for-byte clean installed and RUNNING-upgraded in two independent OPNsense 26.7 guests; original FD9/Voice/HTTPS; no rebuild/release/owner changes"
      - name: Retain ONE clean+RUNNING installed package archive and BOTH read-only receipts
        uses: actions/upload-artifact@v7
        with:
          name: stage5-one-package-two-install-modes-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/os-zapret2-restyle-0.6.2_*.pkg
            dist/stage5-native-single-artifact.json
            dist/stage5-native-running-voice-artifact.json
          if-no-files-found: error
          retention-days: 7
