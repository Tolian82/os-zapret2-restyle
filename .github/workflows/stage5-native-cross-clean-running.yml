name: Stage 5 one identical package across clean install and RUNNING Voice

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - compatibility.json
      - scripts/native-opnsense-package.py
      - scripts/stage5-native-single-artifact.py
      - scripts/stage5-g10-preinstall-purge.py
      - scripts/stage5-native-running-voice-artifact.py
      - scripts/stage5-native-pf-egress-fixture.py
      - scripts/stage5-installed-exclude.py
      - scripts/stage5-installed-lab-resources.py
      - scripts/stage5-installed-functional.py
      - scripts/stage5-installed-auth-web.py
      - scripts/stage5-installed-exclude-http-apply.py
      - scripts/stage5-installed-extra-remove-http.py
      - scripts/stage5-installed-extra-install-http.py
      - scripts/stage5-installed-extra-roundtrip-http.py
      - scripts/stage5-installed-lab-real-http.py
      - scripts/stage2-opnsense-real-native-shared-voice.py
      - scripts/test-extra-resources-transaction.py
      - scripts/test-extra-resources-preflight.py
      - src/opnsense/scripts/OPNsense/Zapret/extra_resources_inventory_cache.py
      - scripts/test-global-exclusions.py
      - scripts/test-ipset-policy.py
      - scripts/stage2-opnsense-real-native-running-upgrade.py
      - scripts/stage5-native-same-archive-reboot.py
      - scripts/stage5-native-real-shared-voice-reboot.py
      - scripts/stage2-opnsense-real-native-boot-syshook.py
  pull_request:
    branches: [main]
    paths:
      - VERSION
      - compatibility.json
      - scripts/native-opnsense-package.py
      - scripts/stage5-native-single-artifact.py
      - scripts/stage5-g10-preinstall-purge.py
      - scripts/stage5-native-running-voice-artifact.py
      - scripts/stage5-native-pf-egress-fixture.py
      - scripts/stage5-installed-exclude.py
      - scripts/stage5-installed-lab-resources.py
      - scripts/stage5-installed-functional.py
      - scripts/stage5-installed-auth-web.py
      - scripts/stage5-installed-exclude-http-apply.py
      - scripts/stage5-installed-extra-remove-http.py
      - scripts/stage5-installed-extra-install-http.py
      - scripts/stage5-installed-extra-roundtrip-http.py
      - scripts/stage5-installed-lab-real-http.py
      - scripts/stage2-opnsense-real-native-shared-voice.py
      - scripts/test-extra-resources-transaction.py
      - scripts/test-extra-resources-preflight.py
      - src/opnsense/scripts/OPNsense/Zapret/extra_resources_inventory_cache.py
      - scripts/test-global-exclusions.py
      - scripts/test-ipset-policy.py
      - scripts/stage2-opnsense-real-native-running-upgrade.py
      - scripts/stage5-native-same-archive-reboot.py
      - scripts/stage5-native-real-shared-voice-reboot.py
      - scripts/stage2-opnsense-real-native-boot-syshook.py
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-verify-clean-install:
    name: Guest A - one Mk build, genuine clean pkg add and verified archive
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fail-closed two-receipt SHA, source, ABI and missing proof contracts
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage5-native-single-artifact.py scripts/stage5-native-running-voice-artifact.py scripts/stage2-opnsense-real-native-running-upgrade.py scripts/stage5-installed-exclude.py scripts/stage5-installed-lab-resources.py scripts/stage5-installed-functional.py scripts/stage5-installed-auth-web.py scripts/stage5-installed-exclude-http-apply.py scripts/stage2-opnsense-real-native-shared-voice.py scripts/stage5-installed-extra-remove-http.py scripts/stage5-installed-extra-install-http.py scripts/stage5-installed-extra-roundtrip-http.py scripts/stage5-native-pf-egress-fixture.py scripts/stage5-installed-lab-real-http.py
          python3.13 scripts/stage5-native-single-artifact.py --self-test
          python3.13 -m py_compile scripts/stage5-g10-preinstall-purge.py
          python3.13 scripts/stage5-g10-preinstall-purge.py --self-test
          python3.13 scripts/stage5-native-running-voice-artifact.py --self-test
          python3.13 scripts/stage5-native-pf-egress-fixture.py --self-test
          python3.13 scripts/stage5-installed-lab-real-http.py --self-test
          python3.13 scripts/stage5-installed-exclude.py --self-test
          python3.13 scripts/stage5-installed-lab-resources.py --self-test
          python3.13 scripts/stage5-installed-functional.py --self-test
          python3.13 scripts/stage5-installed-auth-web.py --self-test
          python3.13 scripts/stage5-installed-exclude-http-apply.py --self-test
          python3.13 scripts/stage5-installed-extra-remove-http.py --self-test
          python3.13 scripts/stage5-installed-extra-install-http.py --self-test
          python3.13 scripts/stage5-installed-extra-roundtrip-http.py --self-test
          python3.13 scripts/stage2-opnsense-real-native-shared-voice.py --self-test
      - name: FRESH disposable OPNsense guest A - build ONCE, real clean pkg add
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: true
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            GITHUB_ACTIONS=true ZAPRET2_G10_PREINSTALL_PURGE=1 ZAPRET2_G01_DISPOSABLE_NATIVE=1 ZAPRET2_PURGE_DISPOSABLE_GUEST=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage5-g10-preinstall-purge.py run
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1 ZAPRET2_STAGE5_SINGLE_ARTIFACT=1 ZAPRET2_STAGE5_SAME_ARCHIVE_FORCE_REINSTALL=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage5-native-single-artifact.py run
            GITHUB_ACTIONS=true ZAPRET2_G10_PREINSTALL_PURGE=1 ZAPRET2_G01_DISPOSABLE_NATIVE=1 ZAPRET2_PURGE_DISPOSABLE_GUEST=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage5-g10-preinstall-purge.py bind
      - name: Verify copied-back CLEAN-installed archive and immutable receipt
        run: |
          set -eu
          python3.13 scripts/stage5-native-single-artifact.py verify "${{ github.event.pull_request.head.sha || github.sha }}"
          python3.13 scripts/stage5-g10-preinstall-purge.py verify "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Transfer exact installed archive plus read-only receipt to SEPARATE runner/VM
        uses: actions/upload-artifact@v7
        with:
          name: stage5-single-archive-transfer-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/os-zapret2-restyle-*.pkg
            dist/stage5-native-single-artifact.json
          if-no-files-found: error
          retention-days: 1

  install-same-archive-running-voice:
    needs: build-and-verify-clean-install
    name: Guest B - SAME archive old RUNNING upgrade, Voice, HTTPS, cross-receipt
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download the exact package BUILT AND INSTALLED in guest A, NO BUILDER
        uses: actions/download-artifact@v8
        with:
          name: stage5-single-archive-transfer-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist
      - name: Verify SHA / manifest / source HEAD BEFORE sending package to guest B
        run: |
          set -eu
          python3.13 scripts/stage5-native-single-artifact.py verify "${{ github.event.pull_request.head.sha || github.sha }}"
          python3.13 scripts/stage5-g10-preinstall-purge.py verify "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: FRESH disposable OPNsense guest B - SAME downloaded pkg, genuine old RUNNING Voice HTTPS, NO REBUILD
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: true
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit lua54
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_STAGE2_REAL_RUNNING_UPGRADE=1 ZAPRET2_STAGE5_RUNNING_VOICE_ARTIFACT=1 /usr/local/bin/python3 scripts/stage5-native-pf-egress-fixture.py
            /usr/local/bin/pkgconf --exists lua-5.4
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE0_DISPOSABLE_RUNNING_TEST=1 ZAPRET2_STAGE2_REAL_RUNNING_UPGRADE=1 ZAPRET2_STAGE2_REAL_ACTIVE_SERVICE=1 ZAPRET2_STAGE2_REAL_COMMON_VOICE=1 ZAPRET2_STAGE2_REAL_VOICE_HTTP=1 ZAPRET2_STAGE5_RUNNING_VOICE_ARTIFACT=1 ZAPRET2_STAGE5_INSTALLED_EXCLUDE=1 ZAPRET2_STAGE5_INSTALLED_LAB_RESOURCES=1 ZAPRET2_STAGE5_INSTALLED_FUNCTIONS=1 ZAPRET2_STAGE5_AUTHENTICATED_WEB_READONLY=1 ZAPRET2_STAGE5_AUTHENTICATED_EXCLUDE_APPLY=1 ZAPRET2_STAGE5_AUTHENTICATED_EXTRA_REMOVE=1 ZAPRET2_STAGE5_AUTHENTICATED_EXTRA_INSTALL=1 ZAPRET2_STAGE5_AUTHENTICATED_EXTRA_ROUNDTRIP=1 ZAPRET2_STAGE5_REAL_LAB_POSITIVE=1 ZAPRET2_STAGE5_CROSS_VM=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage5-native-running-voice-artifact.py run-prebuilt /tmp/os-zapret2-restyle-0.6.2_1.pkg
      - name: Compare both independently installed receipts with ONE archive SHA
        run: |
          set -eu
          python3.13 scripts/stage5-native-running-voice-artifact.py verify-cross "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "PASS: one physical native Mk .pkg clean installed in guest A and old RUNNING/FD9 Voice HTTPS installed in independent guest B"
      - name: Retain ONE native package plus BOTH real installed receipts (no release)
        uses: actions/upload-artifact@v7
        with:
          name: stage5-one-archive-two-installed-modes-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/os-zapret2-restyle-*.pkg
            dist/stage5-native-single-artifact.json
            dist/stage5-native-running-voice-artifact.json
          if-no-files-found: error
          retention-days: 7

  reboot-same-archive-real-kernel:
    needs: build-and-verify-clean-install
    name: Guest C - SAME archive real common Voice new-kernel reboot
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reject missing/forged A-C reboot receipts before native VM
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage5-native-same-archive-reboot.py scripts/stage5-native-real-shared-voice-reboot.py scripts/stage2-opnsense-real-native-running-upgrade.py
          python3.13 scripts/stage5-native-same-archive-reboot.py --self-test
          python3.13 scripts/stage5-native-real-shared-voice-reboot.py --self-test
      - name: Download SAME original A archive and receipt, NO BUILDER
        uses: actions/download-artifact@v8
        with:
          name: stage5-single-archive-transfer-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist
      - name: Verify exact A package, source and manifest before guest C
        run: |
          set -eu
          python3.13 scripts/stage5-native-single-artifact.py verify "${{ github.event.pull_request.head.sha || github.sha }}"
          python3.13 scripts/stage5-g10-preinstall-purge.py verify "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Genuine old RUNNING replacement with A archive, common Voice and NEW kernel
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: true
          cpu: 2
          mem: 4096
          # A real shutdown/reboot after preparation. Never disable cache here.
          cache-after-prepare: true
          prepare: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit lua54
            /usr/local/bin/pkgconf --exists lua-5.4
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            GITHUB_ACTIONS=true ZAPRET2_STAGE5_CROSS_VM=1 ZAPRET2_STAGE5_RUNNING_VOICE_ARTIFACT=1 ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE0_DISPOSABLE_RUNNING_TEST=1 ZAPRET2_STAGE2_REAL_RUNNING_UPGRADE=1 ZAPRET2_STAGE2_REAL_ACTIVE_SERVICE=1 ZAPRET2_STAGE2_REAL_BOOT_SYSHOOK=1 ZAPRET2_STAGE2_REAL_COMMON_VOICE=1 ZAPRET2_STAGE5_REAL_SHARED_VOICE_REBOOT=1 ZAPRET2_STAGE5_SAME_ARCHIVE_REBOOT=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage5-native-same-archive-reboot.py prepare /tmp/os-zapret2-restyle-0.6.2_1.pkg
          run: |
            set -eu
            polls=0
            until [ -f /root/stage5-zapret-voice-real-kernel-boot/start.done ] || [ "$polls" -ge 90 ]; do
              sleep 2
              polls=$((polls + 1))
            done
            echo "STAGE5_SAME_ARCHIVE_GUEST_C_NEW_BOOT_POLLS=$polls"
            GITHUB_ACTIONS=true ZAPRET2_STAGE5_CROSS_VM=1 ZAPRET2_STAGE5_RUNNING_VOICE_ARTIFACT=1 ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE0_DISPOSABLE_RUNNING_TEST=1 ZAPRET2_STAGE2_REAL_RUNNING_UPGRADE=1 ZAPRET2_STAGE2_REAL_ACTIVE_SERVICE=1 ZAPRET2_STAGE2_REAL_BOOT_SYSHOOK=1 ZAPRET2_STAGE2_REAL_COMMON_VOICE=1 ZAPRET2_STAGE5_REAL_SHARED_VOICE_REBOOT=1 ZAPRET2_STAGE5_SAME_ARCHIVE_REBOOT=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage5-native-same-archive-reboot.py verify
      - name: Recheck copied-back A archive SHA and real C reboot receipt
        run: |
          set -eu
          python3.13 scripts/stage5-native-same-archive-reboot.py verify-c "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Save independent genuine kernel C receipt, no release
        uses: actions/upload-artifact@v7
        with:
          name: stage5-third-guest-reboot-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/stage5-native-same-archive-reboot.json
          if-no-files-found: error
          retention-days: 7

  verify-three-exact-guests:
    needs: [install-same-archive-running-voice, reboot-same-archive-real-kernel]
    name: A/B/C - verify ONE package SHA across clean, RUNNING, kernel reboot
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: stage5-one-archive-two-installed-modes-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: stage5-third-guest-reboot-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist
      - name: Reject rebuild/missing/mismatched package and A/B/C receipt
        run: |
          set -eu
          python3.13 scripts/stage5-native-running-voice-artifact.py verify-cross "${{ github.event.pull_request.head.sha || github.sha }}"
          python3.13 scripts/stage5-native-same-archive-reboot.py verify-three "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Retain selected exact physical archive and THREE installed receipts
        uses: actions/upload-artifact@v7
        with:
          name: stage5-one-archive-three-guests-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/os-zapret2-restyle-*.pkg
            dist/stage5-native-single-artifact.json
            dist/stage5-native-running-voice-artifact.json
            dist/stage5-native-same-archive-reboot.json
          if-no-files-found: error
          retention-days: 7

  install-same-archive-without-preinstalled-git:
    needs: build-and-verify-clean-install
    name: Guest D - SAME archive, one-script native install without git
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download and check the exact guest A archive, NO REBUILD
        uses: actions/download-artifact@v8
        with:
          name: stage5-single-archive-transfer-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist
      - name: Require exact archive identity before guest D
        run: |
          set -eu
          python3.13 scripts/stage5-native-single-artifact.py verify "${{ github.event.pull_request.head.sha || github.sha }}"
          python3.13 scripts/stage5-g10-preinstall-purge.py verify "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: FRESH disposable OPNsense guest D - no preinstalled git or dependency bootstrap
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: true
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            if pkg info -q git >/dev/null 2>&1; then
              echo 'ERROR: guest D already has git: missing-dependency scenario not exercised' >&2
              exit 1
            fi
            set -- dist/os-zapret2-restyle-*.pkg
            [ "$#" -eq 1 ] && [ -f "$1" ] || { echo 'ERROR: exactly one original guest A .pkg required' >&2; exit 1; }
            package="$1"
            before=$(sha256 -q "$package")
            tar -xOf "$package" +MANIFEST | /usr/local/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); assert "git" in d["deps"], "native package lacks git dependency"'
            # Package-only native path: resolve physical manifest dependencies
            # exclusively from the official OPNsense repository, then pkg add.
            dependencies=$(tar -xOf "$package" +MANIFEST | /usr/local/bin/python3 -c 'import json,sys; m=json.load(sys.stdin); d=m["deps"]; assert isinstance(d,dict) and "git" in d and d; print(" ".join(sorted(d)))')
            test -n "$dependencies"
            pkg install -y -r OPNsense $dependencies
            # The immutable 26.7 VM image can contain older Expat while
            # the official OPNsense repository upgrades python313 as a
            # manifest dependency.  pyexpat from the new Python requires
            # XML_GetCurrentLineNumber64, introduced with Expat 2.9.
            # Repair only this already-proven inconsistent OS dependency
            # through the official OPNsense repo before normal pkg hooks;
            # never bypass template errors or silently alter owner hosts.
            if ! /usr/local/bin/python3 -c 'import xml.etree.ElementTree as ET; ET.fromstring("<ok/>")' >/dev/null 2>&1; then
              echo 'Guest D: repairing official OPNsense Python/Expat ABI mismatch before native plugin installation'
              pkg install -y -r OPNsense expat
            fi
            /usr/local/bin/python3 -c 'import pyexpat; import xml.etree.ElementTree as ET; ET.fromstring("<ok/>")'
            # pkg can return 0 even if an installed package's POST-INSTALL
            # script reports failure. An extracted pkgdb entry is not a
            # successful native OPNsense installation.
            if install_output=$(pkg add -f "$package" 2>&1); then
              install_rc=0
            else
              install_rc=$?
            fi
            printf '%s\n' "$install_output"
            if [ "$install_rc" -ne 0 ] ||
               printf '%s\n' "$install_output" | grep -Eq '(POST-INSTALL script failed|ERROR: OPNsense Zapret template could not be rendered)'; then
              echo 'ERROR: native pkg install or post-install failed in no-git guest D' >&2
              # Disposable CI guest only: bounded, filtered configd diagnostics.
              # Do not dump Config XML, candidate strategies or private secrets.
              if [ -f /var/log/configd/latest.log ]; then
                grep -Ei 'template|Zapret|Traceback|Exception|error' /var/log/configd/latest.log | tail -n 35 || true
              fi
              echo 'DIAGNOSTIC: installed Python and configd worker identity' >&2
              /usr/local/bin/python3 --version || true
              /usr/local/sbin/configctl system status || true
              ps -ax -o pid,command | grep -E '[c]onfigd.py|[p]ython3' | head -n 15 || true
              exit 1
            fi
            pkg info -q git
            git --version
            [ "$(pkg query '%R' git)" = OPNsense ] || {
              echo 'ERROR: git did not come from the official OPNsense repository' >&2
              exit 1
            }
            version=$(tr -d '[:space:]' < VERSION)
            expected=$(sed -n 's/^PLUGIN_REVISION=[[:space:]]*//p' Makefile | tr -d '[:space:]')
            [ -n "$version" ] && [ -n "$expected" ]
            [ "$(pkg query '%v' os-zapret2-restyle)" = "${version}_${expected}" ] || {
              echo 'ERROR: local native package version was not installed' >&2
              exit 1
            }
            pkg check -d os-zapret2-restyle
            [ "$(sha256 -q "$package")" = "$before" ] || {
              echo 'ERROR: downloaded guest A archive mutated' >&2
              exit 1
            }
            echo 'PASS: fresh no-git guest installed SAME .pkg via official manifest dependencies and native pkg hooks, no external installer'
