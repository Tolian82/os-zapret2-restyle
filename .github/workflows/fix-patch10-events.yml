name: Fix Patch 10 event path

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/strategy-lab-e2e-harness
      - name: Correct event path and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#events.jsonl#events.ndjson#' scripts/test-strategy-lab-e2e.sh
          rm -f .github/workflows/fix-patch10-events.yml
          git config user.name 'Tolian82'
          git config user.email '309637356+Tolian82@users.noreply.github.com'
          git add scripts/test-strategy-lab-e2e.sh .github/workflows/fix-patch10-events.yml
          git commit -m 'test: read the Strategy Lab NDJSON event log'
          git push origin HEAD:agent/strategy-lab-e2e-harness
