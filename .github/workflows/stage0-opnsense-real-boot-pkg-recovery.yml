name: Stage 0 actual disposable OPNsense guest reboot and private pkg lock recovery

on:
  pull_request:
    paths:
      - scripts/stage0-opnsense-real-boot-pkg-recovery.py
      - scripts/test-stage0-opnsense-real-boot-pkg-recovery.py
      - scripts/stage0-opnsense-pkg-fresh-recovery.py
      - scripts/stage0-opnsense-pkg-orphaned-unlock.py
      - .github/workflows/stage0-opnsense-real-boot-pkg-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-opnsense-reboot:
    name: Actual clean QEMU reboot, start syshook, private orphan package recovery
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Exact Python compilation and 15 root/boot/refusal contracts
        run: |
          python3.13 -m py_compile scripts/stage0-opnsense-real-boot-pkg-recovery.py scripts/test-stage0-opnsense-real-boot-pkg-recovery.py
          python3.13 scripts/test-stage0-opnsense-real-boot-pkg-recovery.py -v
      - name: Prepare VM disk then actual poweroff/reboot before read-only recovery
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          mem: 4096
          cpu: 2
          # disable-cache must NOT be enabled. cache-after-prepare shuts down
          # prepared QEMU and launches a fresh guest before executing 'run'.
          # Later CI runs can reuse the stored prepared VM image.
          cache-after-prepare: true
          prepare: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            mkdir -m 700 /root/stage0-fresh-process-recovery-v0.6.2_45
            fetch -o /root/stage0-fresh-process-recovery-v0.6.2_45/published-original-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            chmod 600 /root/stage0-fresh-process-recovery-v0.6.2_45/published-original-0.6.2_1.pkg
            /usr/local/bin/python3 scripts/stage0-opnsense-real-boot-pkg-recovery.py prepare
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-real-boot-pkg-recovery.py verify
