name: Cleanup obsolete branches

on:
  push:
    paths:
      - .github/workflows/cleanup-obsolete-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/repository-hygiene
      - name: Remove superseded refs and self-clean
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' > /tmp/branches.txt
          while IFS= read -r branch
          do
            case "${branch}" in
              main|recovery/base|agent/repository-hygiene)
                continue
                ;;
            esac
            echo "Deleting superseded branch: ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done < /tmp/branches.txt

          rm -f .github/workflows/cleanup-obsolete-branches.yml
          git config user.name 'Tolian82'
          git config user.email '309637356+Tolian82@users.noreply.github.com'
          git add .github/workflows/cleanup-obsolete-branches.yml
          git commit -m 'chore: remove obsolete branch cleanup workflow'
          git push origin HEAD:agent/repository-hygiene
