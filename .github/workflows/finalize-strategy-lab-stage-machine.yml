name: Finalize Strategy Lab stage machine

on:
  push:
    branches:
      - agent/strategy-lab-stage-machine

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply focused orchestration replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          makefile = Path('Makefile')
          text = makefile.read_text()
          if 'PLUGIN_REVISION=    17' not in text:
              raise SystemExit('revision 17 baseline not found')
          makefile.write_text(text.replace('PLUGIN_REVISION=    17', 'PLUGIN_REVISION=    18'))

          worker = Path('src/opnsense/scripts/OPNsense/Zapret/strategy_lab_worker.sh')
          text = worker.read_text()
          old = 'for worker_module in worker_messages worker_control worker_expansion_messages worker_stability_messages worker_extended_messages worker_quic_messages worker_udp_messages worker_flow'
          new = 'for worker_module in worker_messages worker_expansion_messages worker_stability_messages worker_extended_messages worker_quic_messages worker_udp_messages worker_stage_machine worker_control worker_flow'
          if old not in text:
              raise SystemExit('worker module baseline not found')
          worker.write_text(text.replace(old, new))

          control = Path('src/opnsense/scripts/OPNsense/Zapret/strategy_lab/worker_control.sh')
          text = control.read_text()
          if 'strategy_lab_skip_unfinished' not in text:
              raise SystemExit('worker control hook baseline not found')
          control.write_text(text.replace('strategy_lab_skip_unfinished', 'worker_skip_unfinished'))

          flow = Path('src/opnsense/scripts/OPNsense/Zapret/strategy_lab/worker_flow.sh')
          text = flow.read_text()
          accessible_old = 'strategy_lab_skip_unfinished "${JOB_ID}" "${TARGET_ACCESSIBLE_SKIP}"'
          accessible_new = 'worker_skip_unfinished "${JOB_ID}" "${TARGET_ACCESSIBLE_SKIP}"'
          tail_old = 'strategy_lab_skip_unfinished "${JOB_ID}" "${PENDING_MESSAGE}"\nworker_finish PARTIAL false "${PARTIAL_FINAL_MESSAGE}"\n'
          tail_new = 'worker_run_search_stages\nworker_finish PARTIAL false "${PARTIAL_FINAL_MESSAGE}"\n'
          if accessible_old not in text or tail_old not in text:
              raise SystemExit('worker flow hook baseline not found')
          flow.write_text(text.replace(accessible_old, accessible_new).replace(tail_old, tail_new))

          aggregate = Path('scripts/test-strategy-lab-job-contract.sh')
          text = aggregate.read_text()
          marker = 'sh "${ROOT_DIR}/scripts/test-strategy-lab-active-cancel.sh"\n'
          if marker not in text:
              raise SystemExit('aggregate marker not found')
          aggregate.write_text(text.replace(marker, marker + 'sh "${ROOT_DIR}/scripts/test-strategy-lab-stage-machine.sh"\n'))

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text()
          text = text.replace('Current package candidate: `0.3.2_17`.', 'Current package candidate: `0.3.2_18`.')
          text = text.replace('- [ ] Corrective Patch 4 — explicit monotonic stage machine.', '- [x] Corrective Patch 4 — explicit monotonic stage machine.')
          roadmap.write_text(text)

          Path('.github/workflows/finalize-strategy-lab-stage-machine.yml').unlink()
          PY

          chmod 0755 \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab/worker_stage_machine.sh \
            scripts/test-strategy-lab-stage-machine.sh

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v0.3.2_18: Make Strategy Lab stages explicit"
          git push origin HEAD:agent/strategy-lab-stage-machine
