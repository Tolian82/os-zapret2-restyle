name: G02 real native ordinary GUI firmware uninstall and reinstall

on:
  pull_request:
    paths:
      - pkg/+POST_DEINSTALL
      - scripts/test-g02-normal-uninstall.py
      - scripts/stage2-opnsense-real-native-normal-uninstall.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-g02:
    name: Real OPNsense GUI removal backend, menu invalidation and state-preserving reinstall
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fast ordinary-uninstall safety contracts before native VM
        run: |
          set -eu
          sh -n pkg/+POST_DEINSTALL
          python3.13 -m py_compile scripts/test-g02-normal-uninstall.py scripts/stage2-opnsense-real-native-normal-uninstall.py
          python3.13 scripts/test-g02-normal-uninstall.py
      - name: Real ordinary Firmware removal and same-archive reinstall on disposable OPNsense
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage2-opnsense-real-native-clean-install.py
            GITHUB_ACTIONS=true ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_G02_DISPOSABLE_NATIVE=1 /usr/local/bin/python3 scripts/stage2-opnsense-real-native-normal-uninstall.py
