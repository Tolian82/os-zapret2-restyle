name: Fix Patch 10 lifecycle recovery fixture

on:
  push:
    paths:
      - .github/workflows/fix-patch10-lifecycle-recovery.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/strategy-lab-e2e-harness
      - name: Align lifecycle fixture and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/lib/test-strategy-lab-lifecycle-cases.sh')
          text = path.read_text()
          old = '''idle=$(launcher status)\nprintf '%s\\n' "${idle}" | jq -e '.status=="idle"' >/dev/null || fail "idle state was not reported"'''
          new = '''latest=$(launcher status)\nprintf '%s\\n' "${latest}" | jq -e --arg job "${job}" '.job_id==$job' >/dev/null ||\n    fail "latest persisted job was not recovered"\nmv "${RUN_DIR}/jobs" "${RUN_DIR}/jobs.saved"\nmkdir -p "${RUN_DIR}/jobs"\nidle=$(launcher status)\nprintf '%s\\n' "${idle}" | jq -e '.status=="idle"' >/dev/null || fail "empty job store did not report idle"\nrm -rf "${RUN_DIR}/jobs"\nmv "${RUN_DIR}/jobs.saved" "${RUN_DIR}/jobs"'''
          if old not in text:
              raise SystemExit('expected idle fixture block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-patch10-lifecycle-recovery.yml
          git config user.name 'Tolian82'
          git config user.email '309637356+Tolian82@users.noreply.github.com'
          git add scripts/lib/test-strategy-lab-lifecycle-cases.sh .github/workflows/fix-patch10-lifecycle-recovery.yml
          git commit -m 'test: align lifecycle fixture with latest-job recovery'
          git push origin HEAD:agent/strategy-lab-e2e-harness
