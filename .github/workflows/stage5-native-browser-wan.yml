name: Native OPNsense Chromium WAN and P3 RU/EN (bounded clean install)

on:
  pull_request:
    paths:
      - VERSION
      - scripts/stage5-browser-wan.py
      - scripts/test-tz6v5-s03e3-native-wan-refusal.py
      - scripts/test-tz6v5-s03e3b-native-configd-fd9-busy-red.py
      - scripts/test-tz6v5-s03e3c-native-http-fd9-hold.py
      - scripts/test-tz6v5-s03e3d-verified-lifecycle-contract.py
      - scripts/test-tz6v5-s05c2a-http-reason.py
      - scripts/test-tz6v5-s05c2a-fd9-refusal.sh
      - src/opnsense/scripts/OPNsense/Zapret/zapret_service.sh
      - src/opnsense/service/conf/actions.d/actions_zapret.conf
      - src/opnsense/mvc/app/controllers/OPNsense/Zapret/Api/ServiceController.php
      - scripts/p3-browser-i18n.py
      - scripts/p3-native-profile-locale.php
      - src/opnsense/mvc/app/views/OPNsense/Zapret/voice.volt
      - src/opnsense/mvc/app/views/OPNsense/Zapret/general.volt
      - src/opnsense/mvc/app/controllers/OPNsense/Zapret/Api/SettingsController.php
      - src/opnsense/mvc/app/controllers/OPNsense/Zapret/Api/SettingsApply.php
      - src/opnsense/mvc/app/models/OPNsense/Zapret/Zapret.xml
  push:
    branches: [main]
    paths:
      - VERSION
      - scripts/stage5-browser-wan.py
      - scripts/test-tz6v5-s03e3-native-wan-refusal.py
      - scripts/test-tz6v5-s03e3b-native-configd-fd9-busy-red.py
      - scripts/test-tz6v5-s03e3c-native-http-fd9-hold.py
      - scripts/test-tz6v5-s03e3d-verified-lifecycle-contract.py
      - scripts/test-tz6v5-s05c2a-http-reason.py
      - scripts/test-tz6v5-s05c2a-fd9-refusal.sh
      - src/opnsense/scripts/OPNsense/Zapret/zapret_service.sh
      - src/opnsense/service/conf/actions.d/actions_zapret.conf
      - src/opnsense/mvc/app/controllers/OPNsense/Zapret/Api/ServiceController.php
      - scripts/p3-browser-i18n.py
      - scripts/p3-native-profile-locale.php
      - src/opnsense/mvc/app/views/OPNsense/Zapret/voice.volt
      - src/opnsense/mvc/app/views/OPNsense/Zapret/general.volt
      - src/opnsense/mvc/app/controllers/OPNsense/Zapret/Api/SettingsController.php
      - src/opnsense/mvc/app/controllers/OPNsense/Zapret/Api/SettingsApply.php
      - src/opnsense/mvc/app/models/OPNsense/Zapret/Zapret.xml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  genuine-installed-browser-wan:
    name: Real Chromium WAN and RU/EN on fresh installed OPNsense 26.7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Offline exact-source GUI selectors and actual Chromium harness
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage5-browser-wan.py scripts/p3-browser-i18n.py scripts/test-tz6v5-s03e3-native-wan-refusal.py
          python3.13 scripts/test-tz6v5-s03e3-native-wan-refusal.py --self-test
          python3.13 -m py_compile scripts/test-tz6v5-s03e3b-native-configd-fd9-busy-red.py
          python3.13 scripts/test-tz6v5-s03e3b-native-configd-fd9-busy-red.py --self-test
          python3.13 -m py_compile scripts/test-tz6v5-s03e3c-native-http-fd9-hold.py
          python3.13 scripts/test-tz6v5-s03e3c-native-http-fd9-hold.py --self-test
          python3.13 -m py_compile scripts/test-tz6v5-s03e3d-verified-lifecycle-contract.py
          python3.13 scripts/test-tz6v5-s03e3d-verified-lifecycle-contract.py --self-test
          python3.13 scripts/test-tz6v5-s05c2a-http-reason.py
          sh scripts/test-tz6v5-s05c2a-fd9-refusal.sh
          python3.13 scripts/p3-browser-i18n.py --self-test
          python3.13 -m pip install --disable-pip-version-check playwright
          chromium_bin="$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chromium_bin" && test -x "$chromium_bin"
          printf 'STAGE5_LOCAL_CHROMIUM=%s\n' "$chromium_bin" >> "$GITHUB_ENV"
          STAGE5_LOCAL_CHROMIUM="$chromium_bin" python3.13 scripts/stage5-browser-wan.py --self-test
      - name: Generate one disposable runner-only SSH key, not a repo credential
        run: |
          set -eu
          install -d -m 0700 "$RUNNER_TEMP/zapret2-browser-ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/zapret2-browser-ssh/key"
          install -d -m 0700 dist
          cp "$RUNNER_TEMP/zapret2-browser-ssh/key.pub" stage5-browser-wan-ci.pub
      - name: Fail early if host DNS cannot install QEMU
        shell: bash
        run: |
          set -euo pipefail
          # The native VM action needs QEMU on the Ubuntu host before a guest
          # exists. Do not spend dozens of minutes in apt's DNS retries.
          if command -v qemu-system-x86_64 >/dev/null 2>&1 &&
             command -v qemu-img >/dev/null 2>&1; then
            echo "P3_QEMU_HOST=already_installed"
          elif ! timeout 8 getent ahostsv4 azure.archive.ubuntu.com >/dev/null; then
            # Repair DNS only on this disposable GitHub-hosted runner; the
            # package feed remains TLS + Ubuntu apt signature verified.
            # Never alter a user appliance, saved Config or production DNS.
            if command -v resolvectl >/dev/null 2>&1 &&
               command -v ip >/dev/null 2>&1; then
              dns_if="$(ip -o -4 route show default | awk 'NR==1 {print $5}')"
              if [ -n "$dns_if" ]; then
                timeout 5 sudo resolvectl dns "$dns_if" 1.1.1.1 8.8.8.8 >/dev/null 2>&1 || true
                timeout 5 sudo resolvectl flush-caches >/dev/null 2>&1 || true
              fi
            fi
            if timeout 8 getent ahostsv4 azure.archive.ubuntu.com >/dev/null; then
              echo "P3_QEMU_HOST=runner_dns_recovered"
            else
            # The Ubuntu-hosted runner's Azure mirror can fail independently of
            # the official archive and security mirrors. Preserve apt's signed
            # package verification and replace ONLY the disposable runner's
            # mirrors when both official alternatives are actually reachable.
            . /etc/os-release
            suite="${VERSION_CODENAME:?missing Ubuntu codename}"
            if timeout 8 getent ahostsv4 archive.ubuntu.com >/dev/null &&
               timeout 8 getent ahostsv4 security.ubuntu.com >/dev/null &&
               curl -fIsS --connect-timeout 5 --max-time 10 "https://archive.ubuntu.com/ubuntu/dists/${suite}/InRelease" >/dev/null; then
              source_list=/etc/apt/sources.list.d/ubuntu.sources
              if ! test -f "$source_list" ||
                 ! grep -qF 'mirror+file:/etc/apt/apt-mirrors.txt' "$source_list"; then
                echo "::error title=Runner apt source unexpected::Cannot safely switch to verified official Ubuntu mirror; OPNsense NOT TESTED" >&2
                exit 1
              fi
              sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' "$source_list"
              echo "P3_QEMU_HOST=official_archive_fallback"
            else
              echo "::error title=Runner DNS outage::Azure mirror unavailable after bounded temporary resolver recovery and no verified official archive fallback; installed OPNsense/Chromium NOT TESTED" >&2
              exit 1
            fi
            fi
          else
            echo "P3_QEMU_HOST=apt_mirror_resolves"
          fi
          # Bound apt retries even after a successful host-side DNS check.
          echo 'Acquire::Retries "0"; Acquire::http::Timeout "15"; Acquire::https::Timeout "15";' |
            sudo tee /etc/apt/apt.conf.d/99zapret-ci-bounded-network >/dev/null
      - name: Native OPNsense 26.7 - cached dependencies, genuine current Mk pkg clean install
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: '26.7'
          sync: rsync
          copyback: true
          cpu: 3
          mem: 4096
          cache-after-prepare: true
          nat: |
            "32222": "22"
          prepare: |
            set -eu
            # These are image-owned dependencies, not source-specific code.
            # The action caches this prepared disposable image for later PRs.
            /usr/local/bin/python3 - <<'PY'
            import subprocess
            for command, seconds in (
                (["pkg", "update", "-f"], 150),
                (["pkg", "install", "-y", "git", "ca_root_nss", "jq",
                  "gmake", "pkgconf", "luajit"], 180),
            ):
                print("P3_IMAGE_PREPARE=" + command[1], flush=True)
                try:
                    subprocess.run(command, check=True, timeout=seconds)
                except subprocess.TimeoutExpired:
                    raise SystemExit("P3_IMAGE_PREPARE_TIMEOUT=" + command[1])
            PY
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            # P3 needs a genuine installed current package, NOT historical
            # RUNNING upgrade, upstream-engine compilation or IPFW ownership.
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage2-opnsense-real-native-clean-install.py
            pkg info -e os-zapret2-restyle
            test -s stage5-browser-wan-ci.pub
            grep -Eq '^ssh-ed25519 [A-Za-z0-9+/=]+' stage5-browser-wan-ci.pub
            install -d -m 0700 /root/.ssh
            cat stage5-browser-wan-ci.pub >> /root/.ssh/authorized_keys
            chmod 0600 /root/.ssh/authorized_keys
            # The QEMU guest is disposable; this key never enters the plugin.
      - name: S03e3d registered installed configd verified actions (read-only, no dispatch)
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true ZAPRET2_STAGE5_BROWSER_WAN=1 /usr/local/bin/python3 - <<'PY'
          import configparser
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          if not (sys.platform.startswith('freebsd') and os.geteuid() == 0 and
                  os.environ.get('GITHUB_ACTIONS') == 'true' and
                  os.environ.get('ZAPRET2_STAGE5_BROWSER_WAN') == '1'):
              raise SystemExit('S03E3D_NATIVE_DISPOSABLE_REGISTRY_GATE_REFUSED')
          source = Path('/usr/local/opnsense/service/conf/actions.d/actions_zapret.conf')
          if not source.is_file() or source.is_symlink():
              raise SystemExit('S03E3D_INSTALLED_CONFIGD_ACTION_SOURCE_MISSING')
          conf = configparser.RawConfigParser()
          if not conf.read(str(source)):
              raise SystemExit('S03E3D_INSTALLED_CONFIGD_ACTION_SOURCE_INVALID')
          base = '/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh'
          for action in ('stop', 'restart'):
              name = action + '_verified'
              if (not conf.has_section(name) or
                  conf.get(name, 'command', fallback='') !=
                  base + ' ' + action + ' --configd-receipt' or
                  conf.get(name, 'type', fallback='') != 'script_output'):
                  raise SystemExit('S03E3D_INSTALLED_ACTION_SOURCE_CHANGED_' + action)
          try:
              result = subprocess.run(
                  ['/usr/local/sbin/configctl', 'configd', 'actions', 'json'],
                  check=False, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=25)
              actions = json.loads(result.stdout) if result.returncode == 0 else None
          except (OSError, ValueError, subprocess.SubprocessError):
              raise SystemExit('S03E3D_LIVE_CONFIGD_ACTION_REGISTRY_UNAVAILABLE') from None
          if not isinstance(actions, dict) or any(
              'zapret ' + action + '_verified' not in actions
              for action in ('stop', 'restart')
          ):
              raise SystemExit('S03E3D_VERIFIED_ACTION_NOT_REGISTERED_IN_RUNNING_CONFIGD')
          print('S03E3D_NATIVE_CONFIGD_REGISTERED_VERIFIED_ACTIONS=PASS')
          PY
      - name: S03e3b original configd Stop and Restart FD9 BUSY RED on clean native guest
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true ZAPRET2_STAGE5_BROWSER_WAN=1 /usr/local/bin/python3 scripts/test-tz6v5-s03e3b-native-configd-fd9-busy-red.py --native
      - name: Open authenticated loopback-only SSH tunnel to disposable OPNsense
        env:
          ZAPRET2_STAGE5_BROWSER_WAN: '1'
        run: |
          set -eu
          test -s "$RUNNER_TEMP/zapret2-browser-ssh/key"
          ssh -fN -i "$RUNNER_TEMP/zapret2-browser-ssh/key" -p 32222 \
            -o BatchMode=yes -o ExitOnForwardFailure=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/zapret2-browser-ssh/known_hosts" \
            -L 127.0.0.1:18443:127.0.0.1:443 root@127.0.0.1
          curl -kfsS --max-time 20 -o /dev/null https://127.0.0.1:18443/index.php
      - name: S03e3c attest native installed guest and install ephemeral FD9 holder
        shell: opnsense {0}
        run: |
          set -eu
          test ! -e /root/s03e3c-native-http-fd9-hold.py
          test ! -e /root/s03e3c-disposable-ci.pub
          install -m 0700 scripts/test-tz6v5-s03e3c-native-http-fd9-hold.py /root/s03e3c-native-http-fd9-hold.py
          install -m 0600 stage5-browser-wan-ci.pub /root/s03e3c-disposable-ci.pub
          /usr/local/bin/python3 /root/s03e3c-native-http-fd9-hold.py --self-test
          GITHUB_ACTIONS=true ZAPRET2_P3_NATIVE_LOCALE=1 /usr/local/bin/php scripts/p3-native-profile-locale.php en_US
      - name: S03e3d genuine installed PHP Stop Restart HTTP GREEN English (native original FD9 BUSY)
        env:
          ZAPRET2_STAGE5_BROWSER_WAN: '1'
        run: |
          set -eu
          python3.13 scripts/stage5-browser-wan.py --s03e3d-en-browser
      - name: S03e3c genuine Russian locale on disposable OPNsense
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true ZAPRET2_P3_NATIVE_LOCALE=1 /usr/local/bin/php scripts/p3-native-profile-locale.php ru_RU
      - name: S03e3d genuine installed PHP Stop Restart HTTP GREEN Russian (native original FD9 BUSY)
        env:
          ZAPRET2_STAGE5_BROWSER_WAN: '1'
        run: |
          set -eu
          python3.13 scripts/stage5-browser-wan.py --s03e3d-ru-browser
      - name: S03e3c remove ephemeral guest-only native FD9 holder files
        shell: opnsense {0}
        run: |
          set -eu
          test -f /root/s03e3c-native-http-fd9-hold.py
          test -f /root/s03e3c-disposable-ci.pub
          rm /root/s03e3c-native-http-fd9-hold.py /root/s03e3c-disposable-ci.pub
      - name: S03e3 prepare genuine WAN-required native witness for English
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true ZAPRET2_P3_NATIVE_LOCALE=1 /usr/local/bin/php scripts/p3-native-profile-locale.php en_US
          GITHUB_ACTIONS=true ZAPRET2_STAGE5_BROWSER_WAN=1 /usr/local/bin/python3 scripts/test-tz6v5-s03e3-native-wan-refusal.py --prepare-en
      - name: S03e3 actual installed Chromium English native PHP WAN UserException
        env:
          ZAPRET2_STAGE5_BROWSER_WAN: '1'
        run: |
          set -eu
          python3.13 scripts/stage5-browser-wan.py --s03e3-en-browser
      - name: S03e3 native verify English did not mutate Config IPFW or engine
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true ZAPRET2_STAGE5_BROWSER_WAN=1 /usr/local/bin/python3 scripts/test-tz6v5-s03e3-native-wan-refusal.py --verify-en
      - name: S03e3 prepare genuine WAN-required native witness for Russian
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true ZAPRET2_P3_NATIVE_LOCALE=1 /usr/local/bin/php scripts/p3-native-profile-locale.php ru_RU
          GITHUB_ACTIONS=true ZAPRET2_STAGE5_BROWSER_WAN=1 /usr/local/bin/python3 scripts/test-tz6v5-s03e3-native-wan-refusal.py --prepare-ru
      - name: S03e3 actual installed Chromium Russian native PHP WAN UserException
        env:
          ZAPRET2_STAGE5_BROWSER_WAN: '1'
        run: |
          set -eu
          python3.13 scripts/stage5-browser-wan.py --s03e3-ru-browser
      - name: S03e3 native verify Russian did not mutate Config IPFW or engine
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true ZAPRET2_STAGE5_BROWSER_WAN=1 /usr/local/bin/python3 scripts/test-tz6v5-s03e3-native-wan-refusal.py --verify-ru
      - name: S03e3 restore disposable native root locale before WAN Apply
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true ZAPRET2_P3_NATIVE_LOCALE=1 /usr/local/bin/php scripts/p3-native-profile-locale.php en_US
      - name: Chromium real lower WAN Apply after pre-dispatch refusal tests
        env:
          ZAPRET2_STAGE5_BROWSER_WAN: '1'
        run: |
          set -eu
          python3.13 scripts/stage5-browser-wan.py --browser
      - name: Independent native Config verification after Chromium F5
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true ZAPRET2_STAGE5_BROWSER_WAN=1 /usr/local/bin/python3 scripts/stage5-browser-wan.py --native-confirm
      - name: P3 set logged-in root user profile to English using native Config (disposable guest ONLY)
        shell: opnsense {0}
        run: |
          set -eu
          /usr/local/bin/php -l scripts/p3-native-profile-locale.php
          GITHUB_ACTIONS=true ZAPRET2_P3_NATIVE_LOCALE=1 /usr/local/bin/php scripts/p3-native-profile-locale.php en_US
      - name: TZ6v2 capture exact no-write baseline for native five-list Chromium
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true /usr/local/bin/python3 - <<'PY'
          import hashlib
          import os
          import stat
          from pathlib import Path
          if os.environ.get('GITHUB_ACTIONS') != 'true' or not Path('/usr/local/opnsense').is_dir():
              raise SystemExit('P4_NOT_DISPOSABLE_OPNSENSE')
          # Test fixture ONLY. The separately installed upstream runtime
          # is not in this browser guest; production paths are unchanged.
          for item in (Path('/usr/local/etc/zapret2'), Path('/usr/local/etc/zapret2/ipset')):
              try:
                  marker = item.lstat()
              except FileNotFoundError:
                  item.mkdir(mode=0o755)
                  marker = item.lstat()
              if not stat.S_ISDIR(marker.st_mode) or marker.st_uid != 0 or marker.st_mode & 0o022:
                  raise SystemExit('P4_HOSTLIST_FIXTURE_PARENT_UNSAFE')
          target = Path('/usr/local/etc/zapret2/ipset/auto-domains.txt')
          try:
              marker = target.lstat()
          except FileNotFoundError:
              file_state = 'missing'
          else:
              if not stat.S_ISREG(marker.st_mode) or marker.st_uid != 0 or marker.st_nlink != 1 or marker.st_mode & 0o022 or target.read_bytes() != b'':
                  raise SystemExit('TZ6V2_AUTO_BASELINE_NOT_QUALIFIED')
              file_state = '%s:%s:%s:%s' % (
                  marker.st_dev, marker.st_ino, marker.st_size, marker.st_mtime_ns)
          Path('dist').mkdir(exist_ok=True)
          Path('dist/p4-gui-baseline.sha256').write_text(
              hashlib.sha256(Path('/conf/config.xml').read_bytes()).hexdigest() + '\n')
          Path('dist/tz6v2-auto-baseline.txt').write_text(file_state + '\n')
          print('TZ6V2_BROWSER_BASELINE=SAFE_MISSING_OR_EMPTY')
          PY
      - name: P3 real Chromium English Strategies and Voice native forms / F5 / validation
        env:
          ZAPRET2_P3_NATIVE_LOCALE: '1'
        run: |
          set -eu
          python3.13 scripts/p3-browser-i18n.py --en-browser
      - name: TZ6v2 verify found-only GUI did NOT write native Config or automatic file
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true /usr/local/bin/python3 - <<'PY'
          import hashlib
          import os
          import stat
          from pathlib import Path
          if os.environ.get('GITHUB_ACTIONS') != 'true' or not Path('/usr/local/opnsense').is_dir():
              raise SystemExit('P4_NOT_DISPOSABLE_OPNSENSE')
          baseline = Path('dist/p4-gui-baseline.sha256')
          if not baseline.is_file() or baseline.is_symlink():
              raise SystemExit('P4_BASELINE_MISSING')
          if baseline.read_text().strip() != hashlib.sha256(Path('/conf/config.xml').read_bytes()).hexdigest():
              raise SystemExit('TZ6V2_DRAFT_GUI_MUTATED_CONFIG_XML')
          target = Path('/usr/local/etc/zapret2/ipset/auto-domains.txt')
          marker_file = Path('dist/tz6v2-auto-baseline.txt')
          if not marker_file.is_file() or marker_file.is_symlink():
              raise SystemExit('TZ6V2_AUTO_BASELINE_MISSING')
          expected = marker_file.read_text().strip()
          if expected == 'missing':
              if target.exists() or target.is_symlink():
                  raise SystemExit('TZ6V2_DRAFT_GUI_CREATED_AUTO_HOSTLIST')
          else:
              state = target.lstat()
              if not stat.S_ISREG(state.st_mode) or state.st_uid != 0 or state.st_nlink != 1 or state.st_mode & 0o022 or target.read_bytes() != b'':
                  raise SystemExit('TZ6V2_DRAFT_GUI_MUTATED_AUTO_HOSTLIST')
              actual = '%s:%s:%s:%s' % (
                  state.st_dev, state.st_ino, state.st_size, state.st_mtime_ns)
              if actual != expected:
                  raise SystemExit('TZ6V2_DRAFT_GUI_REPLACED_AUTO_HOSTLIST')
          print('TZ6V2_FIVE_EDITOR_NO_APPLY_CLEANUP=PASS')
          PY
      - name: P3 set same logged-in root user profile to Russian using native Config (disposable guest ONLY)
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true ZAPRET2_P3_NATIVE_LOCALE=1 /usr/local/bin/php scripts/p3-native-profile-locale.php ru_RU
      - name: P3 real Chromium Russian forms / F5 / validation; ensure saved values match EN
        env:
          ZAPRET2_P3_NATIVE_LOCALE: '1'
        run: |
          set -eu
          python3.13 scripts/p3-browser-i18n.py --ru-browser
      - name: P3 restore disposable guest root user language to English via native Config
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true ZAPRET2_P3_NATIVE_LOCALE=1 /usr/local/bin/php scripts/p3-native-profile-locale.php en_US
      - name: Save redacted real-browser receipt (no credentials or Config XML)
        uses: actions/upload-artifact@v7
        with:
          name: stage5-real-browser-wan-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
