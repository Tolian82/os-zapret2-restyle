name: Native OPNsense Chromium WAN and P3 RU/EN (bounded clean install)

on:
  pull_request:
    paths:
      - VERSION
      - scripts/stage5-browser-wan.py
      - scripts/p3-browser-i18n.py
      - scripts/p3-native-profile-locale.php
      - src/opnsense/mvc/app/views/OPNsense/Zapret/voice.volt
      - src/opnsense/mvc/app/views/OPNsense/Zapret/general.volt
      - src/opnsense/mvc/app/controllers/OPNsense/Zapret/Api/SettingsController.php
      - src/opnsense/mvc/app/controllers/OPNsense/Zapret/Api/SettingsApply.php
      - src/opnsense/mvc/app/models/OPNsense/Zapret/Zapret.xml
  push:
    branches: [main]
    paths:
      - VERSION
      - scripts/stage5-browser-wan.py
      - scripts/p3-browser-i18n.py
      - scripts/p3-native-profile-locale.php
      - src/opnsense/mvc/app/views/OPNsense/Zapret/voice.volt
      - src/opnsense/mvc/app/views/OPNsense/Zapret/general.volt
      - src/opnsense/mvc/app/controllers/OPNsense/Zapret/Api/SettingsController.php
      - src/opnsense/mvc/app/controllers/OPNsense/Zapret/Api/SettingsApply.php
      - src/opnsense/mvc/app/models/OPNsense/Zapret/Zapret.xml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  genuine-installed-browser-wan:
    name: Real Chromium WAN and RU/EN on fresh installed OPNsense 26.7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Offline exact-source GUI selectors and actual Chromium harness
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage5-browser-wan.py scripts/p3-browser-i18n.py
          python3.13 scripts/p3-browser-i18n.py --self-test
          python3.13 -m pip install --disable-pip-version-check playwright
          chromium_bin="$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chromium_bin" && test -x "$chromium_bin"
          printf 'STAGE5_LOCAL_CHROMIUM=%s\n' "$chromium_bin" >> "$GITHUB_ENV"
          STAGE5_LOCAL_CHROMIUM="$chromium_bin" python3.13 scripts/stage5-browser-wan.py --self-test
      - name: Generate one disposable runner-only SSH key, not a repo credential
        run: |
          set -eu
          install -d -m 0700 "$RUNNER_TEMP/zapret2-browser-ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/zapret2-browser-ssh/key"
          install -d -m 0700 dist
          cp "$RUNNER_TEMP/zapret2-browser-ssh/key.pub" stage5-browser-wan-ci.pub
      - name: Fail early if host DNS cannot install QEMU
        shell: bash
        run: |
          set -euo pipefail
          # The native VM action needs QEMU on the Ubuntu host before a guest
          # exists. Do not spend dozens of minutes in apt's DNS retries.
          if command -v qemu-system-x86_64 >/dev/null 2>&1 &&
             command -v qemu-img >/dev/null 2>&1; then
            echo "P3_QEMU_HOST=already_installed"
          elif ! timeout 8 getent ahostsv4 azure.archive.ubuntu.com >/dev/null; then
            # Repair DNS only on this disposable GitHub-hosted runner; the
            # package feed remains TLS + Ubuntu apt signature verified.
            # Never alter a user appliance, saved Config or production DNS.
            if command -v resolvectl >/dev/null 2>&1 &&
               command -v ip >/dev/null 2>&1; then
              dns_if="$(ip -o -4 route show default | awk 'NR==1 {print $5}')"
              if [ -n "$dns_if" ]; then
                timeout 5 sudo resolvectl dns "$dns_if" 1.1.1.1 8.8.8.8 >/dev/null 2>&1 || true
                timeout 5 sudo resolvectl flush-caches >/dev/null 2>&1 || true
              fi
            fi
            if timeout 8 getent ahostsv4 azure.archive.ubuntu.com >/dev/null; then
              echo "P3_QEMU_HOST=runner_dns_recovered"
            else
            # The Ubuntu-hosted runner's Azure mirror can fail independently of
            # the official archive and security mirrors. Preserve apt's signed
            # package verification and replace ONLY the disposable runner's
            # mirrors when both official alternatives are actually reachable.
            . /etc/os-release
            suite="${VERSION_CODENAME:?missing Ubuntu codename}"
            if timeout 8 getent ahostsv4 archive.ubuntu.com >/dev/null &&
               timeout 8 getent ahostsv4 security.ubuntu.com >/dev/null &&
               curl -fIsS --connect-timeout 5 --max-time 10 "https://archive.ubuntu.com/ubuntu/dists/${suite}/InRelease" >/dev/null; then
              source_list=/etc/apt/sources.list.d/ubuntu.sources
              if ! test -f "$source_list" ||
                 ! grep -qF 'mirror+file:/etc/apt/apt-mirrors.txt' "$source_list"; then
                echo "::error title=Runner apt source unexpected::Cannot safely switch to verified official Ubuntu mirror; OPNsense NOT TESTED" >&2
                exit 1
              fi
              sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' "$source_list"
              echo "P3_QEMU_HOST=official_archive_fallback"
            else
              echo "::error title=Runner DNS outage::Azure mirror unavailable after bounded temporary resolver recovery and no verified official archive fallback; installed OPNsense/Chromium NOT TESTED" >&2
              exit 1
            fi
            fi
          else
            echo "P3_QEMU_HOST=apt_mirror_resolves"
          fi
          # Bound apt retries even after a successful host-side DNS check.
          echo 'Acquire::Retries "0"; Acquire::http::Timeout "15"; Acquire::https::Timeout "15";' |
            sudo tee /etc/apt/apt.conf.d/99zapret-ci-bounded-network >/dev/null
      - name: Native OPNsense 26.7 - cached dependencies, genuine current Mk pkg clean install
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: '26.7'
          sync: rsync
          copyback: true
          cpu: 3
          mem: 4096
          cache-after-prepare: true
          nat: |
            "32222": "22"
          prepare: |
            set -eu
            # These are image-owned dependencies, not source-specific code.
            # The action caches this prepared disposable image for later PRs.
            /usr/local/bin/python3 - <<'PY'
            import subprocess
            for command, seconds in (
                (["pkg", "update", "-f"], 150),
                (["pkg", "install", "-y", "git", "ca_root_nss", "jq",
                  "gmake", "pkgconf", "luajit"], 180),
            ):
                print("P3_IMAGE_PREPARE=" + command[1], flush=True)
                try:
                    subprocess.run(command, check=True, timeout=seconds)
                except subprocess.TimeoutExpired:
                    raise SystemExit("P3_IMAGE_PREPARE_TIMEOUT=" + command[1])
            PY
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            # P3 needs a genuine installed current package, NOT historical
            # RUNNING upgrade, upstream-engine compilation or IPFW ownership.
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage2-opnsense-real-native-clean-install.py
            pkg info -e os-zapret2-restyle
            test -s stage5-browser-wan-ci.pub
            grep -Eq '^ssh-ed25519 [A-Za-z0-9+/=]+' stage5-browser-wan-ci.pub
            install -d -m 0700 /root/.ssh
            cat stage5-browser-wan-ci.pub >> /root/.ssh/authorized_keys
            chmod 0600 /root/.ssh/authorized_keys
            # The QEMU guest is disposable; this key never enters the plugin.
      - name: Chromium through authenticated loopback-only SSH tunnel; real lower Apply
        env:
          ZAPRET2_STAGE5_BROWSER_WAN: '1'
        run: |
          set -eu
          test -s "$RUNNER_TEMP/zapret2-browser-ssh/key"
          ssh -fN -i "$RUNNER_TEMP/zapret2-browser-ssh/key" -p 32222 \
            -o BatchMode=yes -o ExitOnForwardFailure=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/zapret2-browser-ssh/known_hosts" \
            -L 127.0.0.1:18443:127.0.0.1:443 root@127.0.0.1
          curl -kfsS --max-time 20 -o /dev/null https://127.0.0.1:18443/index.php
          python3.13 scripts/stage5-browser-wan.py --browser
      - name: Independent native Config verification after Chromium F5
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true ZAPRET2_STAGE5_BROWSER_WAN=1 /usr/local/bin/python3 scripts/stage5-browser-wan.py --native-confirm
      - name: P3 set logged-in root user profile to English using native Config (disposable guest ONLY)
        shell: opnsense {0}
        run: |
          set -eu
          /usr/local/bin/php -l scripts/p3-native-profile-locale.php
          GITHUB_ACTIONS=true ZAPRET2_P3_NATIVE_LOCALE=1 /usr/local/bin/php scripts/p3-native-profile-locale.php en_US
      - name: P3 real Chromium English Strategies and Voice native forms / F5 / validation
        env:
          ZAPRET2_P3_NATIVE_LOCALE: '1'
        run: |
          set -eu
          python3.13 scripts/p3-browser-i18n.py --en-browser
      - name: P3 set same logged-in root user profile to Russian using native Config (disposable guest ONLY)
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true ZAPRET2_P3_NATIVE_LOCALE=1 /usr/local/bin/php scripts/p3-native-profile-locale.php ru_RU
      - name: P3 real Chromium Russian forms / F5 / validation; ensure saved values match EN
        env:
          ZAPRET2_P3_NATIVE_LOCALE: '1'
        run: |
          set -eu
          python3.13 scripts/p3-browser-i18n.py --ru-browser
      - name: P3 restore disposable guest root user language to English via native Config
        shell: opnsense {0}
        run: |
          set -eu
          GITHUB_ACTIONS=true ZAPRET2_P3_NATIVE_LOCALE=1 /usr/local/bin/php scripts/p3-native-profile-locale.php en_US
      - name: Save redacted real-browser receipt (no credentials or Config XML)
        uses: actions/upload-artifact@v7
        with:
          name: stage5-real-browser-wan-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/stage5-browser-wan-result.json
            dist/p3-browser-i18n-en.json
            dist/p3-browser-i18n-ru.json
          if-no-files-found: error
          retention-days: 7
