name: Apply Patch 9 precheck

on:
  push:
    paths:
      - .github/workflows/apply-patch9-precheck.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/strategy-lab-domain-contract
      - name: Replace implicit IP scenario
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-strategy-lab-precheck.sh')
          text = path.read_text()
          old = '''# IPv4 target uses an explicit TCP/443 baseline without pretending to have DNS or SNI.\nunset MOCK_IPV4_CONTROL_STATUS\nMOCK_NC_STATUS=1\nexport MOCK_NC_STATUS\nresult=$(run_job 203.0.113.9 ru)\nprintf '%s\\n' "${result}" | jq -e '.target_type=="ip" and .baseline.dns_a=="SKIPPED" and .baseline.endpoints[0].transport=="tcp-443"' >/dev/null ||\n    fail "IP target baseline contract is incorrect"\nprintf '%s\\n' "${result}" | jq -e '.stages[] | select(.number=="40" and .message=="PASS — Прямое TCP/443-подключение к IP-цели не установлено.")' >/dev/null ||\n    fail "Russian IP baseline summary is incorrect"\n\n\n'''
          new = '''# Bare IPv4 is rejected because Strategy Lab requires domain, DNS, SNI, and HTTPS semantics.\nunset MOCK_IPV4_CONTROL_STATUS\nset +e\nip_result=$(launcher start 203.0.113.9 standard ru 2>&1)\nip_status=$?\nset -e\n[ "${ip_status}" -eq 64 ] || fail "bare IPv4 target was accepted"\nprintf '%s\\n' "${ip_result}" | grep -Fq 'invalid target' ||\n    fail "bare IPv4 rejection reason is missing"\n\n'''
          if old not in text:
              raise SystemExit('expected implicit IP precheck block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/apply-patch9-precheck.yml
          git config user.name 'Tolian82'
          git config user.email '309637356+Tolian82@users.noreply.github.com'
          git add scripts/test-strategy-lab-precheck.sh .github/workflows/apply-patch9-precheck.yml
          git commit -m 'test: reject implicit Strategy Lab IP targets'
          git push origin HEAD:agent/strategy-lab-domain-contract
