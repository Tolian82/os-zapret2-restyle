name: Stage 0 genuine old Status versus sidecar pkg gate and direct bypass

on:
  pull_request:
    paths:
      - scripts/stage0-opnsense-pkg-sidecar-bypass.py
      - scripts/test-stage0-opnsense-pkg-sidecar-bypass.py
      - scripts/stage0-opnsense-installed-predecessor.py
      - scripts/stage0-opnsense-old-service-fd9.py
      - scripts/stage0-opnsense-guest-readonly.py
      - .github/workflows/stage0-opnsense-pkg-sidecar-bypass.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidecar-guard-vs-direct-pkg:
    name: Genuine installed predecessor Status and synthetic direct pkg bypass
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fast Python syntax and 13 offline negative contracts
        run: |
          python3.13 -m py_compile scripts/stage0-opnsense-pkg-sidecar-bypass.py scripts/test-stage0-opnsense-pkg-sidecar-bypass.py
          python3.13 scripts/test-stage0-opnsense-pkg-sidecar-bypass.py -v
      - name: Disposable OPNsense 26.7 authentic old Status and native pkg bypass
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          mem: 4096
          cpu: 2
          disable-cache: true
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            /usr/local/bin/python3 scripts/stage0-opnsense-pkg-sidecar-bypass.py /tmp/os-zapret2-restyle-0.6.2_1.pkg
