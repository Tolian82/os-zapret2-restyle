name: Finalize clean Strategy Lab terminal results

on:
  push:
    branches:
      - agent/strategy-lab-terminal-results-final

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply diagnosed test corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          precheck = Path('scripts/test-strategy-lab-precheck.sh')
          text = precheck.read_text()
          old = '[ "${state}" != completed ] || return 0'
          new = 'case "${state}" in completed|error) return 0 ;; esac'
          if old not in text:
              raise SystemExit('precheck terminal-state baseline not found')
          precheck.write_text(text.replace(old, new))

          terminal = Path('scripts/test-strategy-lab-terminal-result.sh')
          text = terminal.read_text()
          old = "! grep -Fq '_FINAL_MESSAGE' \"${CONTROL}\" || fail 'worker control still uses load-order final messages'"
          new = "! grep -Fq 'PARTIAL_FINAL_MESSAGE' \"${CONTROL}\" || fail 'worker control still uses the partial final-message override'\n! grep -Fq 'ERROR_FINAL_MESSAGE' \"${CONTROL}\" || fail 'worker control still uses the error final-message override'\n! grep -Fq 'TIMEOUT_FINAL_MESSAGE' \"${CONTROL}\" || fail 'worker control still uses the timeout final-message override'\n! grep -Fq 'CANCEL_FINAL_MESSAGE' \"${CONTROL}\" || fail 'worker control still uses the cancel final-message override'"
          if old not in text:
              raise SystemExit('terminal static assertion baseline not found')
          terminal.write_text(text.replace(old, new))

          devlog = Path('docs/devlog/DEVLOG-2026-08-05-STRATEGY-LAB-TERMINAL-RESULTS.md')
          text = devlog.read_text()
          insertion = '''\n## Failed publication attempt and diagnosis\n\nPR #73 was closed without merge after the aggregate diagnostics test failed. A dedicated non-PR workflow ran the terminal-result, lifecycle, job-contract, and aggregate tests separately and uploaded exact logs.\n\nThe product lifecycle test passed. The two failures were stale test assumptions: the precheck helper waited only for `completed` even though `TIMEOUT` is now correctly terminal `error`, and a broad `_FINAL_MESSAGE` grep matched the new local `WORKER_FINAL_MESSAGE` variable rather than an old load-order override. The clean replacement updates those assertions without changing the approved runtime result contract.\n'''
          marker = '\n## Architectural boundary\n'
          if marker not in text:
              raise SystemExit('devlog insertion marker not found')
          devlog.write_text(text.replace(marker, insertion + marker))

          Path('.github/workflows/finalize-strategy-lab-terminal-results-clean.yml').unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: align terminal result expectations"
          git push origin HEAD:agent/strategy-lab-terminal-results-final
