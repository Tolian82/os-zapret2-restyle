name: Stage 2 OPNsense official runtime provider and build cutover preflight

on:
  pull_request:
    paths:
      - scripts/stage2-opnsense-native-provider-preflight.py
      - scripts/test-stage2-opnsense-native-provider-preflight.py
      - .github/workflows/stage2-opnsense-native-provider-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-preflight:
    name: Genuine OPNsense 26.7 signed catalog / provider and legacy cutover audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fast exact-source Python contract tests
        run: |
          python3.13 -m py_compile scripts/stage2-opnsense-native-provider-preflight.py scripts/test-stage2-opnsense-native-provider-preflight.py
          python3.13 scripts/test-stage2-opnsense-native-provider-preflight.py -v
      - name: Official OPNsense catalog + real provider audit in disposable native guest
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          mem: 4096
          cpu: 2
          disable-cache: true
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git python313
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage2-opnsense-native-provider-preflight.py
