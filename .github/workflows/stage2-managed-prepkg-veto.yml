name: Stage 2 real managed pre-pkg FD9 veto without package replacement
on:
  pull_request:
    paths:
      - Makefile
      - scripts/stage2-managed-prepkg-veto-witness.py
      - scripts/test-stage2-managed-prepkg-veto-witness.py
      - scripts/stage2-prepkg-locked-cold-revalidation.py
      - scripts/stage0-opnsense-prepkg-readonly.py
      - scripts/stage0-installed-predecessor-readonly.py
      - scripts/stage0-opnsense-foreign-ipfw-admission.py
      - scripts/stage2-opnsense-real-unsafe-owner-replacement.py
      - .github/workflows/stage2-managed-prepkg-veto.yml
  workflow_dispatch:
    inputs:
      fast_only:
        description: Offline tests only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  managed-veto:
    name: Real old Status=2 + FD9 busy/journal veto before any native pkg mutation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fast offline source contracts (real runnable unit tests)
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage2-managed-prepkg-veto-witness.py scripts/test-stage2-managed-prepkg-veto-witness.py
          python3.13 scripts/test-stage2-managed-prepkg-veto-witness.py -v
      - name: Isolated OPNsense 26.7 real installed predecessor managed-veto proof
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.fast_only != true) }}
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit lua54
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            GITHUB_ACTIONS=true ZAPRET2_STAGE2_LOCKED_COLD_REVALIDATION=1 ZAPRET2_STAGE2_MANAGED_PREPKG_WITNESS=1 /usr/local/bin/python3 scripts/stage2-managed-prepkg-veto-witness.py --execute /tmp/os-zapret2-restyle-0.6.2_1.pkg
