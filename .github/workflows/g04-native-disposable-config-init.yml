name: G04 native first saved Config and user-empty reinstall

on:
  pull_request:
    paths:
      - pkg/+POST_INSTALL
      - src/opnsense/scripts/OPNsense/Zapret/initialize_config.php
      - scripts/test-g04-initial-config.php
      - scripts/test-package-lifecycle-restart.sh
      - scripts/stage2-opnsense-real-native-clean-install.py
      - scripts/stage2-opnsense-g04-native-config.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-g04:
    name: Fast G04 native Config persistence and existing-hook contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify exact once-only Config, model and hook behavior
        run: |
          set -eu
          php -l src/opnsense/scripts/OPNsense/Zapret/initialize_config.php
          php scripts/test-g04-initial-config.php
          sh -n pkg/+POST_INSTALL
          sh -n scripts/test-package-lifecycle-restart.sh
          sh scripts/test-package-lifecycle-restart.sh
          python3.13 -m py_compile scripts/stage2-opnsense-real-native-clean-install.py scripts/stage2-opnsense-g04-native-config.py
          python3.13 scripts/test-stage2-opnsense-real-native-clean-install.py
  native-g04:
    needs: fast-g04
    name: Real OPNsense 26.7 native Config first save + same archive reinstall
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Genuine pkg install, saved first Config and ordinary reinstall in one guest
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1 ZAPRET2_G04_DISPOSABLE_NATIVE=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage2-opnsense-g04-native-config.py
