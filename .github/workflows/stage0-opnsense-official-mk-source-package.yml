name: Stage 0 official OPNsense Mk source package proof

on:
  pull_request:
    paths:
      - src/opnsense/scripts/OPNsense/Zapret/zapret_service.sh
      - scripts/stage0-opnsense-official-mk-source-package.py
      - scripts/test-stage0-opnsense-official-mk-source-package.py
      - .github/workflows/stage0-opnsense-official-mk-source-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-mk-source:
    name: Real OPNsense 26.7 official Mk source-package executable mode
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Local Python fast contracts for official Mk target
        run: |
          python3.13 -m py_compile scripts/stage0-opnsense-official-mk-source-package.py scripts/test-stage0-opnsense-official-mk-source-package.py
          python3.13 scripts/test-stage0-opnsense-official-mk-source-package.py -v
      - name: Read-only source-package qualification inside disposable real OPNsense
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          mem: 4096
          cpu: 2
          disable-cache: true
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git python313
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage0-opnsense-official-mk-source-package.py
