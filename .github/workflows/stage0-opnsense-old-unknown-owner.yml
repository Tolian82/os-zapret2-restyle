name: Stage 0 characterize original old pre-deinstall refusal on OPNsense

on:
  pull_request:
    paths:
      - scripts/stage0-opnsense-old-unknown-owner.py
      - scripts/test-stage0-opnsense-old-unknown-owner.py
      - scripts/stage0-opnsense-installed-predecessor.py
      - scripts/stage0-opnsense-old-deinstall.py
      - scripts/stage0-opnsense-old-service-fd9.py
      - .github/workflows/stage0-opnsense-old-unknown-owner.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-old-owner-refusal:
    name: Real original 0.6.2_1 unknown owner versus native pkg delete outcome
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Offline no-mutation and refusal contracts
        run: |
          python3.13 -m py_compile scripts/stage0-opnsense-old-unknown-owner.py scripts/test-stage0-opnsense-old-unknown-owner.py
          python3.13 scripts/test-stage0-opnsense-old-unknown-owner.py -v
      - name: Measure original 0.6.2_1 INCOMPLETE owner versus native pkg delete and preserve hazard evidence
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          mem: 4096
          cpu: 2
          disable-cache: true
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            /usr/local/bin/python3 scripts/stage0-opnsense-installed-predecessor.py /tmp/os-zapret2-restyle-0.6.2_1.pkg
            /usr/local/bin/python3 scripts/stage0-opnsense-old-unknown-owner.py /tmp/os-zapret2-restyle-0.6.2_1.pkg
