name: PR completion watchdog

on:
  workflow_run:
    workflows:
      - 'CI'
    types: [completed]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pr-completion-watchdog.yml

permissions:
  contents: read
  actions: read
  issues: write
  # GitHub's PR timeline comment endpoint has returned 403 with issues:write
  # despite the declared scope. Do not execute code from an untrusted PR.
  pull-requests: write

concurrency:
  group: pr-completion-watchdog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  alert-owner:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Offline positive and negative monitoring contracts
        run: |
          python3.13 -m py_compile scripts/github_pr_watchdog.py scripts/test_github_pr_watchdog.py
          python3.13 scripts/test_github_pr_watchdog.py -v
      - name: Classify open same-repository PRs and notify only actionable transitions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python3.13 scripts/github_pr_watchdog.py
