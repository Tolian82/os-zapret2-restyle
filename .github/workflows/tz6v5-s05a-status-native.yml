name: TZ6v5 S05a real OPNsense read-only Status JSON five-state gate

on:
  pull_request:
    paths:
      - src/opnsense/scripts/OPNsense/Zapret/zapret_service.sh
      - src/opnsense/scripts/OPNsense/Zapret/backend/status_readonly.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/status_projection.py
      - scripts/tz6v5-s05a-status-json-native.py
      - .github/workflows/tz6v5-s05a-status-native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s05a-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cold:
    name: S05a native JSON Status fresh/plugin-only/engine-only with no-write
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: S05a exact source status syntax and pure model RED/GREEN
        run: |
          python3.13 -m py_compile scripts/tz6v5-s05a-status-json-native.py src/opnsense/scripts/OPNsense/Zapret/backend/status_projection.py src/opnsense/scripts/OPNsense/Zapret/backend/status_readonly.py
          python3.13 scripts/test-tz6v5-s05a-status-json-source.py
          python3.13 scripts/tz6v5-s05a-status-json-native.py --self-test
      - name: Native installed Status on disposable OPNsense cold guest
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            export GITHUB_ACTIONS=true
            export ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1
            export ZAPRET2_NATIVE_BUILD_CI=1
            export ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1
            export ZAPRET2_S04C_DISPOSABLE_NATIVE=1
            export ZAPRET2_S05A_DISPOSABLE_NATIVE=1
            export ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export ZAPRET2_STAGE0_PROJECT_SHA="$ZAPRET2_NATIVE_PROJECT_SHA"
            export PYTHONDONTWRITEBYTECODE=1
            /usr/local/bin/python3 scripts/tz6v5-s05a-status-json-native.py cold

  hot:
    name: S05a native JSON Status RUNNING/invalid Config/foreign IPFW with no-write
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: S05a exact source status syntax and pure model RED/GREEN
        run: |
          python3.13 -m py_compile scripts/tz6v5-s05a-status-json-native.py src/opnsense/scripts/OPNsense/Zapret/backend/status_projection.py src/opnsense/scripts/OPNsense/Zapret/backend/status_readonly.py
          python3.13 scripts/test-tz6v5-s05a-status-json-source.py
          python3.13 scripts/tz6v5-s05a-status-json-native.py --self-test
      - name: Native Common original owner Status on disposable OPNsense hot guest
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            export GITHUB_ACTIONS=true
            export ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1
            export ZAPRET2_NATIVE_BUILD_CI=1
            export ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1
            export ZAPRET2_S04C_DISPOSABLE_NATIVE=1
            export ZAPRET2_S05A_DISPOSABLE_NATIVE=1
            export ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export ZAPRET2_STAGE0_PROJECT_SHA="$ZAPRET2_NATIVE_PROJECT_SHA"
            export PYTHONDONTWRITEBYTECODE=1
            /usr/local/bin/python3 scripts/tz6v5-s05a-status-json-native.py hot
