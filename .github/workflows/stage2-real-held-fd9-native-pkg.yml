name: Stage 2 actual old FD9 held across authentic native pkg
on:
  pull_request:
    paths:
      - Makefile
      - scripts/native-opnsense-package.py
      - scripts/stage2-opnsense-real-held-fd9-pkg.py
      - scripts/test-stage2-opnsense-real-held-fd9-pkg.py
      - scripts/stage2-opnsense-real-firmware-unlock-bypass.py
      - scripts/stage2-opnsense-real-locked-unsafe-owner.py
      - scripts/stage2-opnsense-real-unsafe-owner-replacement.py
      - scripts/stage2-opnsense-real-native-stopped-upgrade.py
      - scripts/stage2-opnsense-real-native-clean-install.py
      - .github/workflows/stage2-real-held-fd9-native-pkg.yml
  workflow_dispatch:
    inputs:
      fast_only:
        description: Validate fast contracts without a disposable native VM
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  real-held-fd9:
    name: Real installed predecessor + external inherited FD9 across native pkg
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fail-closed source test and native revision preflight
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage2-opnsense-real-held-fd9-pkg.py scripts/test-stage2-opnsense-real-held-fd9-pkg.py
          python3.13 scripts/test-stage2-opnsense-real-held-fd9-pkg.py -v
          python3.13 scripts/test-native-opnsense-package.py -v
      - name: Real old FD9 held by privileged shell while invoking native pkg on disposable OPNsense 26.7
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.fast_only != true) }}
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit lua54
            /usr/local/bin/pkgconf --exists lua-5.4
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE2_REAL_HELD_FD9_PKG=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage2-opnsense-real-held-fd9-pkg.py /tmp/os-zapret2-restyle-0.6.2_1.pkg
