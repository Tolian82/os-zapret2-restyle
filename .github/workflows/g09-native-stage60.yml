name: G09 native real Stage50 Stage60 negative control
on:
  pull_request:
    branches: [main]
    paths:
      # A real Stage-50 WAN adapter change must requalify its native job,
      # not only source policy. Do not trigger this VM for workflow-YAML edits.
      - scripts/stage2-opnsense-g09-stage60.py
      - src/opnsense/scripts/OPNsense/Zapret/strategy_lab/runtime.sh
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fast-g09:
    name: G09 source negative-control guard
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          set -eu
          python3.13 -m py_compile scripts/stage2-opnsense-g09-stage60.py
          python3.13 scripts/stage2-opnsense-g09-stage60.py --self-test
  native-g09:
    needs: fast-g09
    name: One OPNsense 26.7 genuine Standard Stage50 Stage60 and Stage90
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Real installed Job on unreachable TEST-NET control
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            export GITHUB_ACTIONS=true
            export ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1
            export ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1
            export ZAPRET2_NATIVE_BUILD_CI=1
            export ZAPRET2_G05_DISPOSABLE_NATIVE=1
            export ZAPRET2_G03_DISPOSABLE_NATIVE=1
            export ZAPRET2_G09_NATIVE_STAGE60=1
            export ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            # Bounded negative control only; no production default changes.
            export STRATEGY_LAB_SINGLE_CANDIDATE_TIMEOUT=1
            export STRATEGY_LAB_EXPANSION_CANDIDATE_TIMEOUT=1
            export STRATEGY_LAB_CANDIDATE_TERMINATION_RESERVE=1
            export STRATEGY_LAB_CANDIDATE_CLEANUP_RESERVE=2
            export STRATEGY_LAB_STAGE60_TIMEOUT=110
            export STRATEGY_LAB_STANDARD_BUDGET=240
            /usr/local/bin/python3 scripts/stage2-opnsense-g09-stage60.py run
