name: G03 real native GUI-selected fresh upstream setup

on:
  pull_request:
    paths:
      - src/opnsense/scripts/OPNsense/Zapret/setup_transaction.sh
      - src/opnsense/scripts/OPNsense/Zapret/setup.sh
      - src/opnsense/mvc/app/views/OPNsense/Zapret/general.volt
      - scripts/test-g03-first-install.sh
      - scripts/test-gui-upstream-progress.mjs
      - scripts/stage2-opnsense-g03-first-install.py
      - scripts/stage2-opnsense-g03-five-editor-f5.py
      - scripts/stage2-opnsense-g03-native-prepared.py
      - scripts/stage2-opnsense-g03-native-prepared.php
  workflow_dispatch:
    inputs:
      s10_first_commit:
        description: "S10: first protected commit and linked-list successor (disposable guest)"
        type: boolean
        default: false
        required: false
      s10_bound_found:
        description: "S10: genuine bound Found PREPARED dual-root CAS/fence/recovery (requires first commit)"
        type: boolean
        default: false
        required: false
      s10_managed_pre_save:
        description: "S10: real interrupted managed HOSTLIST before Config save, recover original previous owner"
        type: boolean
        default: false
        required: false
      s10_managed_uncertain:
        description: "S10: real managed post-Config-save uncertainty and original FD9 recovery (requires first commit)"
        type: boolean
        default: false
        required: false
      s10_inode_probe:
        description: "S10: isolated native inode/ctime experiment only (no package or Apply)"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # G03's frontend shares general.volt with Strategies help. A change only
  # to bilingual help text must not spawn a 75-minute guest. The source
  # classifier fails closed for actual setup or unknown frontend changes.
  scope-g03:
    name: Classify native G03 setup scope without booting a VM
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      native_required: ${{ steps.classify.outputs.native_required }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prove help-only is safe to skip, setup changes require native
        id: classify
        env:
          G03_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          G03_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/g03_native_scope.py
          python3 scripts/g03_native_scope.py --self-test
          python3 scripts/g03_native_scope.py --classify

  fast-g03:
    name: Fast G03 exact-source preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run setup/frontend/old-rollback regressions
        run: |
          set -eu
          # Git mode is an installed runtime contract: "sh -n" alone missed
          # the original 100755 -> 100644 regression before native configd.
          test -x src/opnsense/scripts/OPNsense/Zapret/setup_transaction.sh
          test -x scripts/test-setup-runtime-transaction.sh
          sh -n src/opnsense/scripts/OPNsense/Zapret/setup_transaction.sh
          sh -n src/opnsense/scripts/OPNsense/Zapret/setup.sh
          sh -n scripts/test-g03-first-install.sh
          python3.13 -m py_compile scripts/stage2-opnsense-g03-first-install.py
          python3.13 -m py_compile scripts/stage2-opnsense-g03-native-prepared.py
          python3.13 scripts/stage2-opnsense-g03-native-prepared.py fault-worker-self-test
          php -l scripts/stage2-opnsense-g03-native-prepared.php
          python3.13 -c 'import re,pathlib; p=pathlib.Path("scripts/stage2-opnsense-g03-native-prepared.php"); chunks=re.findall(r"<<<\x27PY\x27\n(.*?)\nPY;",p.read_text(),re.S); assert len(chunks)==3; [compile(c,str(p),"exec") for c in chunks]'
          python3.13 -m pip install idna
          python3.13 scripts/test-shared-apply-operation.py TestJournal.test_bound_successor_prepare_is_detached_only
          pre_save="${{ github.event_name == 'workflow_dispatch' && inputs.s10_managed_pre_save && '1' || '0' }}"
          post_save="${{ github.event_name == 'workflow_dispatch' && inputs.s10_managed_uncertain && '1' || '0' }}"
          bound_found="${{ github.event_name == 'workflow_dispatch' && inputs.s10_bound_found && '1' || '0' }}"
          if [ "$((pre_save + post_save + bound_found))" -gt 0 ]; then
            test "$((pre_save + post_save + bound_found))" -eq 1
            test "${{ github.event_name == 'workflow_dispatch' && inputs.s10_first_commit && '1' || '0' }}" = 1
            test "${{ github.event_name == 'workflow_dispatch' && inputs.s10_inode_probe && '1' || '0' }}" = 0
          fi
          python3.13 -m py_compile src/opnsense/scripts/OPNsense/Zapret/backend/neutral_schema3_quiescent_preimage.py
          sh -n src/opnsense/scripts/OPNsense/Zapret/backend/apply_runtime.sh
          sh -n src/opnsense/scripts/OPNsense/Zapret/zapret_service.sh
          php -l src/opnsense/scripts/OPNsense/Zapret/shared_apply_config.php
          python3.13 scripts/test-s10-first-enabled-trace.py
          python3.13 scripts/stage2-opnsense-s10-inode-probe.py --portable
          python3.13 scripts/test-voice-release-stage.py VoiceReleaseStageTests.test_common_hostlist_delta_preserves_full_release_seal VoiceReleaseStageTests.test_source_xml_changes_mid_stage_are_detected
          php scripts/test-g04-initial-config.php
          python3.13 scripts/test-stage2-opnsense-real-native-clean-install.py RealInstallContracts.test_lc05_exact_native_first_config_is_only_new_subtree
          node scripts/test-gui-upstream-progress.mjs
          sh scripts/test-g03-first-install.sh
          sh scripts/test-setup-runtime-transaction.sh
  native-g03:
    needs: [fast-g03, scope-g03]
    if: needs.scope-g03.outputs.native_required == 'true'
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.s10_inode_probe && 'S10 isolated native inode probe (not G03 acceptance)' || 'Real OPNsense clean first upstream install and reinstall' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reuse existing native G03 guest for authenticated Chromium F5
        if: github.event_name != 'workflow_dispatch' || (!inputs.s10_first_commit && !inputs.s10_inode_probe)
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage2-opnsense-g03-five-editor-f5.py
          python3.13 -m pip install --disable-pip-version-check playwright
          chromium_bin="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          test -n "$chromium_bin" && test -x "$chromium_bin"
          printf 'STAGE5_LOCAL_CHROMIUM=%s\n' "$chromium_bin" >> "$GITHUB_ENV"
          install -d -m 0700 "$RUNNER_TEMP/g03-readonly-browser-ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/g03-readonly-browser-ssh/key"
          cp "$RUNNER_TEMP/g03-readonly-browser-ssh/key.pub" g03-five-f5-ci.pub
      - name: Disposable OPNsense 26.7 real pkg install and first GUI-selected configd setup
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          nat: |
            "32222": "22"
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            if [ "${{ github.event_name == 'workflow_dispatch' && inputs.s10_inode_probe && '1' || '0' }}" = 1 ]; then
              if [ "${{ github.event_name == 'workflow_dispatch' && inputs.s10_first_commit && '1' || '0' }}" = 1 ]; then
                echo G03_INODE_PROBE_MUST_BE_EXCLUSIVE >&2
                exit 69
              fi
              GITHUB_ACTIONS=true ZAPRET2_G03_DISPOSABLE_NATIVE=1 /usr/local/bin/python3 scripts/stage2-opnsense-s10-inode-probe.py
              exit 0
            fi
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage2-opnsense-real-native-clean-install.py
            # The disposable G03 guest must not treat a blocked GitHub
            # Releases API as a failed genuine original make. Reuse the
            # existing Stage5 pinned-upstream-tag fixture (NOT an API-success
            # claim): Git verifies the real remote tag ref before writing the
            # standard cache consumed by unchanged setup.sh. Clone/make,
            # exact HEAD/tag and compiled ELF checks remain entirely real.
            upstream_tag=$(/usr/local/bin/git ls-remote --refs \
              https://github.com/bol-van/zapret2.git refs/tags/v1.0.7)
            expected_tag=$(printf '038c97e5819df10f8e8c22a2f1fffe57f2f7379b\trefs/tags/v1.0.7')
            [ "$upstream_tag" = "$expected_tag" ] || {
              echo G03_PINNED_UPSTREAM_TAG_REFUSED >&2
              exit 69
            }
            cache=/var/db/zapret2-restyle/releases.cache
            [ ! -e "$cache" ] && [ ! -L "$cache" ] || {
              echo G03_UNEXPECTED_RELEASE_CACHE >&2
              exit 69
            }
            /bin/mkdir -p /var/db/zapret2-restyle
            ( umask 077; printf 'v1.0.7\n' > "$cache" )
            /bin/chmod 0644 "$cache"
            echo G03_RELEASE_DISCOVERY=DISPOSABLE_PINNED_TAG_CACHE_NOT_API_SUCCESS
            # Test-only files outside installed pkg, BEFORE first ordinary Apply.
            install -m 0700 scripts/stage2-opnsense-g03-native-prepared.py /root/g03-native-prepared.py
            install -m 0600 scripts/stage2-opnsense-g03-native-prepared.php /root/g03-native-prepared.php
            GITHUB_ACTIONS=true ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_G03_DISPOSABLE_NATIVE=1 ZAPRET2_G03_PRISTINE_COLD=1 ZAPRET2_G03_PRISTINE_FIRST_COMMIT="${{ github.event_name == 'workflow_dispatch' && inputs.s10_first_commit && '1' || '0' }}" ZAPRET2_G03_MANAGED_UNCERTAIN="${{ github.event_name == 'workflow_dispatch' && inputs.s10_managed_uncertain && '1' || '0' }}" ZAPRET2_G03_MANAGED_PRE_SAVE="${{ github.event_name == 'workflow_dispatch' && inputs.s10_managed_pre_save && '1' || '0' }}" ZAPRET2_G03_BOUND_FOUND="${{ github.event_name == 'workflow_dispatch' && inputs.s10_bound_found && '1' || '0' }}" /usr/local/bin/python3 scripts/stage2-opnsense-g03-first-install.py
            # The explicit two-bound-commit journey ends on this same disposable guest.
            if [ "${{ github.event_name == 'workflow_dispatch' && inputs.s10_first_commit && '1' || '0' }}" = 1 ]; then
              exit 0
            fi
            # Guest is disposable; host Chromium gets READ-ONLY browser access
            # through a one-run SSH key. No plugin persistence or new service.
            test -s g03-five-f5-ci.pub
            install -d -m 0700 /root/.ssh
            grep -Eq '^ssh-ed25519 [A-Za-z0-9+/=]+' g03-five-f5-ci.pub
            cat g03-five-f5-ci.pub >> /root/.ssh/authorized_keys
            chmod 0600 /root/.ssh/authorized_keys
      - name: Authenticated installed Chromium F5 of all FIVE saved HOSTLIST editors
        if: github.event_name != 'workflow_dispatch' || (!inputs.s10_first_commit && !inputs.s10_inode_probe)
        env:
          ZAPRET2_G03_FIVE_F5: '1'
        run: |
          set -eu
          test -s "$RUNNER_TEMP/g03-readonly-browser-ssh/key"
          # The disposable QEMU guest can be CPU-bound just after a real
          # engine restart. A TCP listener alone does not prove sshd's banner
          # and public-key authentication are ready. Require a full SSH
          # handshake with a bounded retry, no bypass of host-key checks.
          ssh_ready=0
          for attempt in 1 2 3 4; do
            if timeout 30 ssh -T -i "$RUNNER_TEMP/g03-readonly-browser-ssh/key" -p 32222 \
              -o BatchMode=yes -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$RUNNER_TEMP/g03-readonly-browser-ssh/known_hosts" \
              root@127.0.0.1 'printf G03_SSH_HANDSHAKE_OK' |
              grep -qx G03_SSH_HANDSHAKE_OK; then
              ssh_ready=1
              break
            fi
            sleep 2
          done
          test "$ssh_ready" -eq 1
          ssh -fN -i "$RUNNER_TEMP/g03-readonly-browser-ssh/key" -p 32222 \
            -o BatchMode=yes -o ExitOnForwardFailure=yes -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/g03-readonly-browser-ssh/known_hosts" \
            -L 127.0.0.1:18443:127.0.0.1:443 root@127.0.0.1
          curl -kfsS --max-time 20 -o /dev/null https://127.0.0.1:18443/index.php
          python3.13 scripts/stage2-opnsense-g03-five-editor-f5.py
      - name: Original Config FD4 and FD9/P2 no-write PREPARED recovery on same G03 guest
        if: github.event_name != 'workflow_dispatch' || (!inputs.s10_first_commit && !inputs.s10_inode_probe)
        run: |
          set -eu
          test -s "$RUNNER_TEMP/g03-readonly-browser-ssh/key"
          ssh -i "$RUNNER_TEMP/g03-readonly-browser-ssh/key" -p 32222 \
            -o BatchMode=yes -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/g03-readonly-browser-ssh/known_hosts" \
            root@127.0.0.1 \
            'env GITHUB_ACTIONS=true ZAPRET2_G03_COLD_PREPARED=1 /usr/local/bin/python3 /root/g03-native-prepared.py && env GITHUB_ACTIONS=true ZAPRET2_G03_COLD_PREPARED=1 /usr/local/bin/python3 /root/g03-native-prepared.py stopped'
