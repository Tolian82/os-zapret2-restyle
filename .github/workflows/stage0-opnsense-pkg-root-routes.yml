name: Stage 0 OPNsense native pkg force and foreign process owner refusal

on:
  pull_request:
    paths:
      - scripts/stage0-opnsense-pkg-root-routes.py
      - scripts/test-stage0-opnsense-pkg-root-routes.py
      - scripts/stage0-opnsense-firmware-admission.py
      - scripts/test-stage0-opnsense-firmware-admission.py
      - .github/workflows/stage0-opnsense-pkg-root-routes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-pkg-root-and-owner-negative:
    name: Real original read-only Status, native force pkg and test-owned lookalike process
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile exact source and run two sets of 12 offline negative contracts
        run: |
          python3.13 -m py_compile scripts/stage0-opnsense-pkg-root-routes.py scripts/test-stage0-opnsense-pkg-root-routes.py scripts/stage0-opnsense-firmware-admission.py scripts/test-stage0-opnsense-firmware-admission.py
          python3.13 scripts/test-stage0-opnsense-pkg-root-routes.py -v
          python3.13 scripts/test-stage0-opnsense-firmware-admission.py -v
      - name: Native disposable OPNsense 26.7 authentic old and private forced pkg cases
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          mem: 4096
          cpu: 2
          disable-cache: true
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            /usr/local/bin/python3 scripts/stage0-opnsense-firmware-admission.py
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            /usr/local/bin/python3 scripts/stage0-opnsense-pkg-root-routes.py /tmp/os-zapret2-restyle-0.6.2_1.pkg
