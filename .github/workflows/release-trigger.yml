name: Release trigger

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write

concurrency:
  group: release-trigger-${{ github.sha }}
  cancel-in-progress: false

jobs:
  trigger:
    name: Classify version transition / release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify current candidate
        id: release
        shell: bash
        run: |
          set -euo pipefail

          VERSION_VALUE=$(tr -d '[:space:]' < VERSION)
          REVISION=$(sed -n 's/^PLUGIN_REVISION=[[:space:]]*//p' Makefile | head -1)
          SUBJECT=$(git log -1 --pretty=%s)
          ESCAPED_VERSION=${VERSION_VALUE//./\\.}

          [[ "${VERSION_VALUE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${REVISION}" =~ ^[0-9]+$ ]]
          grep -Eq '^PLUGIN_NAME=[[:space:]]+zapret2-restyle$' Makefile
          grep -Eq '^PLUGIN_VERSION!=[[:space:]]+/bin/cat \$\{\.CURDIR\}/VERSION$' Makefile

          IFS='.' read -r MAJOR SECOND THIRD <<< "${VERSION_VALUE}"

          PREVIOUS_VERSION=$(git show "${GITHUB_SHA}^:VERSION" 2>/dev/null | tr -d '[:space:]' || true)
          if [[ -z "${PREVIOUS_VERSION}" ]]; then
            PREVIOUS_VERSION="${VERSION_VALUE}"
          fi
          [[ "${PREVIOUS_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IFS='.' read -r PREVIOUS_MAJOR PREVIOUS_SECOND PREVIOUS_THIRD <<< "${PREVIOUS_VERSION}"

          RELEASE_PATTERN="^v${ESCAPED_VERSION}_${REVISION}: Prepare release v${ESCAPED_VERSION}( \(#[0-9]+\))?$"
          PUBLISH=false
          if [[ "${SUBJECT}" =~ ${RELEASE_PATTERN} ]]; then
            PUBLISH=true
          fi

          if [[ "${VERSION_VALUE}" != "${PREVIOUS_VERSION}" ]]; then
            if [[ "${MAJOR}" != "${PREVIOUS_MAJOR}" || "${SECOND}" != "${PREVIOUS_SECOND}" ]]; then
              [[ "${REVISION}" == "1" ]] || {
                echo "A first/second-component transition must begin at package revision _1." >&2
                exit 1
              }
              [[ "${PUBLISH}" == "true" ]] || {
                echo "A first/second-component transition requires an explicit full-release preparation merge." >&2
                exit 1
              }
            elif [[ "${THIRD}" != "${PREVIOUS_THIRD}" ]]; then
              [[ "${REVISION}" == "1" ]] || {
                echo "A third-component development-stage transition must begin at package revision _1." >&2
                exit 1
              }
            else
              echo "VERSION changed without a recognized numeric-component transition." >&2
              exit 1
            fi
          fi

          echo "publish=${PUBLISH}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION_VALUE}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION_VALUE}" >> "${GITHUB_OUTPUT}"
          echo "previous_version=${PREVIOUS_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"

          if [[ "${PUBLISH}" == "true" ]]; then
            echo "Full release requested for exact candidate v${VERSION_VALUE}_${REVISION}."
          elif [[ "${VERSION_VALUE}" != "${PREVIOUS_VERSION}" ]]; then
            echo "Development-stage VERSION transition accepted without full release: ${PREVIOUS_VERSION} -> ${VERSION_VALUE}."
          else
            echo "Ordinary main change; no full release requested."
          fi

      - name: Create immutable semantic tag
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            TAG_COMMIT=$(git rev-list -n 1 "refs/tags/${TAG}")
            [ "${TAG_COMMIT}" = "${GITHUB_SHA}" ] || {
              echo "Tag ${TAG} already points to ${TAG_COMMIT}, expected ${GITHUB_SHA}" >&2
              exit 1
            }
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "os-zapret2-restyle ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Dispatch full release workflow
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} is already published."
            exit 0
          fi

          if gh run list \
            --workflow release.yml \
            --branch "${TAG}" \
            --json status \
            --limit 20 \
            --jq 'any(.[]; .status == "queued" or .status == "in_progress")' \
            | grep -qx true
          then
            echo "Release workflow for ${TAG} is already active."
            exit 0
          fi

          gh workflow run release.yml --ref "${TAG}"
