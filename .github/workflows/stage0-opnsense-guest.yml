name: Stage 0 isolated OPNsense 26.7 guest identity

on:
  pull_request:
    paths:
      - scripts/stage0-opnsense-guest-readonly.py
      - scripts/test-stage0-opnsense-guest-readonly.py
      - .github/workflows/stage0-opnsense-guest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-opnsense-guest:
    name: Fresh OPNsense 26.7 amd64 actual guest (identity only)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Local executable syntax and refusal-contract preflight
        run: |
          python3.13 -m py_compile scripts/stage0-opnsense-guest-readonly.py scripts/test-stage0-opnsense-guest-readonly.py
          python3.13 scripts/test-stage0-opnsense-guest-readonly.py -v
      - name: Boot separate OPNsense 26.7 virtual appliance and check actual identity
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          mem: 4096
          cpu: 2
          disable-cache: true
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
