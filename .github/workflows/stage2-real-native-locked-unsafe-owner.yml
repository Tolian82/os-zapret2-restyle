name: Stage 2 genuine locked predecessor versus unsafe native pkg
on:
  pull_request:
    paths:
      # Provider/archive-only builder changes use the central native package gate.
      - scripts/stage2-opnsense-real-native-clean-install.py
      - scripts/stage2-opnsense-real-native-stopped-upgrade.py
      - scripts/stage2-opnsense-real-unsafe-owner-replacement.py
      - scripts/stage2-opnsense-real-locked-unsafe-owner.py
      - scripts/test-stage2-opnsense-real-locked-unsafe-owner.py
  workflow_dispatch:
    inputs:
      fast_only:
        description: Fast source contracts only
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  real-locked-old:
    name: Real installed locked old package and orphaned IPFW versus pkg add -f
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fast fail-closed contracts
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage2-opnsense-real-locked-unsafe-owner.py scripts/test-stage2-opnsense-real-locked-unsafe-owner.py
          python3.13 scripts/test-stage2-opnsense-real-locked-unsafe-owner.py -v
          python3.13 scripts/test-native-opnsense-package.py -v
      - name: Real native locked published package versus successor on disposable OPNsense 26.7
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.fast_only != true) }}
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit lua54
            /usr/local/bin/pkgconf --exists lua-5.4
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE2_REAL_LOCKED_UNSAFE_OWNER_PKG=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage2-opnsense-real-locked-unsafe-owner.py /tmp/os-zapret2-restyle-0.6.2_1.pkg
