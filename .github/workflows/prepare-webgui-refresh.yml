name: Prepare WebGUI lifecycle correction

on:
  push:
    branches:
      - agent/fix-postinstall-webgui-refresh

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'chore: prepare WebGUI lifecycle correction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-postinstall-webgui-refresh

      - name: Apply focused lifecycle correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          def append_once(path: str, marker: str, addition: str) -> None:
              file = Path(path)
              text = file.read_text()
              if marker in text:
                  raise SystemExit(f"{path}: marker already exists: {marker}")
              if not text.endswith("\n"):
                  text += "\n"
              file.write_text(text + addition)

          replace_once(
              "Makefile",
              "PLUGIN_REVISION=    3\n",
              "PLUGIN_REVISION=    4\n",
          )

          Path("pkg/+POST_INSTALL").write_text(r'''#!/bin/sh

# Register the plugin and render its initial template. Runtime preparation is
# intentionally separate from the pkg transaction. During an upgrade, restore
# a service that the replacement pre-install hook stopped successfully. Refresh
# the Web GUI last so replacement MVC, menu, ACL, and view files are loaded by
# new lighttpd/PHP workers.

SERVICE_SCRIPT="/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh"
CONFIGCTL="/usr/local/sbin/configctl"
FIRMWARE_REGISTER="/usr/local/opnsense/scripts/firmware/register.php"
CONFIGURE_PLUGINS="/usr/local/etc/rc.configure_plugins"
UPGRADE_RESTART_MARKER="/var/run/zapret2-restyle/pkg-upgrade.restart"

[ -x "${FIRMWARE_REGISTER}" ] || {
    echo "ERROR: OPNsense plugin registration helper is unavailable" >&2
    exit 1
}

if ! "${FIRMWARE_REGISTER}" install os-zapret2-restyle; then
    echo "ERROR: os-zapret2-restyle could not be registered in OPNsense firmware state" >&2
    exit 1
fi

[ -x "${CONFIGURE_PLUGINS}" ] || {
    echo "ERROR: OPNsense plugin configuration helper is unavailable" >&2
    exit 1
}

if ! "${CONFIGURE_PLUGINS}" POST_INSTALL; then
    echo "ERROR: OPNsense POST_INSTALL plugin configuration failed" >&2
    exit 1
fi

if [ -x "${CONFIGCTL}" ]; then
    "${CONFIGCTL}" template reload OPNsense/Zapret >/dev/null 2>&1 || true
fi

if [ -n "${PKG_UPGRADE:-}" ] && [ -f "${UPGRADE_RESTART_MARKER}" ]; then
    [ -x "${CONFIGCTL}" ] && [ -x "${SERVICE_SCRIPT}" ] || {
        echo "ERROR: zapret service control is unavailable after package upgrade" >&2
        exit 1
    }

    service_output=$("${CONFIGCTL}" zapret start 2>&1)
    service_result=$?
    if [ "${service_result}" -ne 0 ] || [ "${service_output}" != "OK" ]; then
        printf '%s\n' "${service_output}" >&2
        echo "ERROR: zapret service could not be started after package upgrade" >&2
        exit 1
    fi

    if ! "${SERVICE_SCRIPT}" status >/dev/null 2>&1; then
        echo "ERROR: zapret service did not reach running state after package upgrade" >&2
        exit 1
    fi

    rm -f "${UPGRADE_RESTART_MARKER}"
fi

[ -x "${CONFIGCTL}" ] || {
    echo "ERROR: OPNsense Web GUI control is unavailable after plugin installation" >&2
    exit 1
}

webgui_output=$("${CONFIGCTL}" webgui restart 2 2>&1)
webgui_result=$?
if [ "${webgui_result}" -ne 0 ] || [ "${webgui_output}" != "OK" ]; then
    printf '%s\n' "${webgui_output}" >&2
    echo "ERROR: OPNsense Web GUI could not be refreshed after plugin installation" >&2
    exit 1
fi

cat <<'MESSAGE'

os-zapret2-restyle was installed.

To install the zapret2 runtime, run:

/usr/local/opnsense/scripts/OPNsense/Zapret/setup.sh install

MESSAGE

exit 0
''')

          test_anchor = '''if grep -Eq 'CONFIGURE_PLUGINS.*\\|\\|[[:space:]]*true' "${POST_HOOK}"; then
              fail "post-install suppresses OPNsense POST_INSTALL failure"
          fi

          state_line='''
          test_insert = '''if grep -Eq 'CONFIGURE_PLUGINS.*\\|\\|[[:space:]]*true' "${POST_HOOK}"; then
              fail "post-install suppresses OPNsense POST_INSTALL failure"
          fi

          grep -q '\"${CONFIGCTL}\" webgui restart 2' "${POST_HOOK}" ||
              fail "post-install does not refresh the Web GUI through the canonical configd action"
          grep -q '\[ \"${webgui_output}\" != \"OK\" \]' "${POST_HOOK}" ||
              fail "post-install does not enforce the exact Web GUI configd success response"
          if grep -q 'webgui\\.lighttpd_reload' "${POST_HOOK}"; then
              fail "post-install uses the obsolete webgui.lighttpd_reload plugin hook"
          fi
          if grep -Eq 'webgui restart.*\\|\\|[[:space:]]*true' "${POST_HOOK}"; then
              fail "post-install suppresses Web GUI refresh failure"
          fi

          register_line=$(grep -n 'install os-zapret2-restyle' "${POST_HOOK}" | cut -d: -f1)
          configure_line=$(grep -n '\"${CONFIGURE_PLUGINS}\" POST_INSTALL' "${POST_HOOK}" | cut -d: -f1)
          zapret_start_line=$(grep -n '\"${CONFIGCTL}\" zapret start' "${POST_HOOK}" | cut -d: -f1)
          webgui_restart_line=$(grep -n '\"${CONFIGCTL}\" webgui restart 2' "${POST_HOOK}" | cut -d: -f1)
          message_line=$(grep -n "cat <<'MESSAGE'" "${POST_HOOK}" | cut -d: -f1)

          [ "${register_line}" -lt "${webgui_restart_line}" ] ||
              fail "Web GUI refresh runs before plugin registration"
          [ "${configure_line}" -lt "${webgui_restart_line}" ] ||
              fail "Web GUI refresh runs before OPNsense POST_INSTALL configuration"
          [ "${zapret_start_line}" -lt "${webgui_restart_line}" ] ||
              fail "Web GUI refresh runs before replacement zapret service restoration"
          [ "${webgui_restart_line}" -lt "${message_line}" ] ||
              fail "Web GUI refresh is not the final package integration action"

          state_line='''
          replace_once(
              "scripts/test-package-lifecycle-restart.sh",
              test_anchor,
              test_insert,
          )

          replace_once(
              "README.md",
              "Version 0.2.8 is the current prerelease line; this source tree builds package revision 3.",
              "Version 0.2.8 is the current prerelease line; this source tree builds package revision 4.",
          )
          replace_once(
              "README.md",
              """Package upgrades preserve the prior service state. The replacement package stops a
running service before the old package hook and plugin-file replacement, then starts it
again with replacement code. A stopped service remains stopped, and an upgrade is
aborted if the installed service cannot stop cleanly.
""",
              """Package upgrades preserve the prior service state. The replacement package stops a
running service before the old package hook and plugin-file replacement, then starts it
again with replacement code. A stopped service remains stopped, and an upgrade is
aborted if the installed service cannot stop cleanly. After plugin registration,
template rendering, and any required service restoration complete, `+POST_INSTALL`
refreshes the OPNsense Web GUI through the current `configctl webgui restart` action so
new lighttpd/PHP workers load the installed MVC, menu, ACL, and view files.
""",
          )

          replace_once("docs/PROJECT_STATE.md", "Current package revision:\n3\n", "Current package revision:\n4\n")
          replace_once(
