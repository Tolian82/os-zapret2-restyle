name: TZ6v5 S04c genuine five-state OPNsense component inventory

on:
  pull_request:
    paths:
      - src/opnsense/scripts/OPNsense/Zapret/backend/component_inventory_opnsense.py
      - scripts/tz6v5-s04c-opnsense-native-inventory.py
      - .github/workflows/tz6v5-s04c-native-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s04c-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cold:
    name: S04c three real cold component states
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Source syntax and non-authorizing inventory contract
        run: |
          python3.13 -m py_compile scripts/tz6v5-s04c-opnsense-native-inventory.py src/opnsense/scripts/OPNsense/Zapret/backend/component_inventory_opnsense.py
          python3.13 scripts/tz6v5-s04c-opnsense-native-inventory.py --self-test
          python3.13 scripts/test-tz6v5-s04b-opnsense-readonly-adapter.py
      - name: Native package, clean, installed and engine-only real read-only inventory
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            export GITHUB_ACTIONS=true
            export ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1
            export ZAPRET2_NATIVE_BUILD_CI=1
            export ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1
            export ZAPRET2_S04C_DISPOSABLE_NATIVE=1
            export ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export ZAPRET2_STAGE0_PROJECT_SHA="$ZAPRET2_NATIVE_PROJECT_SHA"
            export PYTHONDONTWRITEBYTECODE=1
            /usr/local/bin/python3 scripts/tz6v5-s04c-opnsense-native-inventory.py cold

  hot:
    name: S04c real RUNNING damaged Config and foreign IPFW
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Source syntax and non-authorizing inventory contract
        run: |
          python3.13 -m py_compile scripts/tz6v5-s04c-opnsense-native-inventory.py src/opnsense/scripts/OPNsense/Zapret/backend/component_inventory_opnsense.py
          python3.13 scripts/tz6v5-s04c-opnsense-native-inventory.py --self-test
          python3.13 scripts/test-tz6v5-s04b-opnsense-readonly-adapter.py
      - name: Genuine Common owner, invalid persisted Config and nonblocking foreign rule
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            export GITHUB_ACTIONS=true
            export ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1
            export ZAPRET2_NATIVE_BUILD_CI=1
            export ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1
            export ZAPRET2_S04C_DISPOSABLE_NATIVE=1
            export ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export ZAPRET2_STAGE0_PROJECT_SHA="$ZAPRET2_NATIVE_PROJECT_SHA"
            export PYTHONDONTWRITEBYTECODE=1
            /usr/local/bin/python3 scripts/tz6v5-s04c-opnsense-native-inventory.py hot
