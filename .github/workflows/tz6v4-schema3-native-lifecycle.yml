name: TZ6v4 schema3 real disposable OPNsense native lifecycle canary

on:
  pull_request:
    paths:
      - scripts/stage2-opnsense-schema3-native-lifecycle.py
      - .github/workflows/tz6v4-schema3-native-lifecycle.yml
      - src/opnsense/scripts/OPNsense/Zapret/zapret_service.sh
      - src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_origin_map.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_post_drop.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_minute.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_learning_retirement.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_epoch_receipts.py
      - src/opnsense/scripts/OPNsense/Zapret/backend/auto_detect_learning_gc.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tz6v4-schema3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Fail-closed canary syntax, source and non-FreeBSD refusal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: |
          set -eu
          python3.13 -m py_compile scripts/stage2-opnsense-schema3-native-lifecycle.py
          python3.13 scripts/stage2-opnsense-schema3-native-lifecycle.py --self-test
          sh -n src/opnsense/scripts/OPNsense/Zapret/zapret_service.sh
          if GITHUB_ACTIONS=true ZAPRET2_NATIVE_BUILD_CI=1 \
              ZAPRET2_STAGE2_SCHEMA3_DISPOSABLE_NATIVE=1 \
              ZAPRET2_TZ6V4_SCHEMA3_NATIVE_TRIAL=1 \
              python3.13 scripts/stage2-opnsense-schema3-native-lifecycle.py --native \
              >/tmp/tz6v4-native-refusal.log 2>&1; then
            echo '::error::schema3 native test accepted on Linux'
            exit 1
          fi
          grep -F NOT_DISPOSABLE_OPNSENSE_SCHEMA3_NATIVE_TRIAL /tmp/tz6v4-native-refusal.log

  native:
    needs: source
    name: Genuine installed pkg / one dvtws2 / FD9 schema3 Apply Stop Boot Restart
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Qualified one-use OPNsense 26.7 filesystem and real engine
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: '26.7'
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            export GITHUB_ACTIONS=true
            export ZAPRET2_NATIVE_BUILD_CI=1
            export ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1
            export ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1
            export ZAPRET2_G04_DISPOSABLE_NATIVE=1
            export ZAPRET2_G04_RUNTIME_NATIVE=1
            export ZAPRET2_TZ6V4_SCHEMA3_NATIVE_TRIAL=1
            export ZAPRET2_STAGE2_SCHEMA3_DISPOSABLE_NATIVE=1
            export ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            /usr/local/bin/python3 scripts/stage2-opnsense-schema3-native-lifecycle.py --native
