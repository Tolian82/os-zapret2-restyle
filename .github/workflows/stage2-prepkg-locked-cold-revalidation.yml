name: Stage 2 genuine pre-pkg locked cold revalidation without nested Status
on:
  pull_request:
    paths:
      - Makefile
      - scripts/stage2-prepkg-locked-cold-revalidation.py
      - scripts/test-stage2-prepkg-locked-cold-revalidation.py
      - scripts/stage0-opnsense-prepkg-readonly.py
      - scripts/stage0-installed-predecessor-readonly.py
      - .github/workflows/stage2-prepkg-locked-cold-revalidation.yml
  workflow_dispatch:
    inputs:
      fast_only:
        description: Offline tests only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  locked-cold:
    name: Original FD9 locked cold owner read-only and busy/unknown negatives
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Offline fail-closed contracts and syntax
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage2-prepkg-locked-cold-revalidation.py scripts/test-stage2-prepkg-locked-cold-revalidation.py
          python3.13 scripts/test-stage2-prepkg-locked-cold-revalidation.py -v
      - name: Genuine historical package cold read-only revalidation under original FD9 on disposable OPNsense 26.7
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.fast_only != true) }}
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit lua54
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            GITHUB_ACTIONS=true ZAPRET2_STAGE2_LOCKED_COLD_REVALIDATION=1 /usr/local/bin/python3 scripts/stage2-prepkg-locked-cold-revalidation.py --execute /tmp/os-zapret2-restyle-0.6.2_1.pkg
