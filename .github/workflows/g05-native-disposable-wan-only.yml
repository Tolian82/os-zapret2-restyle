name: G05 native first WAN-only HTTPS save

on:
  pull_request:
    paths:
      - src/opnsense/scripts/OPNsense/Zapret/shared_apply_wan.php
      - scripts/stage2-opnsense-g05-wan-save.py
      - src/opnsense/scripts/OPNsense/Zapret/strategy_lab/launch.sh
      - src/opnsense/scripts/OPNsense/Zapret/strategy_lab_circular_launcher.sh
      - src/opnsense/mvc/app/controllers/OPNsense/Zapret/Api/StrategyLabController.php
      - scripts/test-wan-first-preflight.php
      - scripts/test-g05-wan-config.php
      - scripts/test-g05-wan-route.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-g05:
    name: Fast G05 scoped Config and FD9 routing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify native WAN-only Config, false owner, fast rollback boundaries
        run: |
          set -eu
          php -l src/opnsense/scripts/OPNsense/Zapret/shared_apply_wan.php
          php -l src/opnsense/mvc/app/controllers/OPNsense/Zapret/Api/SettingsController.php
          php scripts/test-g05-wan-config.php
          php scripts/test-wan-first-preflight.php
          php -l src/opnsense/mvc/app/controllers/OPNsense/Zapret/Api/StrategyLabController.php
          sh -n src/opnsense/scripts/OPNsense/Zapret/strategy_lab/launch.sh
          sh -n src/opnsense/scripts/OPNsense/Zapret/strategy_lab_circular_launcher.sh
          sh scripts/test-strategy-lab-job-contract.sh
          sh -n src/opnsense/scripts/OPNsense/Zapret/zapret_service.sh
          sh -n scripts/test-g05-wan-route.sh
          sh scripts/test-g05-wan-route.sh
          python3.13 -m py_compile scripts/stage2-opnsense-g05-wan-save.py
          php scripts/test-shared-apply-envelope.php
          php scripts/test-shared-apply-config.php

  native-g05:
    needs: fast-g05
    name: Real OPNsense 26.7 first WAN Save with no upstream and empty strategy
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Genuine package + authenticated WAN only + saved-empty same archive reinstall
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1 ZAPRET2_G05_DISPOSABLE_NATIVE=1 ZAPRET2_G05_WAN_FIRST_NATIVE=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage2-opnsense-g05-wan-save.py
