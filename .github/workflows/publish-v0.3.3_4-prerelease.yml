name: Publish v0.3.3_4 prerelease

on:
  push:
    branches:
      - 'publish/v0.3.3_4'

permissions:
  actions: read
  contents: write

concurrency:
  group: prerelease-v0.3.3_4
  cancel-in-progress: true

jobs:
  publish:
    name: Verify and publish FreeBSD 15 prerelease
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6

      - name: Verify candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "0.3.3"
          test "$(sed -n 's/^PLUGIN_REVISION=[[:space:]]*//p' Makefile | head -1)" = "4"

      - name: Download immutable FreeBSD 15 package artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '8972953786'
          github-token: ${{ github.token }}
          repository: Tolian82/os-zapret2-restyle
          run-id: '31113842984'
          path: dist

      - name: Verify package identity
        shell: bash
        run: |
          set -euo pipefail
          package='dist/os-zapret2-restyle-0.3.3_4.pkg'
          manifest=$(mktemp)
          trap 'rm -f "${manifest}"' EXIT
          test -f "${package}"
          tar -xOf "${package}" +MANIFEST > "${manifest}"
          python - "${manifest}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)

          expected = {
              "version": "0.3.3_4",
              "abi": "FreeBSD:15:amd64",
              "arch": "freebsd:15:x86:64",
          }
          actual = {key: manifest.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(f"unexpected package manifest: {actual!r}")
          PY

      - name: Publish prerelease asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.3.3_4
          target_commitish: 34f69490f57f50aca85c9aa8e684a7f9bc72ca81
          name: v0.3.3_4
          prerelease: true
          draft: false
          generate_release_notes: false
          body: |
            Testing candidate for repeating Strategy Lab live scenario 1 after correcting the semantic process inspector. It also includes the Diagnostics idle-state reload correction from revision 3.

            Target: FreeBSD 15 amd64 only.
            This prerelease is not a stable product release and does not publish the pkg repository.
          files: dist/os-zapret2-restyle-0.3.3_4.pkg
          fail_on_unmatched_files: true
