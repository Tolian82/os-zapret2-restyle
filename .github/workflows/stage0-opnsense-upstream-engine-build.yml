name: Stage 0 disposable OPNsense pinned genuine upstream BSD engine

on:
  pull_request:
    paths:
      - scripts/stage0-opnsense-upstream-engine-build.py
      - scripts/test-stage0-opnsense-upstream-engine-build.py
      - .github/workflows/stage0-opnsense-upstream-engine-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-pinned-dvtws2:
    name: Pinned real upstream FreeBSD dvtws2 ELF and cold genuine predecessor
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Exact syntax plus 14 offline acceptance/refusal contracts
        run: |
          python3.13 -m py_compile scripts/stage0-opnsense-upstream-engine-build.py scripts/test-stage0-opnsense-upstream-engine-build.py
          python3.13 scripts/test-stage0-opnsense-upstream-engine-build.py -v
      - name: Native disposable OPNsense 26.7 signed-repo toolchain and pinned upstream BSD build
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          mem: 4096
          cpu: 2
          disable-cache: true
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git gmake pkgconf lua54
            /usr/local/bin/pkgconf --exists lua-5.4
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            /usr/local/bin/python3 scripts/stage0-opnsense-upstream-engine-build.py /tmp/os-zapret2-restyle-0.6.2_1.pkg
