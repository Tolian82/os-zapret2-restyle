name: One-time archival cleanup of superseded P3 branch
on:
  push:
    branches:
      - archive/retired-branches-2026-11-08
    paths:
      - .github/workflows/retire-archived-p3-one-shot.yml
permissions:
  contents: write
jobs:
  cleanup:
    name: Confirm preserved exact head, delete obsolete ref only
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable history and exact obsolete branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: "feature/v0.6.4_14-p3-voice-i18n-form-anchors"
          TARGET_SHA: "fd13ff5761d3eee5c3f68a111e34d8e9d844a44f"
          BEFORE_ARCHIVE_SHA: "a157f0cc01d4fcb6287a40b68350a6dba9cebc3c"
        run: |
          set -euo pipefail
          [ "${REPOSITORY}" = "Tolian82/os-zapret2-restyle" ]
          [ "${GITHUB_REF}" = "refs/heads/archive/retired-branches-2026-11-08" ]
          git init -q /tmp/verify-archive
          cd /tmp/verify-archive
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch -q --no-tags origin "${GITHUB_SHA}"
          git fetch -q --no-tags origin "${TARGET_SHA}"
          git merge-base --is-ancestor "${BEFORE_ARCHIVE_SHA}" "${GITHUB_SHA}" || {
            git fetch -q --no-tags origin "${BEFORE_ARCHIVE_SHA}"
            git merge-base --is-ancestor "${BEFORE_ARCHIVE_SHA}" "${GITHUB_SHA}"
          }
          git merge-base --is-ancestor "${TARGET_SHA}" "${GITHUB_SHA}"
          current=$(gh api "repos/${REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')
          [ "${current}" = "${TARGET_SHA}" ] || {
            echo "Obsolete branch ref moved; refusing deletion"; exit 1;
          }
          open_pr=$(gh api "repos/${REPOSITORY}/pulls?state=open&per_page=100" --jq "[.[] | select(.head.ref == \"${TARGET_BRANCH}\")] | length")
          [ "${open_pr}" = "0" ] || { echo "Branch has an open PR"; exit 1; }
          gh api -X DELETE "repos/${REPOSITORY}/git/refs/heads/${TARGET_BRANCH}"
          if gh api "repos/${REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "Deletion not verified"; exit 1;
          fi
          echo "ARCHIVED_BRANCH_CLEANUP=PASS: original exact unique commits preserved, obsolete ref absent"
