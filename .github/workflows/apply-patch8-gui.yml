name: Apply Patch 8 GUI

on:
  push:
    paths:
      - .github/workflows/apply-patch8-gui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/strategy-lab-circular-eligibility
      - name: Apply GUI eligibility changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/opnsense/mvc/app/views/OPNsense/Zapret/diagnostics.volt')
          text = path.read_text()
          replacements = {
          "'Введите домен, который в настоящее время блокируется вашим интернет-провайдером, и нажмите «Запустить». В течение 1–3 минут будут произведены множественные проверки стратегий обхода DPI, после чего будет сообщено, какие из них позволяют успешно открыть сайт.',":
          "'Введите домен, который в настоящее время блокируется вашим интернет-провайдером, и нажмите «Запустить». Основной режим проверки ограничен 150 секундами, расширенный — 270 секундами. После завершения будут показаны стабильные стратегии, которые обеспечили доступ к сайту.',",
          "'Enter a domain that is currently blocked by your ISP and click “Run.” Multiple DPI bypass strategies will be tested over the next 1–3 minutes, after which the strategies that successfully provide access to the site will be reported.',":
          "'Enter a domain that is currently blocked by your ISP and click “Run.” Standard mode is limited to 150 seconds and extended mode to 270 seconds. Stable strategies that successfully provide access to the site will be reported after completion.',",
          "        var circularReady = items.length >= 3 && items.length <= 5 && data.target_type === 'domain';\n        $('#circularControls').toggle(circularReady);\n        if (data.state === 'completed') $('#strategyLabMessage').text(items.length ? ui.circularReady : ui.noCandidates);":
          "        var circularReady = data.circular_eligible === true;\n        $('#circularControls').toggle(circularReady);\n        if (data.state === 'completed') {\n            if (circularReady) $('#strategyLabMessage').text(ui.circularReady);\n            else if (!items.length) $('#strategyLabMessage').text(ui.noCandidates);\n        }"
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('expected GUI text not found: ' + old[:80])
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm -f .github/workflows/apply-patch8-gui.yml
          git config user.name 'Tolian82'
          git config user.email '309637356+Tolian82@users.noreply.github.com'
          git add src/opnsense/mvc/app/views/OPNsense/Zapret/diagnostics.volt .github/workflows/apply-patch8-gui.yml
          git commit -m 'chore: gate circular controls on backend eligibility'
          git push origin HEAD:agent/strategy-lab-circular-eligibility
