name: Trigger WebGUI lifecycle preparation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'agent/fix-postinstall-webgui-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-postinstall-webgui-refresh

      - name: Apply embedded focused change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/prepare-webgui-refresh.yml').read_text().splitlines()
          start = source.index("          python3 - <<'PY'") + 1
          end = source.index("          PY", start)
          body = []
          for line in source[start:end]:
              if line == '':
                  body.append('')
              elif line.startswith('          '):
                  body.append(line[10:])
              else:
                  raise SystemExit(f'unexpected embedded-script indentation: {line!r}')
          code = '\n'.join(body) + '\n'
          compile(code, '<embedded-webgui-lifecycle-fix>', 'exec')
          exec(code, {'__name__': '__main__'})
          PY

          rm -f \
            .github/workflows/prepare-webgui-refresh.yml \
            .github/workflows/prepare-webgui-refresh-pr.yml

      - name: Validate focused change
        shell: bash
        run: |
          set -euo pipefail
          find src -type f -name "*.sh" -exec sh -n {} \;
          find pkg -type f -exec sh -n {} \;
          find scripts -type f -name "*.sh" -exec sh -n {} \;
          sh -n src/etc/rc.syshook.d/start/20-zapret
          sh -n src/etc/rc.syshook.d/stop/20-zapret
          sh scripts/test-profile-normalizer.sh
          sh scripts/test-profile-pipeline.sh
          sh scripts/test-config-activation-contract.sh
          sh scripts/test-lifecycle-lock-fd.sh
          sh scripts/test-package-lifecycle-restart.sh
          sh scripts/test-setup-release-selection.sh
          git diff --check
          git diff --stat

      - name: Commit prepared logical change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Makefile \
            pkg/+POST_INSTALL \
            scripts/test-package-lifecycle-restart.sh \
            README.md \
            docs/PROJECT_STATE.md \
            docs/AUDIT.md \
            docs/ARCHITECTURE.md \
            docs/DEVLOG.md \
            docs/ROADMAP.md \
            docs/REQUIREMENTS.md \
            docs/CHANGELOG.md \
            .github/workflows/prepare-webgui-refresh.yml \
            .github/workflows/prepare-webgui-refresh-pr.yml
          git diff --cached --check
          git commit -m "Refresh WebGUI after plugin package updates"
          git push origin HEAD:agent/fix-postinstall-webgui-refresh
