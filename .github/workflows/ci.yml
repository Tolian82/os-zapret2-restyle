  native-ipfw-table:
    name: Isolated FreeBSD 15.1 native IPFW tables and IPv6 UDP divert
    if: ${{ github.event_name == 'pull_request' && (needs.changes.outputs.package == 'true' || needs.changes.outputs.native_wan_process == 'true') }}
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - uses: actions/checkout@v6
      - name: Probe native IPFW tables and loopback IPv6 packets in disposable VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          prepare: pkg install -y python313 git luajit pkgconf jq curl
          run: |
            freebsd-version -u | grep -Eq '^15[.]1([.-]|$)'
            /usr/local/bin/python3.13 -m py_compile scripts/test-freebsd15-native-wan-process-continuity.py scripts/test-freebsd15-native-tls-process-identity.py
            process_witness_output="$(ZAPRET2_ISOLATED_FREEBSD_VM_WAN_PROCESS_TEST=1 /usr/local/bin/python3.13 scripts/test-freebsd15-native-wan-process-continuity.py 2>&1)" || {
              printf '%s\n' "$process_witness_output"
              exit 1
            }
            printf '%s\n' "$process_witness_output"
            printf '%s\n' "$process_witness_output" | grep -Fqx 'NATIVE_WAN_PROCESS_CONTINUITY=PASS: FreeBSD15.1 native PID/start-time, restart, refusal and cleanup' || {
              echo 'Native FreeBSD 15.1 process witness must PASS; SKIP is not acceptance' >&2
              exit 1
            }
            /usr/local/bin/python3.13 -m py_compile scripts/test-freebsd15-native-wan-baseline-lifecycle.py scripts/stage5-wan-baseline-capture.py scripts/stage5-wan-pcap-attribution.py
            baseline_capture_output="$(ZAPRET2_ISOLATED_FREEBSD_VM_WAN_BASELINE_TEST=1 /usr/local/bin/python3.13 scripts/test-freebsd15-native-wan-baseline-lifecycle.py 2>&1)" || {
              printf '%s\n' "$baseline_capture_output"
              exit 1
            }
            printf '%s\n' "$baseline_capture_output"
            printf '%s\n' "$baseline_capture_output" | grep -Fqx 'NATIVE_WAN_BASELINE_LIFECYCLE=PASS: FreeBSD15.1 real lo0 IPv4/IPv6 tcpdump readiness, bounded termination, unsupported-DLT refusal and cleanup' || {
              echo 'Native FreeBSD 15.1 tcpdump lifecycle must PASS; SKIP is not acceptance' >&2
              exit 1
            }
            /usr/local/bin/python3.13 -m py_compile scripts/test-freebsd15-stage6-three-acceptance.py scripts/test-freebsd15-native-strategy-lab-engine.py scripts/test-freebsd15-native-strategy-lab-ipfw.py scripts/test-freebsd15-native-ipfw-table.py scripts/test-freebsd15-native-ipfw-packet.py scripts/test-freebsd15-native-ipfw-transaction.py scripts/test-freebsd15-native-engine-exclude.py scripts/test-freebsd15-native-strategy-mutation.py scripts/test-freebsd15-native-tls-strategy.py scripts/test-freebsd15-native-tls-fake.py
            native_probe_output="$(ZAPRET2_ISOLATED_FREEBSD_VM_TABLE_TEST=1 /usr/local/bin/python3.13 scripts/test-freebsd15-native-ipfw-table.py 2>&1)" || {
              printf '%s\n' "$native_probe_output"
              exit 1
            }
            printf '%s\n' "$native_probe_output"
            printf '%s\n' "$native_probe_output" | grep -Fqx 'STAGE5_NATIVE_TABLE=PASS: FreeBSD15 live kernel add/list/swap/restore/cleanup' || {
              echo 'Native FreeBSD 15 IPFW smoke must PASS; SKIP is not acceptance' >&2
              exit 1
            }
            packet_probe_output="$(ZAPRET2_ISOLATED_FREEBSD_VM_TABLE_TEST=1 ZAPRET2_ISOLATED_FREEBSD_VM_IPV6_PACKET_TEST=1 /usr/local/bin/python3.13 scripts/test-freebsd15-native-ipfw-packet.py 2>&1)" || {
              printf '%s\n' "$packet_probe_output"
              exit 1
            }
            printf '%s\n' "$packet_probe_output"
            printf '%s\n' "$packet_probe_output" | grep -Fqx 'STAGE5_NATIVE_IPV6_PACKET=PASS: FreeBSD15.1 lo0 IPv6 UDP divert/reinject and STUN port scope' || {
              echo 'Native FreeBSD 15.1 IPv6 packet smoke must PASS; SKIP is not acceptance' >&2
              exit 1
            }
            lab_probe_output="$(ZAPRET2_ISOLATED_FREEBSD_VM_TABLE_TEST=1 ZAPRET2_ISOLATED_FREEBSD_VM_STRATEGY_LAB_IPFW_TEST=1 /usr/local/bin/python3.13 scripts/test-freebsd15-native-strategy-lab-ipfw.py 2>&1)" || {
              printf '%s\n' "$lab_probe_output"
              exit 1
            }
            printf '%s\n' "$lab_probe_output"
            printf '%s\n' "$lab_probe_output" | grep -Fqx 'STAGE6_NATIVE_LAB_IPFW=PASS: production Stage40 dual-stack pins, actual IPFW lo0 IPv4/IPv6 divert/reinject/counters, bypass, cleanup and failed-install restoration' || {
              echo 'Real FreeBSD15 Strategy Lab production adapter IPv4/IPv6 packet witness must PASS; SKIP is not accepted' >&2
              exit 1
            }
            transaction_probe_output="$(ZAPRET2_ISOLATED_FREEBSD_VM_TABLE_TEST=1 ZAPRET2_ISOLATED_FREEBSD_VM_TRANSACTION_TEST=1 /usr/local/bin/python3.13 scripts/test-freebsd15-native-ipfw-transaction.py 2>&1)" || {
              printf '%s\n' "$transaction_probe_output"
              exit 1
            }
            printf '%s\n' "$transaction_probe_output"
            printf '%s\n' "$transaction_probe_output" | grep -Fqx 'STAGE5_NATIVE_TRANSACTION=PASS: FreeBSD15.1 real dual-stack install/fault/rollback/commit/retire/cleanup' || {
              echo 'Native FreeBSD 15.1 IPFW rollback smoke must PASS; SKIP is not acceptance' >&2
              exit 1
            }

            # Test the same two loopback destinations with identical UDP
            # payloads using the real pinned upstream native dvtws2. No WAN,
            # installed OPNsense filesystem or production service involved.
            native_engine_source="$(mktemp -d)"
            trap 'rm -rf "$native_engine_source"' EXIT
            git clone --quiet --branch v1.0.6 --depth 1 https://github.com/bol-van/zapret2.git "$native_engine_source"
            test "$(git -C "$native_engine_source" rev-parse HEAD)" = "221d7dff24bfec0cd5ac0a5070b8acef2008af3d"
            make -C "$native_engine_source/nfq2"
            test -x "$native_engine_source/nfq2/dvtws2"
            # Native kernel NUL-delimited argv + PID/start-time for pinned TLS fake engine.
            native_tls_identity_output="$(ZAPRET2_ISOLATED_FREEBSD_VM_WAN_PROCESS_TEST=1 /usr/local/bin/python3.13 scripts/test-freebsd15-native-tls-process-identity.py "$native_engine_source/nfq2/dvtws2" 2>&1)" || {
              printf '%s\n' "$native_tls_identity_output"
              exit 1
            }
            printf '%s\n' "$native_tls_identity_output"
            printf '%s\n' "$native_tls_identity_output" | grep -Fqx 'NATIVE_TLS_PROCESS_ARGV_IDENTITY=PASS: FreeBSD15.1 real dvtws2 kernel NUL-argv equals exact expected profile; PID/start unchanged, stale/reordered refused, cleaned' || {
              echo 'Native TLS kernel argv identity MUST PASS; no SKIP is allowed' >&2
              exit 1
            }
            lab_engine_output="$(ZAPRET2_ISOLATED_FREEBSD_VM_TABLE_TEST=1 ZAPRET2_ISOLATED_FREEBSD_VM_EXCLUDE_WIRE_TEST=1 ZAPRET2_ISOLATED_FREEBSD_VM_STRATEGY_LAB_ENGINE_TEST=1 /usr/local/bin/python3.13 scripts/test-freebsd15-native-strategy-lab-engine.py "$native_engine_source/nfq2/dvtws2" 2>&1)" || {
              printf '%s\n' "$lab_engine_output"
              exit 1
            }
            printf '%s\n' "$lab_engine_output"
            printf '%s\n' "$lab_engine_output" | grep -Fqx 'STAGE6_NATIVE_LAB_ENGINE=PASS: production Stage40 CandidateSpec, real dvtws2 IPv4/IPv6 TLS delivery, IPFW counters and exact cleanup; BPF active header not claimed' || {
              echo 'Real Strategy Lab Stage40-to-dvtws2 IPv4/IPv6 TLS BPF witness must PASS; SKIP is not accepted' >&2
              exit 1
            }
            # Exactly three new Stage6 acceptance scenarios, no matrix expansion.
            three_output="$(ZAPRET2_ISOLATED_FREEBSD_VM_TABLE_TEST=1 ZAPRET2_ISOLATED_FREEBSD_VM_EXCLUDE_WIRE_TEST=1 ZAPRET2_ISOLATED_FREEBSD_VM_THREE_ACCEPTANCE=1 /usr/local/bin/python3.13 scripts/test-freebsd15-stage6-three-acceptance.py "$native_engine_source/nfq2/dvtws2" 2>&1)" || {
              printf '%s\n' "$three_output"
              exit 1
            }
            printf '%s\n' "$three_output"
            for marker in \
              'STAGE6_THREE_ACCEPTANCE_1=PASS: AAAA-only real Stage85 3/3 verified TLS and IPFW' \
              'STAGE6_THREE_ACCEPTANCE_2=PASS: native IPv6 OFF/ON Stage30 and real A+AAAA TLS candidate' \
              'STAGE6_THREE_ACCEPTANCE_3=PASS: real untrusted TLS fails closed; no owned process/IPFW remains' \
              'STAGE6_THREE_ACCEPTANCE=PASS: 1=AAAA-only real Stage85 CA-verified 3/3; 2=IPv6 OFF/ON and real A+AAAA pinned TLS; 3=wrong-CA failure and exact cleanup'
            do
              printf '%s\n' "$three_output" | grep -Fqx "$marker" || {
                echo "All three exact Stage6 native acceptance results must PASS; no SKIP accepted" >&2
                exit 1
              }
            done
            native_exclude_output="$(ZAPRET2_ISOLATED_FREEBSD_VM_TABLE_TEST=1 ZAPRET2_ISOLATED_FREEBSD_VM_EXCLUDE_WIRE_TEST=1 /usr/local/bin/python3.13 scripts/test-freebsd15-native-engine-exclude.py "$native_engine_source/nfq2/dvtws2" 2>&1)" || {
              printf '%s\n' "$native_exclude_output"
              exit 1
            }
            printf '%s\n' "$native_exclude_output"
            printf '%s\n' "$native_exclude_output" | grep -Fqx 'NATIVE_ENGINE_EXCLUDE_WIRE=PASS: real dvtws2 v1.0.6 IPv4/IPv6 three-profile baseline DROP, nonmatching Exclude DROP, matching Exclude pass' || {
              echo 'Native FreeBSD 15.1 real-engine IPv4/IPv6 Exclude three-phase negative-control packet test must PASS' >&2
              exit 1
            }
            # Independent real TCP bytes: selected upstream HTTP Host-case
            # strategy vs identical input and matching/nonmatching global Exclude.
            native_strategy_output="$(ZAPRET2_ISOLATED_FREEBSD_VM_TABLE_TEST=1 ZAPRET2_ISOLATED_FREEBSD_VM_EXCLUDE_WIRE_TEST=1 /usr/local/bin/python3.13 scripts/test-freebsd15-native-strategy-mutation.py "$native_engine_source/nfq2/dvtws2" 2>&1)" || {
              printf '%s\n' "$native_strategy_output"
              exit 1
            }
            printf '%s\n' "$native_strategy_output"
            printf '%s\n' "$native_strategy_output" | grep -Fqx 'NATIVE_STRATEGY_PACKET_ATTRIBUTION=PASS: native HTTP strategy modifies IPv4/IPv6 TCP bytes; nonmatching Exclude modifies; exact matching Exclude preserves; owned IPFW restored' || {
              echo 'Native actual-strategy byte-attribution trial must PASS; SKIP is not acceptance' >&2
              exit 1
            }
            # Real OpenSSL ClientHello, real upstream pktmod and native lo0
            # BPF packet-header attribution with exact positive/negative Exclude.
            native_tls_output="$(ZAPRET2_ISOLATED_FREEBSD_VM_TABLE_TEST=1 ZAPRET2_ISOLATED_FREEBSD_VM_EXCLUDE_WIRE_TEST=1 /usr/local/bin/python3.13 scripts/test-freebsd15-native-tls-strategy.py "$native_engine_source/nfq2/dvtws2" 2>&1)" || {
              printf '%s\n' "$native_tls_output"
              exit 1
            }
            printf '%s\n' "$native_tls_output"
            printf '%s\n' "$native_tls_output" | grep -Fqx 'NATIVE_TLS_CLIENTHELLO_HEADER=PASS: native TLS ClientHello selected pktmod TTL IPv4/IPv6, nonmatching Exclude modifies, exact matching Exclude preserves, IPFW/pcap cleaned' || {
              echo 'Isolated native TLS ClientHello packet mutation witness must PASS; no SKIP is allowed' >&2
              exit 1
            }
            # Real upstream TLS fake, unique forged payload and genuine ClientHello.
            # IPv4/IPv6, matching/nonmatching native Exclude, exact TCP flow.
            native_fake_output="$(ZAPRET2_ISOLATED_FREEBSD_VM_TABLE_TEST=1 ZAPRET2_ISOLATED_FREEBSD_VM_EXCLUDE_WIRE_TEST=1 /usr/local/bin/python3.13 scripts/test-freebsd15-native-tls-fake.py "$native_engine_source/nfq2/dvtws2" 2>&1)" || {
              printf '%s\n' "$native_fake_output"
              exit 1
            }
            printf '%s\n' "$native_fake_output"
            printf '%s\n' "$native_fake_output" | grep -Fqx 'NATIVE_TLS_FAKE_PACKET=PASS: real TLS fake IPv4/IPv6 captured only without matching Exclude; original ClientHello attributed on wire; IPFW cleaned' || {
              echo 'Native TLS fake packet attribution MUST PASS; no SKIP is allowed' >&2
              exit 1
            }

  package:
    name: Build FreeBSD 15 package
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    needs: [changes, validate]

    steps:
      - uses: actions/checkout@v6

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_VALUE=$(tr -d '[:space:]' < VERSION)
          REVISION=$(sed -n 's/^PLUGIN_REVISION=[[:space:]]*//p' Makefile | head -1)

          if [[ -n "${REVISION}" && "${REVISION}" != "0" ]]; then
            FULL_VERSION="${VERSION_VALUE}_${REVISION}"
          else
            FULL_VERSION="${VERSION_VALUE}"
          fi

          echo "version=${FULL_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build package inside FreeBSD 15 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          prepare: pkg install -y jq python313 gmake pkgconf luajit git
          run: |
            test "$(freebsd-version -u | cut -d. -f1)" = "15"
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-foundation.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-state-persistence.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-orchestration.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-probes.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-candidate-spec.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-candidate-family.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-search-graph.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-adaptive-planner.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-search-extended.sh
            /usr/local/bin/python3.13 scripts/test-voice-ipfw-adapter.py
            /usr/local/bin/python3.13 scripts/test-voice-live-inspect.py
            /usr/local/bin/python3.13 scripts/test-voice-generator-interop.py
            /usr/local/bin/python3.13 scripts/test-voice-common-runtime.py
            /usr/local/bin/python3.13 scripts/test-voice-native-build-wire.py
            /usr/local/bin/python3.13 scripts/test-voice-native-lifecycle-router.py
            sh scripts/test-voice-atomic-rollback-preflight.sh
            /usr/local/bin/python3.13 scripts/test-ipset-policy.py
            /usr/local/bin/python3.13 scripts/test-voice-targets-integration.py
            sh scripts/build-pkg.sh
            sh scripts/test-private-curl-native-ech.sh

      - name: Inspect built FreeBSD 15 package
        run: |
          set -eu
          contents=$(mktemp)
          manifest=$(mktemp)
          trap 'rm -f "${contents}" "${manifest}"' EXIT

          ls -lh dist/
          tar -tf dist/*.pkg > "${contents}"
          head -30 "${contents}"
          if grep -Eq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_native_((prepare|apply)_route|forward_apply|forward_stage_prepare|previous_evidence_prepare|initial_ipfw_seed|forward_prepare|forward_ipfw|forward_supervisor|candidate_engine_start|forward_stop)[.]py$' "${contents}"; then
            echo "ERROR: retired private Voice backend leaked into installable FreeBSD package" >&2
            exit 1
          fi
          if grep -Eq 'usr/local/opnsense/scripts/OPNsense/Zapret/voice_native_(render_saved|build_release)[.]sh$' "${contents}"; then
            echo "ERROR: retired operator Voice workers leaked into FreeBSD package" >&2
            exit 1
          fi
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_python_launcher.sh' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_python.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/compat.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/state.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/orchestrator.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/request.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/probe.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/endpoint_epoch.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/telemetry.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/resources.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/candidate_spec.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/candidate.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/family.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/search_graph.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/search.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/extended.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_candidate_adapter.sh' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_stage_adapter.sh' "${contents}"
          if grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/telegram_voice.sh' "${contents}"; then
            echo "ERROR: retired Telegram Phase-B PoC shipped in package" >&2
            exit 1
          fi
          # The old cutover-only process actuator has no shared Apply caller.
          if grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_native_process_lifecycle.sh' "${contents}"; then
            echo "ERROR: retired private Voice process actuator shipped in package" >&2
            exit 1
          fi
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_ipfw_adapter.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_live_inspect.py' "${contents}"
          # Retired Telegram PoC executors, cutover journals and private
          # five-resource backup paths must never return to the FreeBSD package.
          if grep -Eq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/(voice_cutover_|voice_ipfw_runtime[.]py$|voice_native_(boot_recovery_review|five_resource_recovery|recovery_quiescence|forward_runtime|process_actions|process_probe|kernel_argv|live_preflight|file_observer|full_observer)[.]py$)' "${contents}"; then
            echo "ERROR: retired Telegram PoC private backend leaked into FreeBSD package" >&2
            exit 1
          fi
          if grep -Eq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/(voice_native_legacy_[A-Za-z_]+|voice_migration_plan)[.]py$' "${contents}"; then
            echo "ERROR: retired Telegram PoC migration/rollback leaked into FreeBSD package" >&2
            exit 1
          fi
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_release_stage.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_profile_compiler.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_capture_plan.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_traffic_merge.py' "${contents}"
          # Validate the installed paths, not only the git/source tree.
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          extracted=$(mktemp -d)
          trap 'rm -f "${contents}" "${manifest}"; rm -rf "${extracted}"' EXIT
          tar -xf dist/*.pkg -C "${extracted}"
          php scripts/test-voice-ui-route.php "${extracted}/usr/local/opnsense"
          tar -xOf dist/*.pkg +MANIFEST > "${manifest}"
          jq -e '.abi == "FreeBSD:15:amd64" and .arch == "freebsd:15:x86:64" and .deps.python313.origin == "lang/python313" and (.deps | has("php85-posix") | not)' "${manifest}" >/dev/null
          head -80 "${manifest}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: os-zapret2-restyle-${{ steps.version.outputs.version }}
          path: dist/os-zapret2-restyle-*.pkg
          if-no-files-found: error

  main-integrity:
    name: Verify main integrity
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check committed diff, title identity, and core identity
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            git diff --check "${BEFORE_SHA}" "${CURRENT_SHA}"
          fi

          VERSION_VALUE=$(tr -d '[:space:]' < VERSION)
          REVISION=$(sed -n 's/^PLUGIN_REVISION=[[:space:]]*//p' Makefile | head -1)
          [[ "${VERSION_VALUE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf '%s\n' "${REVISION}" | grep -Eq '^[0-9]+$'

          EXPECTED="v${VERSION_VALUE}"
          if [[ -n "${REVISION}" && "${REVISION}" != "0" ]]; then
            EXPECTED="${EXPECTED}_${REVISION}"
          fi

          SUBJECT=$(git show -s --format=%s "${CURRENT_SHA}")
          case "${SUBJECT}" in
            "${EXPECTED}: "*)
              echo "Main commit subject matches package candidate ${EXPECTED}."
              ;;
            *)
              echo "Invalid main commit subject: ${SUBJECT}" >&2
              echo "Required format: ${EXPECTED}: <logical change>" >&2
              exit 1
              ;;
          esac

          grep -Eq '^PLUGIN_NAME=[[:space:]]+zapret2-restyle$' Makefile
          sh -n scripts/test-github-branch-hygiene.sh
          sh scripts/test-github-branch-hygiene.sh
