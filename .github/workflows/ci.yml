name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.paths.outputs.package }}
      docs_only: ${{ steps.paths.outputs.docs_only }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify repository changes
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            base_sha="${CURRENT_SHA}^"
            head_sha="${CURRENT_SHA}"
          else
            base_sha="${PUSH_BEFORE_SHA}"
            head_sha="${CURRENT_SHA}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="${head_sha}^"
          fi

          # Fail fast on whitespace errors before expensive PR/package checks.
          git diff --check "${base_sha}" "${head_sha}"
          changed=$(git diff --name-only "${base_sha}" "${head_sha}")
          printf '%s\n' "${changed}"

          docs_only=false
          if [[ "${EVENT_NAME}" != "workflow_dispatch" && -n "${changed}" ]]; then
            non_docs=$(printf '%s\n' "${changed}" | grep -Ev '^(AGENTS\.md|README\.md|docs/.*\.md)$' || true)
            if [[ -z "${non_docs}" ]]; then
              docs_only=true
            fi
          fi

          package=false
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            package=true
          elif printf '%s\n' "${changed}" | grep -Eq '^(\.github/workflows/ci\.yml$|VERSION$|Makefile$|pkg/|src/|repository/|scripts/build-pkg\.sh$|scripts/test-freebsd15-package-ci\.sh$)'; then
            package=true
          fi

          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
          echo "package=${package}" >> "${GITHUB_OUTPUT}"

  validate-docs:
    name: Validate documentation
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python for documentation checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check handoff identity on documentation changes
        run: python3.13 scripts/test-current-handoff-identity.py

      - name: Validate documentation-governance scripts
        run: |
          sh -n scripts/test-release-trigger.sh
          sh -n scripts/test-github-branch-hygiene.sh
          sh -n scripts/test-repository-hygiene.sh

      - name: Test automated release trigger contract
        run: sh scripts/test-release-trigger.sh

      - name: Test GitHub delivery governance
        run: sh scripts/test-github-branch-hygiene.sh

      - name: Test repository documentation integrity
        run: sh scripts/test-repository-hygiene.sh

  voice-contract:
    name: Validate Voice candidates
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate Voice shell and Python syntax
        run: |
          sh -n scripts/test-voice-shared-ipsets.sh
          python3.13 -m py_compile src/opnsense/scripts/OPNsense/Zapret/backend/voice_profile_compiler.py
          python3.13 -m py_compile scripts/test-voice-profile-compiler.py
      - name: Stage 1 dual-stack IPSET compiler and full-family guards
        run: |
          python3.13 -m py_compile src/opnsense/scripts/OPNsense/Zapret/backend/ipset_policy.py
          python3.13 scripts/test-ipset-policy.py
      - name: Voice shared IPv4 targets
        run: sh scripts/test-voice-shared-ipsets.sh

      - name: Validate dvtws2 process census before shared Apply
        run: sh scripts/test-voice-common-engine-census.sh
      - name: Shared runtime activation and rollback
        run: sh scripts/test-voice-common-apply-runtime.sh
      - name: Voice fail-closed compiler
        run: python3.13 scripts/test-voice-profile-compiler.py
      - name: Voice destination-scoped IPFW capture planning
        run: python3.13 scripts/test-voice-capture-plan.py
      - name: Persisted Voice model to candidate and capture plan
        run: python3.13 scripts/test-voice-model-export.py
      - name: Voice inactive staging with managed IPSET and resolved WAN
        run: python3.13 scripts/test-voice-release-stage.py
      - name: Real orchestrator native Voice candidate build
        run: python3.13 scripts/test-voice-native-build-wire.py
      - name: First common Voice Apply from running legacy Strategies
        run: python3.13 scripts/test-voice-first-common-handoff.py
      - name: First common Apply shell preflight ownership
        run: sh scripts/test-voice-first-common-entry.sh
      - name: Native Voice engine --dry-run in private FD9 runtime workspace
        run: python3.13 scripts/test-voice-engine-private-dryrun.py
      - name: Voice staged candidate into native dvtws2 arguments and IPFW plan
        run: python3.13 scripts/test-voice-generator-interop.py
      - name: Native Voice saved Config and journal lifecycle router (read-only)
        run: python3.13 scripts/test-voice-native-lifecycle-router.py
      - name: Native Voice operator-only PREPARED Apply routing
        run: python3.13 scripts/test-voice-native-apply-route.py
      - name: Native Voice saved XML and rendered OPNsense template generation parity
        run: python3.13 scripts/test-voice-native-saved-pair-guard.py
      - name: Native Voice saved GUI OFF draft root-only Config candidate under FD9
        run: python3.13 scripts/test-voice-native-saved-draft-candidate.py
      - name: Native Voice saved GUI read-only FD9 preflight contract
        run: python3.13 scripts/test-voice-native-draft-preview-route.py
      - name: Voice non-destructive atomic runtime rollback preflight
        run: sh scripts/test-voice-atomic-rollback-preflight.sh
      - name: Voice IPSET integration with shared production Targets normalizer
        run: python3.13 scripts/test-voice-targets-integration.py
      - name: Voice and ordinary single-engine traffic merging
        run: python3.13 scripts/test-voice-traffic-merge.py
      - name: Shared Voice and Strategies full runtime candidate
        run: python3.13 scripts/test-voice-common-runtime.py
      - name: Voice owned IPFW transaction and rollback simulation
        run: python3.13 scripts/test-voice-firewall-transaction.py
      - name: FreeBSD IPFW adapter exact argv and parsing contract
        run: python3.13 scripts/test-voice-ipfw-adapter.py
      - name: Voice native saved-ON staging guard
        run: sh scripts/test-voice-staged-runtime-guard.sh
      - name: Voice read-only live IPFW ownership inspector
        run: python3.13 scripts/test-voice-live-inspect.py
      - name: Voice saved Config and five-profile GUI status API
        run: php scripts/test-voice-inspect-config-runtime.php
      - name: Voice one-engine five-profile runtime attestation
        run: python3.13 scripts/test-voice-common-engine-status.py
      - name: Interrupted native Config-saved cold recovery and refusal matrix
        run: sh scripts/test-shared-apply-saved-recovery.sh
      - name: Interrupted ACTIVATED staged IPFW rollback through common backend
        run: sh scripts/test-shared-apply-activated-staged.sh
      - name: Original FD9 shared native stop and restart contract
        run: sh scripts/test-shared-apply-stop.sh
      - name: "Common committed native reboot: Config/runtime/IPFW startup"
        run: sh scripts/test-shared-apply-boot.sh
      - name: Shared runtime candidate bundle content seal and crash refusal
        run: python3.13 scripts/test-shared-apply-seal.py
      - name: Single native Voice and Strategies Apply through existing configd action
        run: sh scripts/test-shared-apply-run.sh
      - name: Validate GitHub workflow step name quoting
        run: |
          python3.13 - <<'PY'
          from pathlib import Path
          import re
          for flow in Path('.github/workflows').glob('*.yml'):
              for number, line in enumerate(flow.read_text().splitlines(), 1):
                  if re.match(r'^\s*- name: [^"\x27].*:\s', line):
                      raise SystemExit(f'{flow}:{number}: quote name with colon')
          PY
      - name: Shared FD9 native Config/runtime transaction fault matrix
        run: sh scripts/test-shared-apply-execute.sh
      - name: Native detached OPNsense templates for full shared candidate
        run: python3.13 scripts/test-shared-apply-render.py
      - name: Shared FD9 Apply operation record and lifecycle guard
        run: python3.13 scripts/test-shared-apply-operation.py
      - name: Reviewed first Voice handoff attestation refuses unsafe old ownership
        run: sh scripts/test-shared-apply-reviewed-legacy.sh
      - name: Voice GUI model and localization contract
        run: python3.13 scripts/test-voice-gui-contract.py
      - name: OPNsense 26.7 real Voice UI Router and missing-handler regression
        run: php scripts/test-voice-ui-route.php src/opnsense

  validate:
    name: Validate Project
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    needs: changes
    env:
      STRATEGY_LAB_PYTHON_BIN: python3.13

    steps:
      - uses: actions/checkout@v6

      - name: Set up Strategy Lab Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils php-cli

      - name: Regression test prospective revision-governance gate
        run: bash scripts/test-pr-revision-policy.sh
      - name: Check primary revision metadata before costly test matrix
        run: python3.13 scripts/test-current-handoff-identity.py

      - name: Fast real native Remove trial and original owner rollback contracts
        run: |
          python3.13 scripts/test-extra-resources-native-saved-build.py
          python3.13 scripts/test-extra-resources-transaction.py
          python3.13 scripts/test-shared-apply-operation.py
          sh -n src/opnsense/scripts/OPNsense/Zapret/zapret_service.sh
          sh scripts/test-extra-resources-native-trial.sh
          sh scripts/test-extra-resources-native-prepared-recovery.sh

      - name: Check upstream recovery syntax and fault tests before costly matrix
        shell: bash
        run: |
          set -euo pipefail
          python3.13 -c 'import ast, pathlib; ast.parse(pathlib.Path("src/opnsense/scripts/OPNsense/Zapret/extra_resources_upstream_guard.py").read_text())'
          python3.13 scripts/test-extra-resources-upstream-guard.py
          sh scripts/test-setup-runtime-transaction.sh
          python3.13 scripts/test-upstream-interruption-recovery.py

      - name: Test isolated prospective upstream resource view and native Blob resolver
        run: python3.13 scripts/test-extra-resources-upstream-view.py

      - name: Test full native Strategies candidate against upstream-only resources
        run: python3.13 scripts/test-extra-resources-native-strategies.py

      - name: Test pinned saved XML and native rendered Strategies pair against future resources
        run: python3.13 scripts/test-extra-resources-saved-config.py

      - name: Test locked saved Config plus original native detached renderer and upstream-only view
        run: python3.13 scripts/test-extra-resources-native-locked-config.py

      - name: Test original setup lock and native FD9 saved Strategies read-only route
        run: python3.13 scripts/test-extra-resources-native-saved-route.py

      - name: Test production inert prospective native Strategies compiler shell
        run: python3.13 scripts/test-extra-resources-inert-compile.py

      - name: Test original candidate-argv Lua and BIN file witnesses
        run: python3.13 scripts/test-extra-resources-lua-inputs.py

      - name: Test Lua exported-function source shape with bounded lexical scanner
        run: python3.13 scripts/test-extra-resources-lua-source-shape.py

      - name: Test shared Lua declaration scanner for Strategy Lab and removal
        run: python3.13 scripts/test-shared-lua-declarations.py

      - name: Test installed engine ELF Lua ABI no-exec read-only hints
        run: python3.13 scripts/test-extra-resources-engine-abi.py

      - name: Validate project identity and version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_VALUE=$(tr -d '[:space:]' < VERSION)
          [[ "${VERSION_VALUE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid VERSION: ${VERSION_VALUE}"
            exit 1
          }

          grep -Eq '^PLUGIN_NAME=[[:space:]]+zapret2-restyle$' Makefile
          grep -Eq '^PLUGIN_VERSION!=[[:space:]]+/bin/cat \$\{\.CURDIR\}/VERSION$' Makefile
          grep -Eq '^PLUGIN_MAINTAINER=[[:space:]]+tolian82IPB@gmail\.com$' Makefile

          echo "Project: os-zapret2-restyle"
          echo "Package: os-zapret2-restyle"
          echo "Internal service: zapret"
          echo "Version: ${VERSION_VALUE}"

      - name: Verify native PHP uses original held FD9
        run: sh scripts/test-shared-apply-lock.sh

      - name: Validate XML files
        run: find src -type f -name "*.xml" -exec xmllint --noout {} \;

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          # One identical lint/API suite regardless of runtime source.
          # Runner PHP avoids anonymous Docker Hub rate-limit outages;
          # the pinned PHP 8.2 image remains a fallback if not installed.
          php_checks=$(cat <<'PHP_CHECKS'
          set -e
          find src -type f -name "*.php" -exec php -l {} \;
          find src -type f -name "*.inc" -exec php -l {} \;
          php scripts/test-strategy-voice-settings-scope.php
          php scripts/test-ipset-policy-php.php
          php scripts/test-voice-settings-payload.php
          php scripts/test-voice-candidate-validator.php
          php scripts/test-voice-api-concurrency.php
          php scripts/test-voice-config-flock-release.php
          php scripts/test-voice-apply-candidate.php
          php scripts/test-voice-native-config-commit.php
          php scripts/test-shared-apply-request.php
          php scripts/test-shared-apply-envelope.php
          php scripts/test-shared-apply-config.php
          php scripts/test-voice-candidate-xml.php
          php scripts/test-voice-draft-selection.php
          PHP_CHECKS
          )
          if command -v php >/dev/null 2>&1 &&
             php -r 'exit(PHP_VERSION_ID >= 80200 && PHP_VERSION_ID < 90000 ? 0 : 1);'; then
            php --version | head -n 1
            sh -c "${php_checks}"
          else
            echo "Compatible host PHP not available; using php:8.2-cli container"
            docker run --rm -v "${PWD}":/app -w /app php:8.2-cli sh -c "${php_checks}"
          fi

      - name: Verify Voice GUI and backend parser parity
        run: python3.13 scripts/test-voice-validator-parity.py

      - name: Validate shell scripts
        run: |
          find src -type f -name "*.sh" -exec sh -n {} \;
          find pkg -type f -exec sh -n {} \;
          # Project helpers explicitly using bash must be parsed with bash,
          # not silently reported as POSIX sh syntax errors by find -exec.
          find scripts -type f -name "*.sh" -print |
            while IFS= read -r script; do
              case "$(head -n 1 "$script")" in
                '#!/usr/bin/env bash'|'#!/bin/bash') bash -n "$script" ;;
                *) sh -n "$script" ;;
              esac
            done
          sh -n src/etc/rc.syshook.d/start/20-zapret
          sh -n src/etc/rc.syshook.d/stop/20-zapret
          sh -n tools/telegram-voice-lab/run-a1-opnsense.sh

      - name: Validate read-only independent-control inventory script
        run: |
          sh -n tools/telegram-voice-lab/run-control-inventory-opnsense.sh
          python3.13 tools/telegram-voice-lab/tests/test_control_path_inventory.py

      - name: Test independent Docker A1 saved-GUI diagnostics (no appliance access)
        run: python3.13 tools/telegram-voice-lab/tests/test_a1_saved_strategy_preflight.py

      - name: Test Strategy Lab Python foundation
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-foundation.sh

      - name: Test Strategy Lab Python state persistence
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-state-persistence.sh

      - name: Test Strategy Lab Python orchestration
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-orchestration.sh

      - name: Test Strategy Lab Python request and probe execution
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-probes.sh

      - name: Test private Chrome ECH-disabled policy
        run: sh scripts/test-curl-impersonate-ech-policy.sh

      - name: Test stopped committed owner with cold IPFW kernel
        run: python3.13 scripts/test-common-cold-ipfw-kernel.py

      - name: Test Strategy Lab Python candidate and family screening
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-candidate-family.sh

      - name: Test Strategy Lab Python CandidateSpec and ResourceInventory
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-candidate-spec.sh

      - name: Test Strategy Lab native Zapret2 search graph
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-search-graph.sh

      - name: Test Strategy Lab adaptive planner, search epoch, and timing telemetry
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-adaptive-planner.sh

      - name: Test Strategy Lab Python search and extended orchestration
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-search-extended.sh

      - name: Test runtime profile normalization
        run: sh scripts/test-profile-normalizer.sh

      - name: Test count-carrying profile pipeline
        run: sh scripts/test-profile-pipeline.sh

      - name: Test configuration activation contract
        run: sh scripts/test-config-activation-contract.sh

      - name: Test shared Voice IPSET registration and normalization
        run: sh scripts/test-voice-shared-ipsets.sh

      - name: Test fail-closed Voice profile compiler
        run: python3.13 scripts/test-voice-profile-compiler.py

      - name: Test Strategy Lab corrective matrix
        run: sh scripts/test-strategy-lab-corrective-matrix.sh

      - name: Test diagnostics guidance localization
        run: sh scripts/test-diagnostics-guidance-localization.sh

      - name: Test lifecycle lock descriptor isolation
        run: sh scripts/test-lifecycle-lock-fd.sh

      - name: Test package lifecycle service refresh
        run: sh scripts/test-package-lifecycle-restart.sh

      - name: Test package replacement on attested cold kernel
        run: python3.13 scripts/test-package-cold-kernel.py

      - name: Test standalone old-package cold-IPFW read-only inspection
        run: python3.13 scripts/test-legacy-cold-ipfw-preflight.py

      - name: Test setup release selection
        run: sh scripts/test-setup-release-selection.sh

      - name: Test extra-resources read-only preflight
        run: python3.13 scripts/test-extra-resources-preflight.py

      - name: Test read-only prospective removal plan with real Git HEAD
        run: python3.13 scripts/test-extra-resources-remove-plan.py

      - name: Test durable resource transaction and rollback
        run: python3.13 scripts/test-extra-resources-transaction.py

      - name: Test native Additional Resources Remove API confirmation and status
        run: php scripts/test-extra-resources-remove-api.php

      - name: Check extra-resources native lifecycle and launcher wiring
        run: python3.13 scripts/test-extra-resources-native-wiring.py

      - name: Test owned resources across upstream updates
        run: python3.13 scripts/test-extra-resources-upstream-guard.py

      - name: Test bilingual manual extra-resources GUI contract
        run: python3.13 scripts/test-extra-resources-gui-contract.py

      - name: Test job-local managed Lua/BIN capability classification
        run: python3.13 scripts/test-extra-capabilities.py

      - name: Test dynamic runnable Lua/BIN Stage-60 search graph
        run: python3.13 scripts/test-extra-resources-dynamic-graph.py
      - name: Test cached installed Lua/BIN names and Git ownership
        run: python3.13 scripts/test-extra-resources-inventory-cache.py

      - name: Test two-column resource help and cache-only GUI wiring
        run: python3.13 scripts/test-extra-resources-inventory-gui.py

      - name: Test original upstream setup transaction under shared lock
        run: sh scripts/test-setup-runtime-transaction.sh

      - name: Test GUI runtime management
        run: sh scripts/test-gui-runtime-management.sh

      - name: Test native Voice Transmission form contract
        run: python3.13 scripts/test-voice-gui-contract.py

      - name: Test automated release trigger contract
        run: sh scripts/test-release-trigger.sh

      - name: Test Node 24 release actions
        run: sh scripts/test-release-node24-actions.sh

      - name: Test FreeBSD 15 package CI contract
        run: sh scripts/test-freebsd15-package-ci.sh

      - name: Test GitHub delivery governance
        run: sh scripts/test-github-branch-hygiene.sh

      - name: Test repository artifact hygiene
        run: sh scripts/test-repository-hygiene.sh

      - name: Check required project files
        run: |
          set -eu

          for file in \
            AGENTS.md \
            VERSION \
            Makefile \
            pkg-descr \
            LICENSE \
            NOTICE \
            README.md \
            docs/CHANGELOG.md \
            docs/REQUIREMENTS.md \
            docs/ARCHITECTURE.md \
            docs/DEVLOG.md \
            docs/GITHUB_PUBLICATION.md \
            docs/decisions/DEC-2026-08-05-efficient-github-delivery.md \
            docs/decisions/DEC-2026-08-05-universal-versioned-github-titles.md \
            docs/devlog/2026-08-05-universal-versioned-github-titles.md \
            docs/patches/v0.3.2_2.md \
            docs/patches/v0.3.2_3.md \
            docs/devlog/2026-08-04-blockcheck-guidance-localization.md \
            src/etc/rc.syshook.d/start/20-zapret \
            src/etc/rc.syshook.d/stop/20-zapret \
            src/etc/inc/plugins.inc.d/zapret.inc \
            src/opnsense/service/conf/actions.d/actions_zapret.conf \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/request.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/probe.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/endpoint_epoch.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/telemetry.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/resources.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/candidate_spec.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/candidate.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/family.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/search_graph.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/search.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/extended.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_candidate_adapter.sh \
            pkg/+PRE_INSTALL \
            pkg/+POST_INSTALL \
            pkg/+PRE_DEINSTALL \
            pkg/+POST_DEINSTALL \
            scripts/build-pkg.sh \
            scripts/test-domain-diagnostics-contract.sh \
            scripts/test-strategy-lab-corrective-matrix.sh \
            scripts/test-strategy-lab-corrective-matrix-contract.sh \
            scripts/test-strategy-lab-python-foundation.sh \
            scripts/test-strategy-lab-python-state-persistence.sh \
            scripts/test-strategy-lab-python-orchestration.sh \
            scripts/test-strategy-lab-python-probes.sh \
            scripts/test-strategy-lab-python-candidate-spec.sh \
            scripts/test-strategy-lab-python-candidate-family.sh \
            scripts/test-strategy-lab-python-search-graph.sh \
            scripts/test-strategy-lab-python-adaptive-planner.sh \
            scripts/test-strategy-lab-python-search-extended.sh \
            scripts/test-diagnostics-guidance-localization.sh \
            scripts/test-package-lifecycle-restart.sh \
            scripts/test-setup-release-selection.sh \
            scripts/test-gui-runtime-management.sh \
            scripts/test-release-trigger.sh \
            scripts/test-release-node24-actions.sh \
            scripts/test-freebsd15-package-ci.sh \
            scripts/test-github-branch-hygiene.sh \
            scripts/test-repository-hygiene.sh \
            .github/workflows/cleanup-merged-branch.yml \
            .github/workflows/release.yml \
            .github/workflows/release-trigger.yml
          do
            test -f "${file}" || {
              echo "Missing required file: ${file}"
              exit 1
            }
          done

          for file in \
            scripts/build-pkg.sh \
            scripts/test-strategy-lab-python-foundation.sh \
            scripts/test-strategy-lab-python-state-persistence.sh \
            scripts/test-strategy-lab-python-probes.sh \
            scripts/test-strategy-lab-python-candidate-spec.sh \
            scripts/test-strategy-lab-python-adaptive-planner.sh \
            scripts/test-release-trigger.sh \
            scripts/test-package-lifecycle-restart.sh \
            scripts/test-diagnostics-guidance-localization.sh \
            scripts/test-freebsd15-package-ci.sh \
            scripts/test-github-branch-hygiene.sh \
            scripts/test-repository-hygiene.sh
          do
            test -x "${file}" || {
              echo "Required executable is not executable: ${file}"
              exit 1
            }
          done

      - name: Check repository independence
        run: |
          set -eu

          # Check shipped code and build tooling, not the technical source
          # citations in docs/ or attribution/legal/history records.
          if grep -RniE \
            'github\.com/ugorur/os-zapret2|mail@ugorur|os-zapret2-[0-9]|pkg delete os-zapret2([^_-]|$)' \
            src pkg scripts repository
          then
            echo "Legacy project dependency found in executable/package paths"
            exit 1
          fi

  package:
    name: Build FreeBSD 15 package
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    needs: [changes, validate]

    steps:
      - uses: actions/checkout@v6

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_VALUE=$(tr -d '[:space:]' < VERSION)
          REVISION=$(sed -n 's/^PLUGIN_REVISION=[[:space:]]*//p' Makefile | head -1)

          if [[ -n "${REVISION}" && "${REVISION}" != "0" ]]; then
            FULL_VERSION="${VERSION_VALUE}_${REVISION}"
          else
            FULL_VERSION="${VERSION_VALUE}"
          fi

          echo "version=${FULL_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build package inside FreeBSD 15 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          prepare: pkg install -y jq python313 gmake pkgconf luajit git
          run: |
            test "$(freebsd-version -u | cut -d. -f1)" = "15"
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-foundation.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-state-persistence.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-orchestration.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-probes.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-candidate-spec.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-candidate-family.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-search-graph.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-adaptive-planner.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-search-extended.sh
            /usr/local/bin/python3.13 scripts/test-voice-ipfw-adapter.py
            /usr/local/bin/python3.13 scripts/test-voice-live-inspect.py
            /usr/local/bin/python3.13 scripts/test-voice-generator-interop.py
            /usr/local/bin/python3.13 scripts/test-voice-common-runtime.py
            /usr/local/bin/python3.13 scripts/test-voice-native-build-wire.py
            /usr/local/bin/python3.13 scripts/test-voice-native-lifecycle-router.py
            sh scripts/test-voice-atomic-rollback-preflight.sh
            /usr/local/bin/python3.13 scripts/test-ipset-policy.py
            /usr/local/bin/python3.13 scripts/test-voice-targets-integration.py
            sh scripts/build-pkg.sh
            sh scripts/test-private-curl-native-ech.sh

      - name: Inspect built FreeBSD 15 package
        run: |
          set -eu
          contents=$(mktemp)
          manifest=$(mktemp)
          trap 'rm -f "${contents}" "${manifest}"' EXIT

          ls -lh dist/
          tar -tf dist/*.pkg > "${contents}"
          head -30 "${contents}"
          if grep -Eq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_native_((prepare|apply)_route|forward_apply|forward_stage_prepare|previous_evidence_prepare|initial_ipfw_seed|forward_prepare|forward_ipfw|forward_supervisor|candidate_engine_start|forward_stop)[.]py$' "${contents}"; then
            echo "ERROR: retired private Voice backend leaked into installable FreeBSD package" >&2
            exit 1
          fi
          if grep -Eq 'usr/local/opnsense/scripts/OPNsense/Zapret/voice_native_(render_saved|build_release)[.]sh$' "${contents}"; then
            echo "ERROR: retired operator Voice workers leaked into FreeBSD package" >&2
            exit 1
          fi
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_python_launcher.sh' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_python.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/compat.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/state.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/orchestrator.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/request.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/probe.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/endpoint_epoch.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/telemetry.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/resources.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/candidate_spec.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/candidate.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/family.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/search_graph.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/search.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/extended.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_candidate_adapter.sh' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_stage_adapter.sh' "${contents}"
          if grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/telegram_voice.sh' "${contents}"; then
            echo "ERROR: retired Telegram Phase-B PoC shipped in package" >&2
            exit 1
          fi
          # The old cutover-only process actuator has no shared Apply caller.
          if grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_native_process_lifecycle.sh' "${contents}"; then
            echo "ERROR: retired private Voice process actuator shipped in package" >&2
            exit 1
          fi
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_ipfw_adapter.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_live_inspect.py' "${contents}"
          # Retired Telegram PoC executors, cutover journals and private
          # five-resource backup paths must never return to the FreeBSD package.
          if grep -Eq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/(voice_cutover_|voice_ipfw_runtime[.]py$|voice_native_(boot_recovery_review|five_resource_recovery|recovery_quiescence|forward_runtime|process_actions|process_probe|kernel_argv|live_preflight|file_observer|full_observer)[.]py$)' "${contents}"; then
            echo "ERROR: retired Telegram PoC private backend leaked into FreeBSD package" >&2
            exit 1
          fi
          if grep -Eq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/(voice_native_legacy_[A-Za-z_]+|voice_migration_plan)[.]py$' "${contents}"; then
            echo "ERROR: retired Telegram PoC migration/rollback leaked into FreeBSD package" >&2
            exit 1
          fi
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_release_stage.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_profile_compiler.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_capture_plan.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_traffic_merge.py' "${contents}"
          # Validate the installed paths, not only the git/source tree.
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          extracted=$(mktemp -d)
          trap 'rm -f "${contents}" "${manifest}"; rm -rf "${extracted}"' EXIT
          tar -xf dist/*.pkg -C "${extracted}"
          php scripts/test-voice-ui-route.php "${extracted}/usr/local/opnsense"
          tar -xOf dist/*.pkg +MANIFEST > "${manifest}"
          jq -e '.abi == "FreeBSD:15:amd64" and .arch == "freebsd:15:x86:64" and .deps.python313.origin == "lang/python313" and (.deps | has("php85-posix") | not)' "${manifest}" >/dev/null
          head -80 "${manifest}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: os-zapret2-restyle-${{ steps.version.outputs.version }}
          path: dist/os-zapret2-restyle-*.pkg
          if-no-files-found: error

  main-integrity:
    name: Verify main integrity
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check committed diff, title identity, and core identity
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            git diff --check "${BEFORE_SHA}" "${CURRENT_SHA}"
          fi

          VERSION_VALUE=$(tr -d '[:space:]' < VERSION)
          REVISION=$(sed -n 's/^PLUGIN_REVISION=[[:space:]]*//p' Makefile | head -1)
          [[ "${VERSION_VALUE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf '%s\n' "${REVISION}" | grep -Eq '^[0-9]+$'

          EXPECTED="v${VERSION_VALUE}"
          if [[ -n "${REVISION}" && "${REVISION}" != "0" ]]; then
            EXPECTED="${EXPECTED}_${REVISION}"
          fi

          SUBJECT=$(git show -s --format=%s "${CURRENT_SHA}")
          case "${SUBJECT}" in
            "${EXPECTED}: "*)
              echo "Main commit subject matches package candidate ${EXPECTED}."
              ;;
            *)
              echo "Invalid main commit subject: ${SUBJECT}" >&2
              echo "Required format: ${EXPECTED}: <logical change>" >&2
              exit 1
              ;;
          esac

          grep -Eq '^PLUGIN_NAME=[[:space:]]+zapret2-restyle$' Makefile
          sh -n scripts/test-github-branch-hygiene.sh
          sh scripts/test-github-branch-hygiene.sh
