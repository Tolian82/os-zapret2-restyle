name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.paths.outputs.package }}
      docs_only: ${{ steps.paths.outputs.docs_only }}
      native_wan_process: ${{ steps.paths.outputs.native_wan_process }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify repository changes
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            base_sha="${CURRENT_SHA}^"
            head_sha="${CURRENT_SHA}"
          else
            base_sha="${PUSH_BEFORE_SHA}"
            head_sha="${CURRENT_SHA}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="${head_sha}^"
          fi

          # Fail fast on whitespace errors before expensive PR/package checks.
          git diff --check "${base_sha}" "${head_sha}"
          changed=$(git diff --name-only "${base_sha}" "${head_sha}")
          printf '%s\n' "${changed}"

          # Every main revision edits Makefile. Treat its sole revision bump
          # as metadata, without hiding any other Makefile/packaged-source edit.
          classified_changed="${changed}"
          if printf '%s\n' "${changed}" | grep -Fxq 'Makefile'; then
            old_makefile=$(git show "${base_sha}:Makefile" | sed -E 's/^(PLUGIN_REVISION=)[[:space:]]*[0-9]+$/\1 __REVISION__/')
            new_makefile=$(git show "${head_sha}:Makefile" | sed -E 's/^(PLUGIN_REVISION=)[[:space:]]*[0-9]+$/\1 __REVISION__/')
            if [[ "${old_makefile}" == "${new_makefile}" ]]; then
              classified_changed=$(printf '%s\n' "${changed}" | grep -Fxv 'Makefile' || true)
            fi
          fi

          docs_only=false
          if [[ "${EVENT_NAME}" != "workflow_dispatch" && -n "${changed}" ]]; then
            non_docs=$(printf '%s\n' "${classified_changed}" | grep -Ev '^(AGENTS\.md|README\.md|docs/.*\.md)$' || true)
            if [[ -z "${non_docs}" ]]; then
              docs_only=true
            fi
          fi

          package=false
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            package=true
          elif printf '%s\n' "${classified_changed}" | grep -Eq '^(\.github/workflows/ci\.yml$|VERSION$|Makefile$|pkg/|src/|repository/|scripts/build-pkg\.sh$|scripts/test-freebsd15-package-ci\.sh$)'; then
            package=true
          fi

          # Native engine Exclude proof changes require the REAL FreeBSD VM,
          # even when only a non-packaged regression script changes.
          native_wan_process=false
          if printf '%s\n' "${changed}" | grep -Eq '^(scripts/test-freebsd15-native-wan-process-continuity[.]py|scripts/stage5-wan-baseline-capture[.]py|scripts/test-freebsd15-native-engine-exclude[.]py|scripts/test-freebsd15-native-strategy-mutation[.]py|scripts/test-freebsd15-native-tls-strategy[.]py|scripts/test-freebsd15-native-tls-fake[.]py|scripts/test-freebsd15-native-tls-process-identity[.]py)$'; then
            native_wan_process=true
          fi
          echo "native_wan_process=${native_wan_process}" >> "${GITHUB_OUTPUT}"
          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
          echo "package=${package}" >> "${GITHUB_OUTPUT}"

  stage0-package-baseline:
    name: Stage 0 published old-package archive baseline
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate archive inspector and its negative/positive contract fixtures
        run: |
          python3.13 -m py_compile scripts/stage0-published-package-audit.py scripts/test-stage0-published-package-audit.py
          python3.13 scripts/test-stage0-published-package-audit.py
          python3.13 -m py_compile scripts/stage0-private-elf-audit.py scripts/test-stage0-private-elf-audit.py
          python3.13 scripts/test-stage0-private-elf-audit.py
      - name: Obtain exact historical GitHub assets and required archive decompressor
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y zstd
          fi
          mkdir -p "${RUNNER_TEMP}/stage0-packages"
          cd "${RUNNER_TEMP}/stage0-packages"
          curl -fL --retry 3 --retry-delay 2 -sS \
            https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.1_30/os-zapret2-restyle-0.6.1_30.pkg \
            -o os-zapret2-restyle-0.6.1_30.pkg
          curl -fL --retry 3 --retry-delay 2 -sS \
            https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg \
            -o os-zapret2-restyle-0.6.2_1.pkg
          printf '%s\n' \
            'f14be8fa63ee51dfd3fa9c3bbdcb340bde2945fddff61bd278aa54a87d97826d  os-zapret2-restyle-0.6.1_30.pkg' \
            '1e21fbcac847529b94fea940241b4da7f86a42d33c129b7003ad04a72f4e5a0f  os-zapret2-restyle-0.6.2_1.pkg' \
            | sha256sum --check
      - name: Compare owner-observed predecessor and published stable baseline archives
        shell: bash
        run: |
          set -euo pipefail
          python3.13 scripts/stage0-published-package-audit.py \
            --package "${RUNNER_TEMP}/stage0-packages/os-zapret2-restyle-0.6.1_30.pkg" \
            --expected-version '0.6.1_30' \
            --expected-sha256 f14be8fa63ee51dfd3fa9c3bbdcb340bde2945fddff61bd278aa54a87d97826d \
            --json "${RUNNER_TEMP}/stage0-installed-predecessor-0.6.1_30.json"
          python3.13 scripts/stage0-published-package-audit.py \
            --package "${RUNNER_TEMP}/stage0-packages/os-zapret2-restyle-0.6.2_1.pkg" \
            --expected-version '0.6.2_1' \
            --expected-sha256 1e21fbcac847529b94fea940241b4da7f86a42d33c129b7003ad04a72f4e5a0f \
            --json "${RUNNER_TEMP}/stage0-stable-0.6.2_1.json"
      - name: Verify static private ELF loader and DT_NEEDED from both published old packages
        shell: bash
        run: |
          set -euo pipefail
          command -v readelf
          python3.13 scripts/stage0-private-elf-audit.py \
            --package "${RUNNER_TEMP}/stage0-packages/os-zapret2-restyle-0.6.1_30.pkg" \
            --expected-package-sha256 f14be8fa63ee51dfd3fa9c3bbdcb340bde2945fddff61bd278aa54a87d97826d \
            --expected-elf-sha256 e4af7ba05b6ad8dd997aefeae3a9c15a08be2700534d043cd93c7987f97c451f \
            --json "${RUNNER_TEMP}/stage0-private-elf-0.6.1_30.json"
          python3.13 scripts/stage0-private-elf-audit.py \
            --package "${RUNNER_TEMP}/stage0-packages/os-zapret2-restyle-0.6.2_1.pkg" \
            --expected-package-sha256 1e21fbcac847529b94fea940241b4da7f86a42d33c129b7003ad04a72f4e5a0f \
            --expected-elf-sha256 e4af7ba05b6ad8dd997aefeae3a9c15a08be2700534d043cd93c7987f97c451f \
            --json "${RUNNER_TEMP}/stage0-private-elf-0.6.2_1.json"
      - name: Upload read-only old-package manifest and file/mode/hook evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage0-old-package-baseline-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/stage0-installed-predecessor-0.6.1_30.json
            ${{ runner.temp }}/stage0-stable-0.6.2_1.json
            ${{ runner.temp }}/stage0-private-elf-0.6.1_30.json
            ${{ runner.temp }}/stage0-private-elf-0.6.2_1.json
          if-no-files-found: error
          retention-days: 30

  stage0-source-audit:
    name: Stage 0 exact-head read-only source inventory
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate Stage 0 audit parser and CLI on a real fixture Git index
        run: |
          python3.13 -m py_compile scripts/stage0-source-audit.py scripts/test-stage0-source-audit.py
          python3.13 scripts/test-stage0-source-audit.py
      - name: Validate exact configd actions and PHP caller inventory with negative Git fixture tests
        run: |
          python3.13 -m py_compile scripts/stage0-configd-callpath-audit.py scripts/test-stage0-configd-callpath-audit.py
          python3.13 scripts/test-stage0-configd-callpath-audit.py
      - name: Test legacy FreeBSD.conf read-only ownership-refusal scenarios
        run: |
          python3.13 -m py_compile scripts/stage0-legacy-repo-ownership.py scripts/test-stage0-legacy-repo-ownership.py
          python3.13 scripts/test-stage0-legacy-repo-ownership.py -v
      - name: Preflight read-only OPNsense target witness without appliance
        run: sh scripts/test-stage0-target-opnsense-readonly.sh
      - name: Record full tracked path/mode/blob and active path/line evidence
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3.13 scripts/stage0-source-audit.py \
            --expected-head "${EXPECTED_HEAD}" \
            --json "${RUNNER_TEMP}/stage0-source-inventory.json" \
            --markdown "${RUNNER_TEMP}/stage0-source-inventory.md"
      - name: Report exact-head configd direct entrypoints and PHP caller references
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3.13 scripts/stage0-configd-callpath-audit.py \
            --expected-head "${EXPECTED_HEAD}" \
            --json "${RUNNER_TEMP}/stage0-configd-callpath.json" \
            --markdown "${RUNNER_TEMP}/stage0-configd-callpath.md"
      - name: Preserve read-only source inventory artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage0-source-inventory-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/stage0-source-inventory.json
            ${{ runner.temp }}/stage0-source-inventory.md
            ${{ runner.temp }}/stage0-configd-callpath.json
            ${{ runner.temp }}/stage0-configd-callpath.md
          if-no-files-found: error
          retention-days: 30

  validate-docs:
    name: Validate documentation
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python for documentation checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check handoff identity on documentation changes
        run: python3.13 scripts/test-current-handoff-identity.py

      - name: Validate documentation-governance scripts
        run: |
          sh -n scripts/test-release-trigger.sh
          sh -n scripts/test-github-branch-hygiene.sh
          sh -n scripts/test-repository-hygiene.sh

      - name: Test automated release trigger contract
        run: sh scripts/test-release-trigger.sh

      - name: Test GitHub delivery governance
        run: sh scripts/test-github-branch-hygiene.sh

      - name: Test repository documentation integrity
        run: sh scripts/test-repository-hygiene.sh

  voice-contract:
    name: Validate Voice candidates
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Stage 5 installed OPNsense one-shot read-only eligibility preflight
        run: |
          python3.13 -m py_compile scripts/stage5-installed-evidence.py scripts/test-stage5-installed-evidence.py scripts/stage5-installed-one-shot.py scripts/test-stage5-installed-one-shot.py
          python3.13 scripts/test-stage5-installed-evidence.py
          python3.13 scripts/test-stage5-installed-one-shot.py
      - name: Stage 5 read-only WAN target selector and evidence boundary
        run: |
          python3.13 -m py_compile scripts/stage5-wan-target-preflight.py scripts/test-stage5-wan-target-preflight.py
          python3.13 scripts/test-stage5-wan-target-preflight.py
      - name: Stage 5 TLS Phase-A offline configured Lua action signatures
        run: |
          python3.13 -m py_compile scripts/stage5-tls-profile-signature.py scripts/test-stage5-tls-profile-signature.py scripts/stage5-tls-phase-a-offline.py scripts/test-stage5-tls-phase-a-offline.py
          python3.13 scripts/test-stage5-tls-profile-signature.py
          python3.13 scripts/test-stage5-tls-phase-a-offline.py
      - name: Stage 5 offline WAN TCP PCAP attribution, both IP families
        run: |
          python3.13 -m py_compile scripts/stage5-wan-pcap-attribution.py scripts/test-stage5-wan-pcap-attribution.py
          python3.13 scripts/test-stage5-wan-pcap-attribution.py
      - name: Stage 5 offline review of one already-retained baseline PCAP
        run: |
          python3.13 -m py_compile scripts/stage5-wan-baseline-offline-review.py scripts/test-stage5-wan-baseline-offline-review.py
          python3.13 scripts/test-stage5-wan-baseline-offline-review.py
      - name: Stage 5 non-executing WAN acquisition plan, both IP families
        run: |
          python3.13 -m py_compile scripts/stage5-wan-acquisition-plan.py scripts/test-stage5-wan-acquisition-plan.py
          python3.13 scripts/test-stage5-wan-acquisition-plan.py
      - name: Stage 5 consent-gated baseline WAN capture lifecycle
        run: |
          python3.13 -m py_compile scripts/stage5-wan-baseline-capture.py scripts/test-stage5-wan-baseline-capture.py
          python3.13 scripts/test-stage5-wan-baseline-capture.py
      - name: Python 3.11 Stage 5 installed diagnostic compatibility
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Execute read-only Stage 5 diagnostic contracts under Python 3.11
        run: |
          python3.11 -m py_compile scripts/stage5-installed-evidence.py scripts/stage5-wan-target-preflight.py scripts/stage5-wan-acquisition-plan.py scripts/stage5-wan-baseline-capture.py scripts/stage5-wan-pcap-attribution.py src/opnsense/scripts/OPNsense/Zapret/backend/voice_live_inspect.py
          python3.11 scripts/test-stage5-installed-evidence.py
          python3.11 scripts/test-stage5-wan-target-preflight.py
          python3.11 scripts/test-stage5-wan-acquisition-plan.py
          python3.11 scripts/test-stage5-wan-baseline-capture.py
          python3.11 -m py_compile scripts/stage5-wan-baseline-offline-review.py scripts/test-stage5-wan-baseline-offline-review.py
          python3.11 scripts/test-stage5-wan-baseline-offline-review.py
      - name: Validate Voice shell and Python syntax
        run: |
          sh -n scripts/test-voice-shared-ipsets.sh
          python3.13 -m py_compile src/opnsense/scripts/OPNsense/Zapret/backend/voice_profile_compiler.py
          python3.13 -m py_compile scripts/test-voice-profile-compiler.py
      - name: Stage 1 dual-stack IPSET compiler and full-family guards
        run: |
          python3.13 -m py_compile src/opnsense/scripts/OPNsense/Zapret/backend/ipset_policy.py
          python3.13 scripts/test-ipset-policy.py
      - name: Stage 3 global exclusions across final native profiles
        run: |
          python3.13 -m py_compile src/opnsense/scripts/OPNsense/Zapret/backend/global_exclusions.py
          python3.13 scripts/test-global-exclusions.py
      - name: Isolated real-engine Exclude IPSet generator rehearsal
        run: |
          python3.13 -m py_compile scripts/test-freebsd15-native-engine-exclude.py scripts/test-freebsd15-native-strategy-mutation.py scripts/test-freebsd15-native-tls-strategy.py scripts/test-freebsd15-native-tls-fake.py
          python3.13 -m py_compile scripts/test-freebsd15-native-strategy-lab-ipfw.py
          python3.13 scripts/test-freebsd15-native-strategy-lab-ipfw.py --static
          python3.13 -m py_compile scripts/owner-batch-readonly-v0.6.1_30.py
          python3.13 -m py_compile scripts/test-freebsd15-stage6-three-acceptance.py scripts/test-freebsd15-native-strategy-lab-engine.py
          python3.13 scripts/test-freebsd15-native-strategy-lab-engine.py --static
          python3.13 scripts/test-freebsd15-native-engine-exclude.py --static
          python3.13 scripts/test-freebsd15-native-strategy-mutation.py --static
          python3.13 scripts/test-freebsd15-native-tls-strategy.py --static
          python3.13 scripts/test-freebsd15-native-tls-fake.py --static
          python3.13 -m py_compile scripts/test-freebsd15-native-tls-process-identity.py
          python3.13 scripts/test-freebsd15-native-tls-process-identity.py --static
      - name: Voice shared IPv4 targets
        run: sh scripts/test-voice-shared-ipsets.sh

      - name: Validate dvtws2 process census before shared Apply
        run: sh scripts/test-voice-common-engine-census.sh
      - name: Shared runtime activation and rollback
        run: sh scripts/test-voice-common-apply-runtime.sh
      - name: Voice fail-closed compiler
        run: python3.13 scripts/test-voice-profile-compiler.py
      - name: Voice destination-scoped IPFW capture planning
        run: python3.13 scripts/test-voice-capture-plan.py
      - name: Stage 4 existing Voice dual-stack boundary contracts
        run: |
          python3.13 -m py_compile src/opnsense/scripts/OPNsense/Zapret/backend/voice_profile_compiler.py src/opnsense/scripts/OPNsense/Zapret/backend/voice_capture_plan.py src/opnsense/scripts/OPNsense/Zapret/backend/voice_traffic_merge.py src/opnsense/scripts/OPNsense/Zapret/backend/voice_release_stage.py
          python3.13 scripts/test-voice-dualstack-ipset-boundaries.py
      - name: Persisted Voice model to candidate and capture plan
        run: python3.13 scripts/test-voice-model-export.py
      - name: Voice inactive staging with managed IPSET and resolved WAN
        run: python3.13 scripts/test-voice-release-stage.py
      - name: Real orchestrator native Voice candidate build
        run: python3.13 scripts/test-voice-native-build-wire.py
      - name: First common Voice Apply from running legacy Strategies
        run: python3.13 scripts/test-voice-first-common-handoff.py
      - name: First common Apply shell preflight ownership
        run: sh scripts/test-voice-first-common-entry.sh
      - name: Native Voice engine --dry-run in private FD9 runtime workspace
        run: python3.13 scripts/test-voice-engine-private-dryrun.py
      - name: Voice staged candidate into native dvtws2 arguments and IPFW plan
        run: python3.13 scripts/test-voice-generator-interop.py
      - name: Native Voice saved Config and journal lifecycle router (read-only)
        run: python3.13 scripts/test-voice-native-lifecycle-router.py
      - name: Native Voice operator-only PREPARED Apply routing
        run: python3.13 scripts/test-voice-native-apply-route.py
      - name: Native Voice saved XML and rendered OPNsense template generation parity
        run: python3.13 scripts/test-voice-native-saved-pair-guard.py
      - name: Native Voice saved GUI OFF draft root-only Config candidate under FD9
        run: python3.13 scripts/test-voice-native-saved-draft-candidate.py
      - name: Native Voice saved GUI read-only FD9 preflight contract
        run: python3.13 scripts/test-voice-native-draft-preview-route.py
      - name: Voice non-destructive atomic runtime rollback preflight
        run: sh scripts/test-voice-atomic-rollback-preflight.sh
      - name: Voice IPSET integration with shared production Targets normalizer
        run: python3.13 scripts/test-voice-targets-integration.py
      - name: Voice and ordinary single-engine traffic merging
        run: python3.13 scripts/test-voice-traffic-merge.py
      - name: Shared Voice and Strategies full runtime candidate
        run: python3.13 scripts/test-voice-common-runtime.py
      - name: Voice owned IPFW transaction and rollback simulation
        run: python3.13 scripts/test-voice-firewall-transaction.py
      - name: Stage 5 native dual-stack IPFW ownership and rollback
        run: |
          python3.13 -m py_compile src/opnsense/scripts/OPNsense/Zapret/backend/voice_ipfw_adapter.py src/opnsense/scripts/OPNsense/Zapret/backend/voice_firewall_transaction.py
          python3.13 scripts/test-dualstack-ipfw.py
      - name: FreeBSD IPFW adapter exact argv and parsing contract
        run: python3.13 scripts/test-voice-ipfw-adapter.py
      - name: Voice native saved-ON staging guard
        run: sh scripts/test-voice-staged-runtime-guard.sh
      - name: Voice read-only live IPFW ownership inspector
        run: python3.13 scripts/test-voice-live-inspect.py
      - name: Voice saved Config and five-profile GUI status API
        run: php scripts/test-voice-inspect-config-runtime.php
      - name: Voice one-engine five-profile runtime attestation
        run: python3.13 scripts/test-voice-common-engine-status.py
      - name: Interrupted native Config-saved cold recovery and refusal matrix
        run: sh scripts/test-shared-apply-saved-recovery.sh
      - name: Interrupted ACTIVATED staged IPFW rollback through common backend
        run: sh scripts/test-shared-apply-activated-staged.sh
      - name: Original FD9 shared native stop and restart contract
        run: sh scripts/test-shared-apply-stop.sh
      - name: "Common committed native reboot: Config/runtime/IPFW startup"
        run: sh scripts/test-shared-apply-boot.sh
      - name: Shared runtime candidate bundle content seal and crash refusal
        run: python3.13 scripts/test-shared-apply-seal.py
      - name: Single native Voice and Strategies Apply through existing configd action
        run: sh scripts/test-shared-apply-run.sh
      - name: Validate GitHub workflow step name quoting
        run: |
          python3.13 - <<'PY'
          from pathlib import Path
          import re
          for flow in Path('.github/workflows').glob('*.yml'):
              for number, line in enumerate(flow.read_text().splitlines(), 1):
                  if re.match(r'^\s*- name: [^"\x27].*:\s', line):
                      raise SystemExit(f'{flow}:{number}: quote name with colon')
          PY
      - name: Shared FD9 native Config/runtime transaction fault matrix
        run: sh scripts/test-shared-apply-execute.sh
      - name: Native detached OPNsense templates for full shared candidate
        run: python3.13 scripts/test-shared-apply-render.py
      - name: Shared FD9 Apply operation record and lifecycle guard
        run: python3.13 scripts/test-shared-apply-operation.py
      - name: Reviewed first Voice handoff attestation refuses unsafe old ownership
        run: sh scripts/test-shared-apply-reviewed-legacy.sh
      - name: Voice GUI model and localization contract
        run: python3.13 scripts/test-voice-gui-contract.py
      - name: OPNsense 26.7 real Voice UI Router and missing-handler regression
        run: php scripts/test-voice-ui-route.php src/opnsense

  validate:
    name: Validate Project
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    needs: changes
    env:
      STRATEGY_LAB_PYTHON_BIN: python3.13

    steps:
      - uses: actions/checkout@v6

      - name: Set up Strategy Lab Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Parse production-rendered Zapret shell before costly validation
        run: |
          python3.13 -m pip install --disable-pip-version-check 'Jinja2==3.1.6'
          python3.13 -m py_compile scripts/test-native-template-heredoc.py
          python3.13 scripts/test-native-template-heredoc.py

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils php-cli

      - name: Regression test prospective revision-governance gate
        run: bash scripts/test-pr-revision-policy.sh
