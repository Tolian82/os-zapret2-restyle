name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.paths.outputs.package }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect packaged-plugin changes
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            base_sha="${CURRENT_SHA}^"
            head_sha="${CURRENT_SHA}"
          else
            base_sha="${PUSH_BEFORE_SHA}"
            head_sha="${CURRENT_SHA}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="${head_sha}^"
          fi

          changed=$(git diff --name-only "${base_sha}" "${head_sha}")
          printf '%s\n' "${changed}"

          package=false
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            package=true
          elif printf '%s\n' "${changed}" | grep -Eq '^(\.github/workflows/ci\.yml$|VERSION$|Makefile$|pkg/|src/|repository/|scripts/build-pkg\.sh$|scripts/test-freebsd15-package-ci\.sh$)'; then
            package=true
          fi

          echo "package=${package}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Validate Project
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: changes
    env:
      STRATEGY_LAB_PYTHON_BIN: python3.13

    steps:
      - uses: actions/checkout@v6

      - name: Set up Strategy Lab Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate project identity and version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_VALUE=$(tr -d '[:space:]' < VERSION)
          [[ "${VERSION_VALUE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid VERSION: ${VERSION_VALUE}"
            exit 1
          }

          grep -Eq '^PLUGIN_NAME=[[:space:]]+zapret2-restyle$' Makefile
          grep -Eq '^PLUGIN_VERSION!=[[:space:]]+/bin/cat \$\{\.CURDIR\}/VERSION$' Makefile
          grep -Eq '^PLUGIN_MAINTAINER=[[:space:]]+tolian82IPB@gmail\.com$' Makefile

          echo "Project: os-zapret2-restyle"
          echo "Package: os-zapret2-restyle"
          echo "Internal service: zapret"
          echo "Version: ${VERSION_VALUE}"

      - name: Validate XML files
        run: find src -type f -name "*.xml" -exec xmllint --noout {} \;

      - name: Lint PHP files
        run: |
          docker run --rm -v "${PWD}":/app -w /app php:8.2-cli sh -c '
            set -e
            find src -type f -name "*.php" -exec php -l {} \;
            find src -type f -name "*.inc" -exec php -l {} \;
          '

      - name: Validate shell scripts
        run: |
          find src -type f -name "*.sh" -exec sh -n {} \;
          find pkg -type f -exec sh -n {} \;
          find scripts -type f -name "*.sh" -exec sh -n {} \;
          sh -n src/etc/rc.syshook.d/start/20-zapret
          sh -n src/etc/rc.syshook.d/stop/20-zapret

      - name: Test Strategy Lab Python foundation
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-foundation.sh

      - name: Test Strategy Lab Python state persistence
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-state-persistence.sh

      - name: Test Strategy Lab Python orchestration
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-orchestration.sh

      - name: Test Strategy Lab Python request and probe execution
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-probes.sh

      - name: Test Strategy Lab Python candidate and family screening
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-candidate-family.sh

      - name: Test Strategy Lab Python CandidateSpec and ResourceInventory
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-candidate-spec.sh

      - name: Test Strategy Lab native Zapret2 search graph
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-search-graph.sh

      - name: Test Strategy Lab Python search and extended orchestration
        run: STRATEGY_LAB_TEST_PYTHON=python3.13 sh scripts/test-strategy-lab-python-search-extended.sh

      - name: Test runtime profile normalization
        run: sh scripts/test-profile-normalizer.sh

      - name: Test count-carrying profile pipeline
        run: sh scripts/test-profile-pipeline.sh

      - name: Test configuration activation contract
        run: sh scripts/test-config-activation-contract.sh

      - name: Test Strategy Lab corrective matrix
        run: sh scripts/test-strategy-lab-corrective-matrix.sh

      - name: Test diagnostics guidance localization
        run: sh scripts/test-diagnostics-guidance-localization.sh

      - name: Test lifecycle lock descriptor isolation
        run: sh scripts/test-lifecycle-lock-fd.sh

      - name: Test package lifecycle service refresh
        run: sh scripts/test-package-lifecycle-restart.sh

      - name: Test setup release selection
        run: sh scripts/test-setup-release-selection.sh

      - name: Test GUI runtime management
        run: sh scripts/test-gui-runtime-management.sh

      - name: Test automated release trigger contract
        run: sh scripts/test-release-trigger.sh

      - name: Test Node 24 release actions
        run: sh scripts/test-release-node24-actions.sh

      - name: Test FreeBSD 15 package CI contract
        run: sh scripts/test-freebsd15-package-ci.sh

      - name: Test GitHub delivery governance
        run: sh scripts/test-github-branch-hygiene.sh

      - name: Test repository artifact hygiene
        run: sh scripts/test-repository-hygiene.sh

      - name: Check required project files
        run: |
          set -eu

          for file in \
            AGENTS.md \
            VERSION \
            Makefile \
            pkg-descr \
            LICENSE \
            NOTICE \
            README.md \
            docs/CHANGELOG.md \
            docs/REQUIREMENTS.md \
            docs/ARCHITECTURE.md \
            docs/DEVLOG.md \
            docs/GITHUB_PUBLICATION.md \
            docs/decisions/DEC-2026-08-05-efficient-github-delivery.md \
            docs/decisions/DEC-2026-08-05-universal-versioned-github-titles.md \
            docs/devlog/2026-08-05-universal-versioned-github-titles.md \
            docs/patches/v0.3.2_2.md \
            docs/patches/v0.3.2_3.md \
            docs/devlog/2026-08-04-blockcheck-guidance-localization.md \
            src/etc/rc.syshook.d/start/20-zapret \
            src/etc/rc.syshook.d/stop/20-zapret \
            src/etc/inc/plugins.inc.d/zapret.inc \
            src/opnsense/service/conf/actions.d/actions_zapret.conf \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/request.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/probe.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/resources.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/candidate_spec.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/candidate.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/family.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/search_graph.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/search.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/extended.py \
            src/opnsense/scripts/OPNsense/Zapret/strategy_lab_candidate_adapter.sh \
            pkg/+PRE_INSTALL \
            pkg/+POST_INSTALL \
            pkg/+PRE_DEINSTALL \
            pkg/+POST_DEINSTALL \
            scripts/build-pkg.sh \
            scripts/test-domain-diagnostics-contract.sh \
            scripts/test-strategy-lab-corrective-matrix.sh \
            scripts/test-strategy-lab-corrective-matrix-contract.sh \
            scripts/test-strategy-lab-python-foundation.sh \
            scripts/test-strategy-lab-python-state-persistence.sh \
            scripts/test-strategy-lab-python-orchestration.sh \
            scripts/test-strategy-lab-python-probes.sh \
            scripts/test-strategy-lab-python-candidate-spec.sh \
            scripts/test-strategy-lab-python-candidate-family.sh \
            scripts/test-strategy-lab-python-search-graph.sh \
            scripts/test-strategy-lab-python-search-extended.sh \
            scripts/test-diagnostics-guidance-localization.sh \
            scripts/test-package-lifecycle-restart.sh \
            scripts/test-setup-release-selection.sh \
            scripts/test-gui-runtime-management.sh \
            scripts/test-release-trigger.sh \
            scripts/test-release-node24-actions.sh \
            scripts/test-freebsd15-package-ci.sh \
            scripts/test-github-branch-hygiene.sh \
            scripts/test-repository-hygiene.sh \
            .github/workflows/cleanup-merged-branch.yml \
            .github/workflows/release.yml \
            .github/workflows/release-trigger.yml
          do
            test -f "${file}" || {
              echo "Missing required file: ${file}"
              exit 1
            }
          done

          for file in \
            scripts/build-pkg.sh \
            scripts/test-strategy-lab-python-foundation.sh \
            scripts/test-strategy-lab-python-state-persistence.sh \
            scripts/test-strategy-lab-python-probes.sh \
            scripts/test-strategy-lab-python-candidate-spec.sh \
            scripts/test-release-trigger.sh \
            scripts/test-package-lifecycle-restart.sh \
            scripts/test-diagnostics-guidance-localization.sh \
            scripts/test-freebsd15-package-ci.sh \
            scripts/test-github-branch-hygiene.sh \
            scripts/test-repository-hygiene.sh
          do
            test -x "${file}" || {
              echo "Required executable is not executable: ${file}"
              exit 1
            }
          done

      - name: Check repository independence
        run: |
          set -eu

          if grep -RniE \
            'github\.com/ugorur/os-zapret2|mail@ugorur|os-zapret2-[0-9]|pkg delete os-zapret2([^_-]|$)' \
            . \
            --exclude-dir=.git \
            --exclude=LICENSE \
            --exclude=NOTICE \
            --exclude=README.md \
            --exclude=ci.yml
          then
            echo "Legacy project reference found outside attribution files"
            exit 1
          fi

  package:
    name: Build FreeBSD 15 package
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    needs: [changes, validate]

    steps:
      - uses: actions/checkout@v6

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_VALUE=$(tr -d '[:space:]' < VERSION)
          REVISION=$(sed -n 's/^PLUGIN_REVISION=[[:space:]]*//p' Makefile | head -1)

          if [[ -n "${REVISION}" && "${REVISION}" != "0" ]]; then
            FULL_VERSION="${VERSION_VALUE}_${REVISION}"
          else
            FULL_VERSION="${VERSION_VALUE}"
          fi

          echo "version=${FULL_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build package inside FreeBSD 15 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          prepare: pkg install -y jq python313
          run: |
            test "$(freebsd-version -u | cut -d. -f1)" = "15"
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-foundation.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-state-persistence.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-orchestration.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-probes.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-candidate-spec.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-candidate-family.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-search-graph.sh
            STRATEGY_LAB_TEST_PYTHON=/usr/local/bin/python3.13 sh scripts/test-strategy-lab-python-search-extended.sh
            sh scripts/build-pkg.sh

      - name: Inspect built FreeBSD 15 package
        run: |
          set -eu
          contents=$(mktemp)
          manifest=$(mktemp)
          trap 'rm -f "${contents}" "${manifest}"' EXIT

          ls -lh dist/
          tar -tf dist/*.pkg > "${contents}"
          head -30 "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_python_launcher.sh' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_python.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/compat.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/state.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/orchestrator.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/request.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/probe.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/resources.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/candidate_spec.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/candidate.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/family.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/search_graph.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/search.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_py/extended.py' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_candidate_adapter.sh' "${contents}"
          grep -Fq 'usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_stage_adapter.sh' "${contents}"
          tar -xOf dist/*.pkg +MANIFEST > "${manifest}"
          jq -e '.abi == "FreeBSD:15:amd64" and .arch == "freebsd:15:x86:64" and .deps.python313.origin == "lang/python313"' "${manifest}" >/dev/null
          head -80 "${manifest}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: os-zapret2-restyle-${{ steps.version.outputs.version }}
          path: dist/os-zapret2-restyle-*.pkg
          if-no-files-found: error

  main-integrity:
    name: Verify main integrity
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check committed diff, title identity, and core identity
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            git diff --check "${BEFORE_SHA}" "${CURRENT_SHA}"
          fi

          VERSION_VALUE=$(tr -d '[:space:]' < VERSION)
          REVISION=$(sed -n 's/^PLUGIN_REVISION=[[:space:]]*//p' Makefile | head -1)
          [[ "${VERSION_VALUE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf '%s\n' "${REVISION}" | grep -Eq '^[0-9]+$'

          EXPECTED="v${VERSION_VALUE}"
          if [[ -n "${REVISION}" && "${REVISION}" != "0" ]]; then
            EXPECTED="${EXPECTED}_${REVISION}"
          fi

          SUBJECT=$(git show -s --format=%s "${CURRENT_SHA}")
          case "${SUBJECT}" in
            "${EXPECTED}: "*)
              echo "Main commit subject matches package candidate ${EXPECTED}."
              ;;
            *)
              echo "Invalid main commit subject: ${SUBJECT}" >&2
              echo "Required format: ${EXPECTED}: <logical change>" >&2
              exit 1
              ;;
          esac

          grep -Eq '^PLUGIN_NAME=[[:space:]]+zapret2-restyle$' Makefile
          sh -n scripts/test-github-branch-hygiene.sh
          sh scripts/test-github-branch-hygiene.sh
