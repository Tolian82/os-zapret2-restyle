name: Verify v0.2.8 publication

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  verify:
    name: Verify release, repository, and annotations
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.2.8
      RELEASE_SHA: 388fbc40b74d294c2d3d91a3f62ff6bff0b254a1
      PACKAGE_NAME: os-zapret2-restyle-0.2.8_1.pkg
    steps:
      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          release_json=""
          for _attempt in $(seq 1 60); do
            if release_json=$(curl -fsSL "${auth[@]}" "${api}/releases/tags/${RELEASE_TAG}"); then
              break
            fi
            sleep 5
          done

          [ -n "${release_json}" ] || {
            echo "Release ${RELEASE_TAG} was not published" >&2
            exit 1
          }

          [ "$(jq -r '.tag_name' <<<"${release_json}")" = "${RELEASE_TAG}" ]
          [ "$(jq -r '.draft' <<<"${release_json}")" = "false" ]
          jq -e --arg asset "${PACKAGE_NAME}" '.assets | any(.name == $asset and .state == "uploaded")' <<<"${release_json}" >/dev/null
          jq -e '.assets | any(.name == "SHA256SUMS" and .state == "uploaded")' <<<"${release_json}" >/dev/null

          run_json=""
          run_id=""
          for _attempt in $(seq 1 60); do
            runs_json=$(curl -fsSL "${auth[@]}" "${api}/actions/workflows/release.yml/runs?branch=${RELEASE_TAG}&per_page=20")
            run_json=$(jq -c --arg sha "${RELEASE_SHA}" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"${runs_json}")
            if [ -n "${run_json}" ] && [ "$(jq -r '.status' <<<"${run_json}")" = "completed" ]; then
              run_id=$(jq -r '.id' <<<"${run_json}")
              break
            fi
            sleep 5
          done

          [ -n "${run_id}" ] || {
            echo "Completed Release workflow for ${RELEASE_TAG} was not found" >&2
            exit 1
          }
          [ "$(jq -r '.conclusion' <<<"${run_json}")" = "success" ]

          jobs_json=$(curl -fsSL "${auth[@]}" "${api}/actions/runs/${run_id}/jobs?per_page=100")
          jq -e '.jobs | length >= 4 and all(.conclusion == "success")' <<<"${jobs_json}" >/dev/null

          annotations_file=$(mktemp)
          jq -r '.jobs[].id' <<<"${jobs_json}" | while IFS= read -r job_id; do
            curl -fsSL "${auth[@]}" "${api}/check-runs/${job_id}/annotations?per_page=100" >>"${annotations_file}"
          done

          if grep -Eqi 'Node\.js 20 is deprecated|target Node\.js 20|forced to run on Node\.js 24' "${annotations_file}"; then
            echo "Node.js 20 deprecation annotation found in Release workflow" >&2
            cat "${annotations_file}" >&2
            exit 1
          fi

          pages_base="https://tolian82.github.io/os-zapret2-restyle/FreeBSD:15:amd64"
          curl -fsSL -o /dev/null "${pages_base}/${PACKAGE_NAME}"
          curl -fsSL -o /dev/null "${pages_base}/meta.conf"
          curl -fsSL -o /dev/null "${pages_base}/packagesite.pkg"

          echo "PASS: ${RELEASE_TAG} is published with ${PACKAGE_NAME}"
          echo "PASS: Release workflow ${run_id} completed without Node.js 20 annotations"
          echo "PASS: GitHub Pages pkg repository serves the release outputs"
