name: Apply repository hygiene patch

on:
  push:
    paths:
      - .github/workflows/apply-repository-hygiene.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/repository-hygiene
      - name: Apply and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_repository_hygiene.py
          chmod +x scripts/test-repository-hygiene.sh
          rm -f scripts/apply_repository_hygiene.py
          rm -f .github/workflows/apply-repository-hygiene.yml
          git config user.name 'Tolian82'
          git config user.email '309637356+Tolian82@users.noreply.github.com'
          git add -A
          git diff --cached --check
          sh -n scripts/test-repository-hygiene.sh
          git commit -m 'chore: enforce repository artifact hygiene'
          git push origin HEAD:agent/repository-hygiene
