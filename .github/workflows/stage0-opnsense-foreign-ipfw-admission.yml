name: Stage 0 OPNsense native foreign IPFW kernel refusal

on:
  pull_request:
    paths:
      - scripts/stage0-opnsense-foreign-ipfw-admission.py
      - scripts/test-stage0-opnsense-foreign-ipfw-admission.py
      - .github/workflows/stage0-opnsense-foreign-ipfw-admission.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-foreign-ipfw:
    name: Genuine old cold, foreign IPFW count rule, refusal before callback
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile and run 16 local contract tests
        run: |
          python3.13 -m py_compile scripts/stage0-opnsense-foreign-ipfw-admission.py scripts/test-stage0-opnsense-foreign-ipfw-admission.py
          python3.13 scripts/test-stage0-opnsense-foreign-ipfw-admission.py -v
      - name: Disposable native OPNsense 26.7 real kernel foreign count rule
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          mem: 4096
          cpu: 2
          disable-cache: true
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            /usr/local/bin/python3 scripts/stage0-opnsense-foreign-ipfw-admission.py /tmp/os-zapret2-restyle-0.6.2_1.pkg
