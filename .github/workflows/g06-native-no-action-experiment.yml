name: G06 native v1.0.7 no-action and empty-profile packet experiment

on:
  pull_request:
    paths:
      - scripts/stage2-opnsense-g06-no-action-probe.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-g06:
    name: Fast G06 scoped no-profile experiment syntax and safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify scoped native experiment contracts
        run: |
          set -eu
          python3.13 -m py_compile scripts/stage2-opnsense-g06-no-action-probe.py
          python3.13 scripts/stage2-opnsense-g06-no-action-probe.py --self-test

  native-g06:
    needs: fast-g06
    name: One native OPNsense 26.7 v1.0.7 no-profile engine + localhost payload witness
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install ONE genuine package and upstream, then test empty no-action
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          disable-cache: true
          cpu: 2
          mem: 4096
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            pkg update -f
            pkg install -y git ca_root_nss jq gmake pkgconf luajit
            GITHUB_ACTIONS=true ZAPRET2_STAGE0_DISPOSABLE_OFFICIAL_MK=1 ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_STAGE2_REAL_CLEAN_INSTALL=1 ZAPRET2_G04_DISPOSABLE_NATIVE=1 ZAPRET2_G04_RUNTIME_NATIVE=1 ZAPRET2_NATIVE_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" ZAPRET2_STAGE0_PROJECT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" /usr/local/bin/python3 scripts/stage2-opnsense-g04-native-config.py
            GITHUB_ACTIONS=true ZAPRET2_NATIVE_BUILD_CI=1 ZAPRET2_G06_NO_ACTION_NATIVE=1 /usr/local/bin/python3 scripts/stage2-opnsense-g06-no-action-probe.py
