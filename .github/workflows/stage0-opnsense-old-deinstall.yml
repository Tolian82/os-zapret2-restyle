name: Stage 0 genuine published predecessor cold deinstall on OPNsense

on:
  pull_request:
    paths:
      - scripts/stage0-opnsense-old-deinstall.py
      - scripts/test-stage0-opnsense-old-deinstall.py
      - scripts/stage0-opnsense-installed-predecessor.py
      - scripts/stage0-opnsense-old-service-fd9.py
      - .github/workflows/stage0-opnsense-old-deinstall.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-old-deinstall:
    name: Original 0.6.2_1 PRE_DEINSTALL and native pkg delete on real OPNsense
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Offline original-hook and pkg-delete refusal contracts
        run: |
          python3.13 -m py_compile scripts/stage0-opnsense-old-deinstall.py scripts/test-stage0-opnsense-old-deinstall.py
          python3.13 scripts/test-stage0-opnsense-old-deinstall.py -v
      - name: Genuine published old-package installed PRE_DEINSTALL and native delete on disposable OPNsense
        uses: vmactions/opnsense-vm@abaa977e3dbc77a0d1eeed4d82c8d9914b018235
        with:
          release: "26.7"
          sync: tar
          copyback: false
          mem: 4096
          cpu: 2
          disable-cache: true
          run: |
            set -eu
            /usr/local/bin/python3 scripts/stage0-opnsense-guest-readonly.py
            fetch -o /tmp/os-zapret2-restyle-0.6.2_1.pkg 'https://github.com/Tolian82/os-zapret2-restyle/releases/download/v0.6.2/os-zapret2-restyle-0.6.2_1.pkg'
            /usr/local/bin/python3 scripts/stage0-opnsense-installed-predecessor.py /tmp/os-zapret2-restyle-0.6.2_1.pkg
            /usr/local/bin/python3 scripts/stage0-opnsense-old-deinstall.py /tmp/os-zapret2-restyle-0.6.2_1.pkg
