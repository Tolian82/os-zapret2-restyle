[start]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh start
parameters:
type:script
message:starting zapret2
timeout:600

[stop]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh stop
parameters:
type:script
message:stopping zapret2

[restart]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh restart
parameters:
type:script
message:restarting zapret2
timeout:600

[reconfigure]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh reconfigure
parameters:
type:script
message:reconfiguring zapret2
timeout:600

[shared_apply]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh shared-apply-run
parameters:%s %s
type:script_output
message:applying a single native Voice or Strategies transaction under original FD9
timeout:600

[shared_recover_reviewed_legacy]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh shared-apply-recover-reviewed-legacy
parameters:
type:script_output
message:attested restoration of ordinary Strategies after failed first Voice Apply
timeout:90

[status]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh status; exit 0
parameters:
type:script_output
message:zapret2 status

[voice_inspect]
command:/usr/local/bin/python3.13 /usr/local/opnsense/scripts/OPNsense/Zapret/backend/voice_live_inspect.py; exit 0
parameters:
type:script_output
message:reading native Voice IPFW ownership status (no mutations)
timeout:20

[voice_lifecycle_inspect]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh native-voice-lifecycle-inspect
parameters:
type:script_output
message:reading saved native Voice lifecycle and cutover ownership (read-only)
timeout:30

[voice_candidate_preflight]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh native-voice-candidate-preflight
parameters:
type:script_output
message:validating saved native Voice candidate under the lifecycle lock (read-only)
timeout:30

[voice_preview_draft]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh native-voice-preview-draft
parameters:%s %s
type:script_output
message:read-only validation of saved Voice OFF drafts under original lifecycle and Config locks
timeout:30

[telegram_voice_enable]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh telegram-voice-enable
parameters:
type:script_output
message:applying saved native Telegram Voice ON via shared Config/runtime/IPFW
timeout:600

[telegram_voice_disable]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh telegram-voice-disable
parameters:
type:script_output
message:applying saved native Telegram Voice OFF via shared Config/runtime/IPFW
timeout:600

[telegram_voice_status]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/zapret_service.sh telegram-voice-status; exit 0
parameters:
type:script_output
message:reading verified native Telegram profile or unmigrated legacy PoC (read-only)
timeout:30

[strategy_lab_guard]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_guard.sh
parameters:
type:script_output
message:checking Strategy Lab lifecycle ownership
timeout:10

[strategy_lab_start]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_launcher.sh start
parameters:%s %s %s %s %s %s %s %s
type:script_output
message:starting Strategy Lab job
timeout:180

[strategy_lab_status]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_launcher.sh status
parameters:%s
type:script_output
message:reading Strategy Lab job status
timeout:180

[strategy_lab_cancel]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_launcher.sh cancel
parameters:%s
type:script_output
message:canceling Strategy Lab job
timeout:180

[strategy_lab_result]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_launcher.sh result
parameters:%s
type:script_output
message:reading Strategy Lab job result
timeout:180

[strategy_lab_circular_start]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_circular_launcher.sh start
parameters:%s
type:script_output
message:starting temporary Strategy Lab circular validation
timeout:180

[strategy_lab_circular_status]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_circular_launcher.sh status
parameters:
type:script_output
message:reading temporary Strategy Lab circular validation status
timeout:180

[strategy_lab_circular_stop]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/strategy_lab_circular_launcher.sh stop
parameters:
type:script_output
message:stopping temporary Strategy Lab circular validation
timeout:180

[testdomain]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/test_domain.sh
parameters:%s
type:script_output
message:testing domain connectivity
timeout:30

[setup_install]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/setup_launcher.sh install
parameters:%s
type:script
message:starting selected zapret2 runtime setup
timeout:30

[setup_releases]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/setup.sh show
parameters:
type:script_output
message:listing stable zapret2 releases
timeout:90

[setup_status]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/setup_launcher.sh status
parameters:
type:script_output
message:reading zapret2 runtime status
timeout:30

[extra_resources_preflight]
command:/usr/local/bin/python3.13 /usr/local/opnsense/scripts/OPNsense/Zapret/extra_resources_preflight.py preflight
parameters:
type:script_output
message:read-only immutable catalog integrity and filesystem collision preflight (never installs)
timeout:180

[extra_resources_remove_plan]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/extra_resources_launcher.sh plan
parameters:
type:script_output
message:read-only exact Git HEAD removal counts under setup.lock and original FD9
timeout:120

[extra_resources_install]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/extra_resources_launcher.sh install
parameters:%s
type:script
message:starting manually requested extra-resources installation
timeout:30

[extra_resources_remove]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/extra_resources_launcher.sh remove
parameters:%s %s %s
type:script
message:starting confirmed native resource removal under original setup.lock and FD9
timeout:30

[extra_resources_status]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/extra_resources_launcher.sh status
parameters:
type:script_output
message:reading extra-resources operation state
timeout:20

[extra_resources_inventory]
command:/usr/local/bin/python3.13 /usr/local/opnsense/scripts/OPNsense/Zapret/extra_resources_inventory_cache.py show
parameters:
type:script_output
message:reading cached resource names for Strategies help
cache:0
timeout:5

[extra_resources_recover]
command:/usr/local/opnsense/scripts/OPNsense/Zapret/extra_resources_launcher.sh recover
parameters:
type:script
message:starting attested managed-resources rollback from interrupted transaction
timeout:30
